<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 공책 그정도 아님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-width column of white cards on grey with a fixed bottom tab bar (홈 · 사냥 · 캐릭터 · 가방 · 기록); battles take over the whole column */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f4f5f7; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --line:#e5e8eb;
  --accent:#3182f6; --accent-soft:#e8f3ff; --accent-ink:#ffffff; --red:#f04452; --red-soft:#ffe1e4; --good:#20a464; --gold:#e5a50a;
  --hp:#f04452; --mp:#3182f6; --exp:#ffb400; --tabicon:#b0b8c1;
  --r0:#8b95a1; --r1:#20a464; --r2:#3182f6; --r3:#8b5cf6; --r4:#e5a50a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#1b1f26; --surface-2:#242a33; --ink:#eef1f4; --sub:#b0b8c1; --muted:#7d8692; --line:#2c333d;
  --accent:#4d94ff; --accent-soft:#1d2a3d; --red-soft:#3a1d22; --tabicon:#5d6672; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#1b1f26; --surface-2:#242a33; --ink:#eef1f4; --sub:#b0b8c1; --muted:#7d8692; --line:#2c333d;
  --accent:#4d94ff; --accent-soft:#1d2a3d; --red-soft:#3a1d22; --tabicon:#5d6672; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 104px}
.app.notabs{padding-bottom:28px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 2px 12px}
.top h1{font-size:20px}
.top .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .right{display:flex;gap:6px;align-items:center;flex:none}
.gold{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;background:var(--surface);padding:6px 11px;border-radius:999px}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,#e5a50a);box-shadow:inset 0 0 0 1.5px #c58a00;flex:none}
.card{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:12px;min-width:0}
.card h2{font-size:17px;margin:0 0 12px}
.card h2.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .aside{font-size:13px;font-weight:500;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.doll{position:relative;width:64px;height:64px;flex:none;display:block}
.doll img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.town{position:relative;border-radius:20px;overflow:hidden;height:250px;margin-bottom:12px;background:linear-gradient(180deg,#9fd0f5 0%,#cfe9fb 55%,#e9dcc0 56%,#d9c49c 100%)}
.townbg i{position:absolute;bottom:44%;background:#f3e6cf;border:2px solid #b7926a;border-radius:4px}
.townbg i:before{content:"";position:absolute;left:-10%;right:-10%;bottom:100%;height:28px;background:#c95b4a;clip-path:polygon(50% 0,100% 100%,0 100%)}
.townbg .h1{left:6%;width:64px;height:54px}.townbg .h2{right:8%;width:78px;height:66px}.townbg .h3{left:38%;width:46px;height:38px;bottom:52%;opacity:.7}
.town .npcbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;background:none;border:0;padding:0}
.town .npc{display:block;height:196px;width:auto;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 62%,transparent 100%)}
.town{height:270px}
.town .talk{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.96);border:2px solid #7d8fb3;border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.5;color:#1d2533;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.town .talk .nm{font-weight:700;color:#2c4f9a;font-size:12.5px}
.town .talk p{margin:0}
.menu{padding:6px}
.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:10px;text-align:left;color:var(--ink)}
.mi+.mi{border-top:1px solid var(--line);border-radius:0}
.mi .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.mi b{display:block;font-size:14.5px}.mi small{display:block;color:var(--muted);font-size:12px}
.mi:disabled{opacity:.5}
.gbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.avatar{width:76px;height:76px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.who{font-size:13px;color:var(--sub)}
.big{font-size:20px;font-weight:700;margin:2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lv{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s}
.bar.thin{height:5px;margin-top:6px}
.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
.barlabel b{color:var(--ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.stats3 .k{font-size:12px;color:var(--muted)} .stats3 .v{font-size:17px;font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:11px 0;width:100%;background:none;border:0;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.ic{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--sub);font-size:18px}
.ic.blue{background:var(--accent-soft);color:var(--accent)}
.item .t{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .d{font-size:13px;color:var(--muted);display:block}
.chev{color:var(--tabicon);font-size:18px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:500;font-size:14px;padding:10px 14px;line-height:1.3}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.soft{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.btn.link{background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:12.5px}
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:16px;margin:4px 0 12px}
.cta.soft{background:var(--accent-soft);color:var(--accent)}
.cta:disabled{opacity:.45}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;width:100%;max-width:480px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--tabicon);background:none;border:0;padding:2px 0;position:relative}
.tab.on{color:var(--ink);font-weight:700}
.tab .dot{position:absolute;top:2px;left:calc(50% + 10px)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;font-size:13.5px;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--sub)}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.gold{color:var(--gold)}
.rar0{color:var(--r0)} .rar1{color:var(--r1)} .rar2{color:var(--r2)} .rar3{color:var(--r3)} .rar4{color:var(--r4)}
.rb0{border-color:var(--r0)!important} .rb1{border-color:var(--r1)!important} .rb2{border-color:var(--r2)!important} .rb3{border-color:var(--r3)!important} .rb4{border-color:var(--r4)!important}
.label{font-size:13px;color:var(--sub);font-weight:500;margin:4px 0 8px}
.opt{display:grid;gap:2px;text-align:left;padding:11px 12px;background:var(--surface-2);border:2px solid transparent;border-radius:12px}
.opt b{font-size:14.5px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:.45}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fade{animation:fade .3s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar>i{transition:none}}
/* hunting grounds */
.gr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gr:first-of-type{border-top:0}
.gr.lock{opacity:.45}
.gr.rec{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:14px;border-top:0}
.mons{display:flex;flex:none}
.mons img{width:46px;height:46px;margin-right:-8px}
/* character */
.stage{background:linear-gradient(180deg,var(--accent-soft),var(--surface-2));border-radius:18px;height:200px;display:grid;place-items:center;margin-bottom:12px}
.stage .doll{width:160px;height:160px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:var(--surface-2);border:0;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.sq{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;border:2px solid transparent;overflow:hidden;flex:none}
.sq img{width:34px;height:34px;image-rendering:pixelated;image-rendering:crisp-edges}
.sq svg{width:24px;height:24px}
.slot .nm{font-size:12px;font-weight:500;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.slot .nm small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.slot.empty .sq{border:1.5px dashed var(--line);background:transparent}
.slot.empty .nm{color:var(--muted)}
.slots.rings{grid-template-columns:repeat(5,1fr)}
.rings .slot{padding:8px 2px 6px}
.rings .sq{width:36px;height:36px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.st{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
.st .k{color:var(--sub)} .st.key .k{color:var(--ink);font-weight:700}
.st b{font-weight:700}
.st .b{font-size:11.5px;color:var(--good);font-weight:500}
.plus{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;border:0;padding:0}
.skill{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:9px 12px;margin-top:6px;width:100%;border:2px solid transparent;text-align:left}
.skill .el{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none;background:var(--surface)}
.skill .t{flex:1;font-weight:500;font-size:14px;min-width:0}
.skill .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.skill .mpc{font-size:12px;font-weight:700;color:var(--mp);flex:none}
.skill.lock{opacity:.45}
.skill.tree.lock{opacity:1}.skill.tree.lock .el,.skill.tree.lock .t{opacity:.55}
.skill.tree .plus:disabled{opacity:.3}
.skill.best{border-color:var(--red);background:var(--red-soft)}
.skill.best .t small{color:var(--red)}
.skill:disabled{opacity:.45}
.jobcard{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--surface-2);margin-top:8px;border:2px solid transparent;width:100%;text-align:left}
.jobcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.jobcard img{width:72px;height:72px;flex:none}
.jobcard:disabled{opacity:.45}
.route{font-size:12px;color:var(--accent);font-weight:500;margin-top:2px;display:block}
/* equipment paper doll: faint body outline with slots on the body parts */
.pd{position:relative;width:280px;height:350px;margin:0 auto}
.pd svg.body{position:absolute;inset:0;width:100%;height:100%;fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.pd .ps{position:absolute;transform:translate(-50%,-50%)}
.ps{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;width:64px}
.ps .sq{width:48px;height:48px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ps.empty .sq{border:1.5px dashed var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);box-shadow:none}
.ps small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.ps.on .sq{box-shadow:0 0 0 3px var(--accent)}
.ps.fit .sq{box-shadow:0 0 0 3px var(--accent);animation:blink 1s infinite}
@media (prefers-reduced-motion:reduce){.ps.fit .sq{animation:none}}
.ps.blocked .sq{border:1.5px solid var(--line);background:var(--surface-2);box-shadow:none;color:var(--red);font-size:26px;font-weight:700;line-height:1}
.ps.blocked small{color:var(--red)}
.ringrow{display:flex;justify-content:center;gap:8px;margin-top:6px}
.ringrow .ps{position:static;transform:none;width:52px}
.ringrow .ps .sq{width:40px;height:40px}
/* bag */
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--surface-2);position:relative;display:grid;place-items:center;border:2px solid transparent;padding:0}
.cell img{width:34px;height:34px;image-rendering:pixelated;image-rendering:crisp-edges}
.cell svg{width:26px;height:26px}
.cell .new{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cell.blank{background:transparent;border:1.5px dashed var(--line)}
.eff{font-size:13px;color:var(--sub);line-height:1.6}
.eff b{color:var(--ink)}
.cmp.up{color:var(--good)} .cmp.down{color:var(--red)}
/* create */
.cstage{height:220px}
.cstage .doll{width:160px;height:160px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.sw:disabled{opacity:.35}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:10px}
.field input,.field select{font:inherit;color:var(--ink);background:none;border:0;text-align:right;padding:7px 8px;min-width:0;flex:1}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px;color:var(--ink);background:var(--surface-2);border:0;border-radius:12px;padding:10px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:9;max-width:calc(100% - 32px);text-align:center;animation:fade .25s ease-out both}
/* battle */
.turnbar{background:var(--surface);border-radius:18px;padding:12px 14px;margin:12px 0 10px}
.turnbar .hd{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.turnbar .hd b{color:var(--ink)}
.press{display:flex;gap:5px;align-items:center}
.press i{width:13px;height:13px;transform:rotate(45deg);border-radius:3px;background:var(--accent);display:inline-block}
.press i.half{background:linear-gradient(135deg,var(--accent) 50%,var(--accent-soft) 50%);animation:blink 1s infinite}
.press i.used{background:var(--line)}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.press i.half{animation:none}}
.order{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(4,minmax(0,1fr));gap:6px;align-items:end}
.tk{min-width:0;width:100%;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted)}
.tk span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tk .face{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;border:2px solid transparent}
.tk .face{flex:none}
.tk .face>img{width:100%;height:100%}
.tk.me .face{border-color:var(--accent);background:var(--accent-soft)}
.tk.foe .face{border-color:var(--red-soft)}
.tk.now .face{width:52px;height:52px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.tk.now.foe .face{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--red)}
.tk.now span{color:var(--ink);font-weight:700}
.field2{position:relative;border-radius:20px;overflow:hidden;height:300px;background:linear-gradient(180deg,#bfe3c6 0%,#9fd3ab 55%,#6fae78 56%,#5c9a66 100%)}
.field2:before{content:"";position:absolute;left:0;right:0;top:0;height:150px;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(40,90,50,.18) 34px 62px)}
.field2.g1{background:linear-gradient(180deg,#a9cfa3 0%,#7fb07a 55%,#4f7f4c 56%,#3f6b3d 100%)}
.field2.g2,.field2.g5{background:linear-gradient(180deg,#6b6f80 0%,#575b6a 55%,#444652 56%,#36373f 100%)}
.field2.g3{background:linear-gradient(180deg,#c9b38f 0%,#a88f6c 55%,#7d6a4e 56%,#6a5941 100%)}
.field2.g4{background:linear-gradient(180deg,#8fa58a 0%,#6d8566 55%,#4c5f45 56%,#3e4f38 100%)}
.field2.g6{background:linear-gradient(180deg,#e6a77a 0%,#c98a5f 55%,#9a6545 56%,#80533a 100%)}
.field2.g7{background:linear-gradient(180deg,#d9eef8 0%,#b5dbef 55%,#8dbfd9 56%,#79acc8 100%)}
.field2.g8{background:linear-gradient(180deg,#f4dfa8 0%,#e7c983 55%,#c9a55f 56%,#b8934f 100%)}
.field2.g9{background:linear-gradient(180deg,#6a3540 0%,#55293233 55%,#3b1e24 56%,#2e171b 100%)}
.foes{position:absolute;top:22px;left:0;right:0;display:flex;justify-content:space-around;padding:0 6px}
.foe{display:flex;flex-direction:column;align-items:center;gap:3px;width:31%;position:relative;background:none;border:0;padding:0}
.foe .spr{width:84px;height:84px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.foe .nm{font-size:11px;font-weight:700;color:#173b20;background:rgba(255,255,255,.85);padding:1px 7px;border-radius:99px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.foe .hpb{width:80%;height:6px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.foe .hpb i{display:block;height:100%;background:var(--hp);transition:width .3s}
.foe.dead{opacity:0;pointer-events:none;transition:opacity .35s .45s}
.foe.pick .spr{animation:bob .8s infinite}
.foe.pick:after{content:"▼";position:absolute;top:-16px;color:var(--red);font-size:14px}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.foe.pick .spr{animation:none}}
.weak{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.weak span{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.85);color:#5a6470}
.weak span.w{background:#ffe1e4;color:#d4233a}
.weak span.r{background:#e6eefc;color:#5871a8}
.pop{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-weight:900;font-size:19px;color:#fff;-webkit-text-stroke:1.5px var(--red);text-shadow:0 2px 0 var(--red);white-space:nowrap;animation:ropop .6s ease-out both;z-index:4}
.pop.weakp{font-size:12px;-webkit-text-stroke:0;text-shadow:none;background:var(--red);padding:0 7px;border-radius:6px;top:-18px}
.pop.miss{-webkit-text-stroke:1.5px #5871a8;text-shadow:0 2px 0 #5871a8}
.fxc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:3}
@keyframes ropop{0%{transform:translate(-50%,8px) scale(1.5);opacity:0}25%{transform:translate(-50%,-20px) scale(1.1);opacity:1}55%{transform:translate(-50%,-6px) scale(1)}75%{transform:translate(-50%,-12px)}100%{transform:translate(-50%,-8px)}}
.plat{position:absolute;border-radius:50%;background:rgba(20,40,25,.25)}
.plat.me{left:4px;bottom:-26px;width:170px;height:46px}
.me-on{position:absolute;left:-6px;bottom:-34px;width:190px;height:190px}
.me-on .doll{width:190px;height:190px}
.me-on.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.blog{position:absolute;right:12px;bottom:14px;left:168px;background:rgba(25,31,40,.85);color:#fff;font-size:12.5px;border-radius:12px;padding:8px 10px;line-height:1.45;min-height:40px}

.bpanel{background:var(--surface);border-radius:20px;padding:14px;margin-top:10px}
.bstat{display:flex;gap:12px;align-items:center}
.bstat .nm{font-weight:700;font-size:14px;min-width:74px}
.bstat .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.bars2{flex:1;display:grid;gap:5px}
.bl{display:grid;grid-template-columns:22px 1fr 76px;gap:6px;align-items:center;font-size:11.5px;color:var(--sub)}

.bl .b i{display:block;height:100%;transition:width .3s}
.bl span:last-child{text-align:right;font-weight:700;color:var(--ink)}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cmd{border:0;border-radius:14px;background:var(--surface-2);padding:12px 4px;font-weight:700;font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}

.result .big2.lose{color:var(--red)}
.rewards{display:flex;justify-content:center;gap:16px;font-weight:700;flex-wrap:wrap;margin-top:8px}

  switch (o.kind){

    case 'heal': return `HP ${pc(o.pct)} 회복`;
    case 'guard': return '이번 턴 받는 피해 절반, 행동 끝';
    case 'scan': return '적 약점 공개 · 전투마다 첫 번은 행동 소모 없음';

    case 'debuff': return `3라운드 적 전체 방어력 −${pc(o.v)}`;

const newDraft = () => ({name:pick(NAMES), origin:ORIGINS[4], cand:0, hair:0, skin:0, gender:'m'});
let draft = newDraft();
const UI = {auto:null, homeLine:null, tab:'home', bag:'equip', rec:'daily', sel:null, ringPick:false, slotSel:null, jobPick:null, routePick:null, tree:null};
const app = document.getElementById('app');
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const save = () => { if (S) store.set(SAVE_KEY, S); };
let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 2200);
}

/* ---------- items ---------- */
const bandFor = lv => clamp(Math.floor(lv/5), 0, 9);
function makeItem(slot, band, rar, deep){
  const it = {id:uid(), slot, band:clamp(band,0,9), rar:clamp(rar,0,4), isNew:true};
  if (deep) it.deep = true;
  if (slot==='ring') it.st = pick(STATS)[0];
  if (slot==='sub') it.kind = subRule().kind || pick(Object.keys(SUB_KINDS));
  return it;
}
const randomSlot = () => pick(LOOT_SLOTS);
function itemInfo(it){
  const b = it.band, r = it.rar, sp = SLOT_SPEC[it.slot], mult = (1 + .15*r) * (it.deep ? 1.7 : 1);
  const v = w => Math.max(1, Math.round(((b+1)*w + r*.6) * (it.deep ? 1.6 : 1)));
  const bon = {};
  const K = it.slot==='sub' ? SUB_KINDS[it.kind||'shield'] : null;
  if (it.slot==='ring') bon[it.st] = v(.5);
  else (K ? K.bon : sp.bon).forEach(([k,w]) => { const kk = k==='main' ? JOBS[S.job].main : k; bon[kk] = (bon[kk]||0) + v(w); });
  const base = it.slot==='ring' ? `${ITEM_NAMES.ring[b]} ${SN[it.st]}의 반지` : K ? K.names[b] : ITEM_NAMES[it.slot][b];
  return {
    name: (it.deep ? '심연의 ' : '') + base, reqLv: BANDS[b], reqJob: !!it.deep,
    atk: it.slot==='weapon' ? Math.round(ATK[b]*mult) : K && K.atk ? Math.round(ATK[b]*K.atk*mult) : 0,
    def: (K ? K.def : sp.def) ? Math.round(DEF[b]*(K ? K.def : sp.def)*mult) : 0, bon, kind: K ? K.n : null,
    set: ARMOR_SET_SLOTS.includes(it.slot) ? b : null,
    price: Math.round((b+1)*(r+1)*12*(it.deep?2:1)),
  };
}
const lvOk = info => info.reqJob ? isJob() && S.lv >= info.reqLv : (isJob() || S.lv >= info.reqLv);
const subOk = it => it.slot!=='sub' || subRule().kind === (it.kind||'shield');
const canWear = (info, it) => lvOk(info) && (!it || subOk(it));
const wearWhy = (info, it) => !lvOk(info) ? `${reqText(info)} 필요` : `지금 직업은 ${info.kind} 장착 불가`;
function dropBadSub(){ const it = S.equip.sub; if (it && !subOk(it)){ S.equip.sub = null; if (S.bag.length < BAG_MAX) S.bag.push(it); } }
const reqText = info => info.reqJob ? `전직 후 Lv.${info.reqLv}` : `Lv.${info.reqLv}`;
const equipped = () => [...SLOT_ORDER, ...RING_SLOTS].map(s=>S.equip[s]).filter(Boolean);
const itemLabel = it => `<span class="rar${it.rar}">${RARITY[it.rar]} ${itemInfo(it).name}</span>`;

/* ---------- character numbers ---------- */
const job = () => JOBS[S.job];
function bonus(stat){ let b = 0; for (const it of equipped()) b += itemInfo(it).bon[stat] || 0; return b; }
const eff = k => S.stats[k] + bonus(k);
const PL = () => effLv();
const gearAtk = () => equipped().reduce((s,it)=>s+itemInfo(it).atk,0);
const gearDef = () => equipped().reduce((s,it)=>s+itemInfo(it).def,0);
const atk = () => Math.round((5 + eff(job().main)*1.1 + gearAtk() + PL()*2) * (1 + pas('atk') + bf('atk')));
const matk = () => Math.round((5 + Math.max(eff('int'), eff('spi'))*1.2 + gearAtk()*.6 + PL()*2) * (1 + pas('matk') + bf('atk')));
const def = () => Math.round((eff('vit')/2 + gearDef() + PL()) * (1 + bf('def')));
const crit = () => 3 + Math.floor(eff('luk')/6) + Math.round(pas('crit') + bf('crit'));
const spd = () => Math.round((10 + eff('agi')/2 + PL()*.3) * (1 + pas('spd') + bf('spd')));
const hpMax = () => Math.round((80 + PL()*12 + eff('vit')*2) * (1 + pas('hp')));
const mpMax = () => Math.round(30 + PL()*4 + eff('int') + eff('spi'));
const cp = () => Math.round(job().key.reduce((s,k)=>s+eff(k),0)/3 + PL()*.6);
function clampVitals(){ S.hp = clamp(S.hp ?? hpMax(), 0, hpMax()); S.mp = clamp(S.mp ?? mpMax(), 0, mpMax()); }
function gainExp(n){
  n = Math.max(0, Math.round(n)); let ups = 0;
  if (S.lv >= maxLv()){ S.exp = 0; return 0; }
  S.exp += n; const hp0 = hpMax(), mp0 = mpMax();
  while (S.lv < maxLv() && S.exp >= needExp(S.lv)){ S.exp -= needExp(S.lv); S.lv++; S.points += 2; S.sp = (S.sp||0) + 1; ups++; }
  if (S.lv >= maxLv()) S.exp = 0;
  if (ups){ S.hp = Math.min(hpMax(), S.hp + hpMax() - hp0); S.mp = Math.min(mpMax(), S.mp + mpMax() - mp0); }
  return ups;
}
function gainItem(it){
  if (S.bag.length >= BAG_MAX) return false;
  S.bag.push(it); S.tot.items++; if (it.rar===4) S.tot.legend++;
  return true;
}

/* ---------- daily missions ---------- */
const DAILY_POOL = [
  {type:'kill', n:30, t:'몬스터 30마리 처치', rew:{gold:120}},
  {type:'win', n:10, t:'전투 10번 승리', rew:{hp:2}},
  {type:'weak', n:15, t:'약점 공격 15번', rew:{mp:2}},
  {type:'skill', n:12, t:'스킬 12번 사용', rew:{gold:100}},
  {type:'nohit', n:3, t:'피해 없이 승리 3번', rew:{hp:1, mp:1}},
];
function ensureDaily(){
  if (S.daily && S.daily.date === today()) return;
  const pool = DAILY_POOL.slice().sort(()=>Math.random()-.5).slice(0,3);
  S.daily = {date:today(), list:pool.map(m=>({...m, p:0, claimed:false}))};
}
function dailyProgress(type, n){ if (!S.daily) return; for (const m of S.daily.list) if (m.type===type && !m.claimed) m.p = Math.min(m.n, m.p + n); }
const dailyReady = () => S.daily ? S.daily.list.filter(m=>!m.claimed && m.p>=m.n).length : 0;
const rewText = r => [r.gold?`골드 ${r.gold*(1+S.fac)}`:'', r.hp?`체력 물약 ${r.hp}`:'', r.mp?`마나 물약 ${r.mp}`:''].filter(Boolean).join(' · ');
function claimDaily(i){
  const m = S.daily.list[i]; if (!m || m.claimed || m.p < m.n) return;
  m.claimed = true; if (m.rew.gold) S.gold += m.rew.gold*(1+S.fac); if (m.rew.hp) S.inv.hp += m.rew.hp; if (m.rew.mp) S.inv.mp += m.rew.mp;
  toast(`일일 미션 완료 · ${rewText(m.rew)}`); save(); render();
}

/* ---------- new game ---------- */
function candidates(){
  const C = JOBS.novice, others = STATS.map(s=>s[0]).filter(k=>!C.key.includes(k));
  const keyVals = [[45,45,45],[52,45,38],[38,45,52]], otherVals = [[40,35,30],[35,40,30],[30,40,35]], names = ['균형형','강타형','철벽형'];
  return keyVals.map((kv,i) => { const st = {}; C.key.forEach((k,j)=>st[k]=kv[j]); others.forEach((k,j)=>st[k]=otherVals[i][j]); return {style:names[i], stats:st}; });
}
function newGame(){
  const c = candidates()[draft.cand];
  S = {ver:VER, name:draft.name.trim() || '이름 없는 견습생', origin:draft.origin, gender:draft.gender, hair:draft.hair, skin:draft.skin, style:c.style,
    stats:{...c.stats}, job:'novice', route:null, lv:1, exp:0, points:0, hp:null, mp:null, gold:80, inv:{hp:3, mp:2}, mats:{},
    fac:0, train:0, equip:{weapon:makeItem('weapon',0,0), top:makeItem('top',0,0), bottom:makeItem('bottom',0,0)}, bag:[],
    tot:{kills:0, wins:0, battles:0, weak:0, items:0, legend:0, losses:0}, titles:[], title:null, seen:{}, daily:null, sk:{}, sp:1};
  Object.values(S.equip).forEach(it=>it.isNew=false);
  for (const s of [...SLOT_ORDER, ...RING_SLOTS]) if (!(s in S.equip)) S.equip[s] = null;
  clampVitals(); ensureDaily(); save();
}

function spawn(g, deep, elite){
  const G = GD[g], [lo,hi] = groundLv(g, deep);
  const n = elite ? 3 : (Math.random()<.25 ? 1 : Math.random()<.6 ? 2 : 3);
  const foes = [];
  for (let i=0;i<n;i++){
    const k = rnd(0,1), M = G.mons[k], m = elite ? clamp(effLv(), lo, hi + 2) : rnd(lo,hi), st = monStats(m), mul = elite ? 1.2 : 1;
    foes.push({id:`${g}-${k}`, name:(elite?'정예 ':'') + M.name + (n>1 ? ' '+'ABC'[i] : ''), spr:SPR['m'+(g*2+k)], m,
      hp:Math.round(st.hp*mul), max:Math.round(st.hp*mul), atk:Math.round(st.atk*mul), def:Math.round(st.def*mul),
      spd:st.spd * (S.route==='trapper'?.8:1) + Math.random()*4,
      weak:M.weak, resist:M.resist, acts:M.act.split('·').map(s=>s.trim().replace(/\(.*$/,'')), drop:M.drop});
  }
  return foes;
}
function startBattle(g, deep, mode){
  if (S.hp <= 1){ toast('HP가 없다. 물약을 쓰거나 여관에서 쉬자.'); return; }
  B = {g, deep, mode:mode||'hunt', foes:spawn(g, deep, mode==='promo'), round:1, queue:[], icons:[], guard:false, buffs:{}, debuff:null, enchant:null, scanUsed:false,
    took:0, log:'', pops:{}, sub:null, target:null, over:null, stage:mode==='promo'?1:0, turnFoe:null};
  S.tot.battles++;
  newRound(); save(); render(); runFoes(); window.scrollTo({top:0});
}
function newRound(){
  const actors = [{who:'me', s:spd() + Math.random()*4}, ...B.foes.map((f,i)=>({who:i, s:f.spd + Math.random()*4})).filter(a=>B.foes[a.who].hp>0)];
  actors.sort((a,b)=>b.s-a.s);
  B.queue = actors.map(a=>a.who);
  advance();
}
function upcoming(){
  const list = B.queue.filter(w => w==='me' || B.foes[w].hp>0);
  const next = ['me', ...B.foes.map((f,i)=>i).filter(i=>B.foes[i].hp>0)];
  while (list.length < 5) list.push(...next);
  return list.slice(0,5);
}
function advance(){
  if (checkEnd()) return;
  B.queue = B.queue.filter(w => w==='me' || B.foes[w].hp>0);
  if (!B.queue.length){ B.round++; tickBuffs(); newRound(); return; }
  const w = B.queue[0];
  if (w==='me'){ B.icons = ['f','f']; B.guard = false; B.sub = null; B.turnFoe = null;
    const rg = Math.round(hpMax()*pas('regen')); if (rg && S.hp < hpMax()){ S.hp = Math.min(hpMax(), S.hp + rg); B.pops = {...B.pops, me:'+'+rg}; } return; }
  B.turnFoe = w;

function tickBuffs(){

function useIcon(kind){

const relation = (f, attr) => f.weak.includes(attr) ? 'weak' : f.resist.includes(attr) ? 'resist' : 'normal';

  if (rel==='resist') dmg = Math.round(dmg*.5);
  if (c) dmg = Math.round(dmg*1.5);

  if (miss) dmg = 0;

function fxField(){ const f = document.querySelector('.field2'); return f && f.getBoundingClientRect(); }
function fxAt(el, dy=0){

function fxTick(now){

function star(c, x, y, s, P){ px2(c,x,y,s+1,P[1]); px2(c,x-s-1,y,s,P[2]); px2(c,x+s+1,y,s,P[2]); px2(c,x,y-s-1,s,P[2]); px2(c,x,y+s+1,s,P[2]); px2(c,x,y,s,P[0]); }

let foeTimer = null;

function checkEnd(){

function win(){
  if (B.mode==='promo' && B.stage < 3){
    B.stage++; B.foes = spawn(B.g, B.deep, true); B.round = 1; B.target = null;
    const heal = Math.round(hpMax()*.3); S.hp = Math.min(hpMax(), S.hp + heal);
    B.log = `시련 ${B.stage}/3 · 숨을 고르고 HP ${heal} 회복. 정예 몬스터가 나타났다!`; B.pops = {};
    newRound(); return;
  }
  const n = B.foes.length; let exp = 0, gold = 0; const mats = {};
  for (const f of B.foes){
    let e = mexp(f.m); const diff = effLv() - f.m;
    if (diff >= 10) e *= .1; else if (diff >= 5) e *= .5; else if (diff <= -3) e *= 1.2;
    exp += e; gold += rnd(2, 4) + Math.round(f.m*.8);
    if (Math.random() < .5) mats[f.drop] = (mats[f.drop]||0) + 1;
  }
  exp = Math.round(exp * (1 + facBonus())); gold = Math.round(gold * (1 + facBonus()));
  const ups = gainExp(exp);
  S.gold += gold; for (const k in mats) S.mats[k] = (S.mats[k]||0) + mats[k];
  S.tot.kills += n; S.tot.wins++;
  dailyProgress('kill', n); dailyProgress('win', 1); if (!B.took) dailyProgress('nohit', 1);
  let loot = null;
  if (B.mode==='promo' || Math.random() < .12 + n*.04){
    const rar = clamp((Math.random()<.5?0:Math.random()<.6?1:Math.random()<.7?2:3) + (B.mode==='promo'?1:0), 0, 4);
    const it = makeItem(randomSlot(), B.g, rar, B.deep); loot = gainItem(it) ? it : 'full';
  }
  let promo = null;
  if (B.mode==='promo'){ S.fac++; promo = FACTIONS[S.fac].name; S.titles.push(promo + ' 입단'); }
  B.over = {win:true, exp, gold, mats, loot, ups, promo, n};
}
function lose(){

  S.gold -= lostGold; S.exp -= lostExp; S.hp = Math.round(hpMax()*.5); S.tot.losses++;

/* ---------- auto hunt: 10 quick battles, then a 1-minute cooldown ---------- */
const AUTO_N = 10, AUTO_CD = 60000;
const autoLeft = () => Math.max(0, (S.autoAt||0) + AUTO_CD - Date.now());
function simBattle(g, deep){
  B = {g, deep, mode:'auto', foes:spawn(g, deep, false), round:1, buffs:{}, debuff:null, enchant:null, guard:false, took:0, pops:{}, over:null};
  S.tot.battles++;
  const skills = learnedActive().filter(s=>s.kind==='dmg');
  const dual = S.route==='dagger' && S.equip.sub && S.equip.sub.kind==='dagger';
  for (let r=0; r<40 && S.hp>0 && B.foes.some(f=>f.hp>0); r++){
    S.hp = Math.min(hpMax(), S.hp + Math.round(hpMax()*pas('regen')));
    for (let a=0; a<2; a++){
      const alive = B.foes.filter(f=>f.hp>0); if (!alive.length) break;
      const t = alive.slice().sort((x,y)=>x.hp-y.hp)[0], weak = knownWeak(t);
      const sk = skills.find(s=>S.mp>=s.mp && weak.includes(s.attr)) || (alive.length>1 ? skills.find(s=>s.all && S.mp>=s.mp) : null);
      if (sk){ S.mp -= sk.mp; dailyProgress('skill',1); for (const f of (sk.all ? alive : [t])) for (let h=0; h<sk.hits; h++) hitFoe(f, sk.attr, sk.mult*(1+pas('skill')), sk.magic); }
      else { const n = 1 + (dual?1:0) + (Math.random() < pas('double') ? 1 : 0); for (let h=0; h<n; h++) hitFoe(t, job().attr, 1, false); }
    }
    for (const f of B.foes) if (f.hp>0 && S.hp>0){ const o = foeHit(f); if (!o.dodge){ S.hp = Math.max(0, S.hp - o.dmg); B.took += o.dmg; } }
    if (S.hp>0 && S.hp < hpMax()*.3 && S.inv.hp){ S.inv.hp--; S.hp = Math.min(hpMax(), S.hp + Math.round(hpMax()*.5)); }
  }
  if (S.hp<=0) lose(); else if (B.foes.every(f=>f.hp<=0)) win(); else B.over = {run:true};
  const o = B.over; B = null; return o;
}
function autoHunt(g, deep){
  if (autoLeft()){ toast(`자동 사냥은 ${Math.ceil(autoLeft()/1000)}초 뒤에 다시 할 수 있다.`); return; }
  if (!groundOpen(g, deep)) return;
  if (S.hp < hpMax()*.35){ toast('HP가 너무 낮다. 쉬고 가자.'); return; }
  const R = {g, deep, n:0, wins:0, exp:0, gold:0, kills:0, ups:0, items:[], mats:{}, lost:null, stop:null, hp0:S.inv.hp};
  const lv0 = S.lv;
  for (let i=0; i<AUTO_N; i++){
    if (S.hp < hpMax()*.3 && !S.inv.hp){ R.stop = 'HP가 낮아 멈췄다'; break; }
    const o = simBattle(g, deep); R.n++;
    if (o.win){ R.wins++; R.exp += o.exp; R.gold += o.gold; R.kills += o.n||0; for (const k in o.mats) R.mats[k] = (R.mats[k]||0) + o.mats[k]; if (o.loot && o.loot!=='full') R.items.push(o.loot); if (o.loot==='full') R.full = true; }
    else if (o.lostGold!=null){ R.lost = o; R.stop = '쓰러져서 멈췄다'; break; }
  }
  R.ups = S.lv - lv0; R.potions = R.hp0 - S.inv.hp; S.autoAt = Date.now(); UI.auto = R;
  if (R.lost) say('cross', '정말, 무리하지 말라고 했잖아요! 다음엔 물약 꼭 챙기세요.');
  else if (R.stop) say('panic', 'HP가 바닥이라 돌아오셨군요. 여관에서 쉬고 가세요!');
  else if (R.ups) say('joy', `레벨이 ${R.ups} 올랐어요! 대단해요!`);
  else say('happy', '무사히 다녀오셨네요. 수고하셨어요!');
  save(); render(); window.scrollTo({top:0});
}

        ${lock?`<small style="color:var(--red)">선행: ${req}</small>`:''}</span>
      ${lv<s.max?`<button class="plus" data-act="learn" data-id="${s.id}" ${ok?'':'disabled'} aria-label="${s.n} 배우기">+</button>`:''}</div>`;
  }).join('');
  if (S.route) h += `<p class="small" style="margin-top:10px">루트 · <b>${ROUTE[S.route].name}</b>: ${ROUTE[S.route].desc}</p>`;
  h += `<p class="xs muted" style="margin-top:8px">레벨 업마다 스킬 포인트 1. 선행 스킬을 올려야 다음 스킬이 열린다.</p></section>`;
  return h;
}
function spendPoint(k){ if (!S.points) return; S.stats[k]++; S.points--; clampVitals(); save(); render(); }
function promoReady(){
  const F = FACTIONS[S.fac+1]; if (!F) return false;
  if (F.req.job) return isJob() && S.lv >= F.req.job;
  return isJob() || S.lv >= F.req.lv;
}
const promoReqText = F => F.req.job ? `전직 후 Lv.${F.req.job}` : `Lv.${F.req.lv}`;
function startPromo(){ if (!promoReady()) return; const b = bestGround(); startBattle(b.g, b.deep, 'promo'); }
const canJobChange = () => S.job==='novice' && S.lv >= NOVICE_MAX;
function jobChange(j){
  if (!canJobChange() || !JOBS[j] || j==='novice') return;
  if (S.gender==='f' && j!=='thief'){ toast('여캐는 시프로만 전직할 수 있다.'); return; }
  S.job = j; S.route = null; S.lv = 1; S.exp = 0; S.points += 5;
  dropBadSub(); S.hp = hpMax(); S.mp = mpMax(); S.titles.push(`${job().name} 전직`);
  UI.jobPick = null; toast(`${job().name}(으)로 전직했다! Lv.1부터 다시 시작`); save(); render(); window.scrollTo({top:0});
}
const canRoute = () => isJob() && !S.route && S.lv >= ROUTE_LV;
function chooseRoute(r){
  if (!canRoute() || !ROUTE[r] || ROUTE[r].job!==S.job) return;
  if (r==='dancer' && S.gender!=='f'){ toast('댄서는 여캐 전용이다.'); return; }
  S.route = r; dropBadSub(); S.titles.push(ROUTE[r].name); UI.routePick = null; toast(`${ROUTE[r].name} 루트를 골랐다`); save(); render(); window.scrollTo({top:0});
}
function equipItem(id, ringSlot){
  const i = S.bag.findIndex(x=>x.id===id); if (i<0) return;
  const it = S.bag[i], info = itemInfo(it);
  if (!canWear(info, it)){ toast(wearWhy(info, it)); return; }
  let target = it.slot;
  if (it.slot==='ring'){ target = ringSlot || RING_SLOTS.find(s=>!S.equip[s]); if (!target){ UI.ringPick = true; render(); return; } }
  const off = [S.equip[target]];
  if (it.slot==='suit') off.push(S.equip.top, S.equip.bottom);
  if (it.slot==='top' || it.slot==='bottom') off.push(S.equip.suit);
  const back = off.filter(Boolean);
  if (S.bag.length - 1 + back.length > BAG_MAX){ toast('가방이 가득 찼다.'); return; }
  S.bag.splice(i,1); it.isNew = false;
  if (it.slot==='suit'){ S.equip.top = null; S.equip.bottom = null; }
  if (it.slot==='top' || it.slot==='bottom') S.equip.suit = null;
  S.equip[target] = it; back.forEach(x=>S.bag.push(x));
  UI.sel = null; UI.ringPick = false; clampVitals(); toast(`${info.name} 장착`); save(); render();
}
function unequip(slot){
  const it = S.equip[slot]; if (!it) return;
  if (S.bag.length >= BAG_MAX){ toast('가방이 가득 찼다.'); return; }
  S.equip[slot] = null; S.bag.push(it); clampVitals(); save(); render();
}
function sellItem(id){
  const i = S.bag.findIndex(x=>x.id===id); if (i<0) return;
  const p = itemInfo(S.bag[i]).price; S.gold += p; S.bag.splice(i,1); UI.sel = null; toast(`골드 +${p}`); save(); render();
}
function buyPotion(k){ const P = POTIONS[k]; if (S.gold < P.price){ toast('골드가 모자라다.'); return; } S.gold -= P.price; S.inv[k]++; save(); render(); }
function usePotion(k){
  if (!S.inv[k]) return;
  if (k==='hp'){ if (S.hp>=hpMax()){ toast('HP가 이미 가득하다.'); return; } S.hp = Math.min(hpMax(), S.hp + Math.round(hpMax()*.5)); }
  else { if (S.mp>=mpMax()){ toast('MP가 이미 가득하다.'); return; } S.mp = Math.min(mpMax(), S.mp + Math.round(mpMax()*.5)); }
  S.inv[k]--; save(); render();
}
function sellMats(){
  let g = 0;
  for (const [n,c] of Object.entries(S.mats)){ const gi = GD.findIndex(G=>G.mons.some(m=>m.drop===n)); g += c * 4 * (Math.max(0,gi)+1); }
  if (!g) return; S.mats = {}; S.gold += g; toast(`골드 +${g}`); save(); render();
}

function todos(){
  const T = [];

  if (canRoute()) T.push({ic:'🧭', t:'루트를 고를 수 있어요', d:`${job().name} Lv.${ROUTE_LV} 달성`, go:'char', dot:true});
  if (promoReady()) T.push({ic:'🛡️', t:'승급 시험을 볼 수 있어요', d:`${FACTIONS[S.fac].name} → ${FACTIONS[S.fac+1].name} · 정예 3연전`, go:'char', dot:true});
  const dr = dailyReady();
  if (dr) T.push({ic:'📜', t:`일일 미션 보상 ${dr}개`, d:'기록 탭에서 받기', go:'rec:daily', dot:true});
  else if (S.daily){ const left = S.daily.list.filter(m=>!m.claimed); if (left.length) T.push({ic:'📜', t:`오늘의 미션 ${3-left.length} / 3`, d:left.map(m=>`${m.t} ${m.p}/${m.n}`).join(' · '), go:'rec:daily'}); }
  if (S.sp) T.push({ic:'📘', t:`스킬 포인트 ${S.sp}`, d:'캐릭터 → 스킬 트리에서 배우기', go:'char', dot:true});
  if (S.points) T.push({ic:'💪', t:`능력치 포인트 ${S.points}`, d:'캐릭터에서 분배', go:'char', dot:true});
  const nw = S.bag.filter(x=>x.isNew);
  if (nw.length) T.push({ic:'🎁', t:'새 장비를 얻었어요', d:nw.slice(0,2).map(x=>`${RARITY[x.rar]} · ${itemInfo(x).name}`).join(', ')+(nw.length>2?` 외 ${nw.length-2}개`:''), go:'bag', dot:true});
  if (S.hp < hpMax()*.4) T.push({ic:'🩹', t:'HP가 낮아요', d:`물약 ${S.inv.hp}개 · 여관 ${innCost()}골드`, go:'hunt'});
  return T;
}

// faces: 0 smile+book 1 welcome 2 gentle 3 note-taking 4 surprised 5 happy 6 shy 7 calm 8 blush 9 panic 10 thinking 11 wink 12 glance 13 joy 14 cross
const FACE = {smile:0, welcome:1, gentle:2, note:3, surprised:4, happy:5, shy:6, calm:7, blush:8, panic:9, think:10, wink:11, glance:12, joy:13, cross:14};
function guideLine(){
  if (S.hp < hpMax()*.4) return {f:'panic', t:'어머, 많이 다치셨잖아요! 여관에서 푹 쉬고 가세요.'};
  if (canJobChange()) return {f:'surprised', t:'세상에, 노비스 졸업이에요! 캐릭터 화면에서 직업을 골라 주세요.'};
  if (canRoute()) return {f:'joy', t:'드디어 루트를 고르실 때예요. 어떤 길로 가실지 기대돼요!'};
  if (S.sp) return {f:'wink', t:`스킬 포인트가 ${S.sp}개 남아 있어요. 스킬 트리에서 새 기술을 배워 보세요!`};
  if (promoReady()) return {f:'note', t:`${FACTIONS[S.fac+1].name} 승급 시험을 보실 수 있어요. 준비되셨나요?`};
  if (S.points) return {f:'gentle', t:`능력치 포인트가 ${S.points}개 있어요. 훈련소에서 나눠 주세요.`};
  return pick([{f:'welcome', t:'어서 오세요, 모험가님! 공책 마을 안내원 리나예요. 무엇을 도와드릴까요?'}, {f:'smile', t:'오늘도 사냥 나가세요? 몸조심하세요!'},
    {f:'happy', t:'자동 사냥도 맡겨 주세요. 한 번에 열 번씩 다녀올 수 있어요.'}, {f:'think', t:'약점 속성을 노리면 한 번 더 움직일 수 있대요. 정보 버튼으로 살펴보세요.'},
    {f:'calm', t:'장비는 가방에서 몸 위에 바로 끼울 수 있어요.'}, {f:'blush', t:'에헤헤… 오늘도 와 주셨네요.'}, {f:'glance', t:'일일 미션도 잊지 마세요!'}]);
}
const say = (f, t) => { UI.homeLine = {f, t}; };
function homeView(){
  const b = bestGround(), G = GD[b.g], T = todos();
  let h = top('공책 마을', `${esc(S.name)} · ${lvTag()} · ${FACTIONS[S.fac].name}`, `<button class="btn" style="padding:7px" data-go="rec:save" aria-label="저장 설정">${svg('gear',20)}</button>`);
  h += autoCard();
  if (!UI.homeLine || !UI.homeLine.t) UI.homeLine = guideLine();
  h += `<section class="town"><div class="townbg" aria-hidden="true"><i class="h1"></i><i class="h2"></i><i class="h3"></i></div>
    <button class="npcbtn" data-act="talk" aria-label="리나에게 말 걸기"><img class="npc" src="${NPC_FACE[FACE[UI.homeLine.f]] || NPC_FACE[0]}" alt="안내원 리나"></button>
    <div class="talk"><div class="nm">[안내원] 리나</div><p>${UI.homeLine.t}</p></div></section>
    <section class="card menu">
      <button class="mi" data-act="hunt" data-g="${b.g}" data-deep="${b.deep?1:0}"><span class="ic">⚔️</span><span class="grow"><b>사냥터로 보내 주세요</b><small>${b.deep?'심층 ':''}${G.ground} · 추천</small></span></button>
      <button class="mi" data-act="auto" data-g="${b.g}" data-deep="${b.deep?1:0}" data-autocd ${autoLeft()?'disabled':''}><span class="ic">🔁</span><span class="grow"><b>${autoLeft()?`자동 사냥 · ${Math.ceil(autoLeft()/1000)}초 뒤 가능`:'자동 사냥 맡기기'}</b><small>${G.ground}에서 10번 · 다녀오면 1분 휴식</small></span></button>
      <button class="mi" data-act="rest"><span class="ic">🛏️</span><span class="grow"><b>여관에서 쉬기</b><small>HP·MP 모두 회복 · ${innCost()}골드</small></span></button>
      <button class="mi" data-go="char"><span class="ic">🏋️</span><span class="grow"><b>훈련소 · 스킬</b><small>능력치·스킬 포인트 쓰기</small></span></button>
      <button class="mi" data-go="rec:daily"><span class="ic">📜</span><span class="grow"><b>오늘의 미션</b><small>${S.daily?`${S.daily.list.filter(m=>m.claimed).length} / 3 완료`:''}</small></span></button>
    </section>`;
  h += `<section class="card">${bars()}</section>`;
  if (T.length) h += `<section class="card"><h2>확인할 일</h2>${todoList(T)}</section>`;
  return h;
}

/* ---------- hunt ---------- */
function groundRow(g, deep, rec){
  const G = GD[g], [lo,hi] = groundLv(g, deep), open = groundOpen(g, deep);
  const mons = G.mons.map((m,k)=>`<img class="px" src="${SPR['m'+(g*2+k)]}" alt="">`).join('');
  const reqTxt = deep ? `전직 후 Lv.${g*10+1}` : `Lv.${g===0?1:g*5}`;
  return `<div class="gr ${rec?'rec':''} ${open?'':'lock'}"><div class="mons">${mons}</div><div class="grow"><b>${deep?'심층 ':''}${G.ground}</b>
    <span class="chip ${rec?'blue':''}">${open ? (rec?'추천 · ':'') + `Lv.${lo}–${hi}` : `잠김 · ${reqTxt}`}</span>
    <div class="xs muted">${G.mons.map(m=>m.name).join(' · ')} · 1마리 EXP ${fmt(mexp(lo))}~</div></div>
    ${open?`<div class="gbtns"><button class="btn sm soft" data-act="hunt" data-g="${g}" data-deep="${deep?1:0}">사냥</button>${autoBtn(g, deep)}</div>`:''}</div>`;
}
function huntView(){
  const b = bestGround();
  let h = top('사냥', `${lvTag()} · HP ${fmt(S.hp)}/${fmt(hpMax())} · MP ${fmt(S.mp)}/${fmt(mpMax())}`);
  h += autoCard();
  h += `<section class="card"><div class="btns" style="margin-top:0"><button class="btn" data-act="potion" data-k="hp" ${S.inv.hp?'':'disabled'}>체력 물약 ${S.inv.hp}</button><button class="btn" data-act="potion" data-k="mp" ${S.inv.mp?'':'disabled'}>마나 물약 ${S.inv.mp}</button><button class="btn soft" data-act="rest">여관 ${innCost()}G</button></div></section>`;
  if (isJob()) h += `<section class="card"><h2 class="row">심층 사냥터 <span class="aside">전직 후 10레벨마다 개방</span></h2>${GD.map((G,g)=>groundRow(g,true,b.deep&&g===b.g)).join('')}</section>`;
  h += `<section class="card"><h2 class="row">사냥터 <span class="aside">${isJob()?'모두 개방':'노비스 Lv.1~50'}</span></h2>${GD.map((G,g)=>groundRow(g,false,!b.deep&&g===b.g)).join('')}

  return h;
}

/* ---------- battle view ---------- */
function weakChips(f){
  const seen = S.seen[f.id] || [], all = S.seen[f.id+':all'];
  const w = f.weak.map(a => seen.includes(a)||all ? `<span class="w">${a}</span>` : '<span>?</span>');
  const r = f.resist.filter(a => seen.includes(a)||all).map(a=>`<span class="r">${a}</span>`);
  return `<span class="weak">${[...w, ...r].join('') || '<span>약점 없음</span>'}</span>`;
}
function popHTML(p){
  if (p==null) return '';
  const d = B && B.fxd ? ` style="animation-delay:${B.fxd}ms"` : '';
  if (typeof p !== 'object') return `<span class="pop">${p}</span>`;
  if (p.miss) return `<span class="pop miss"${d}>MISS</span>`;
  return `${p.rel==='weak'?`<span class="pop weakp"${d}>약점!</span>`:''}<span class="pop ${p.rel==='resist'?'miss':''}"${d}>${p.dmg}${p.crit?'!':''}</span>`;
}
const knownWeak = f => (S.seen[f.id+':all'] ? f.weak : f.weak.filter(a=>(S.seen[f.id]||[]).includes(a)));
function battleView(){
  const meTurn = !B.over && B.queue[0]==='me';
  const order = upcoming().map((w,i)=>{
    const me = w==='me';
    const face = me ? dollHTML(lookFront(), 44) : `<img class="px" src="${B.foes[w].spr}" alt="">`;
    return `<div class="tk ${me?'me':'foe'} ${i===0?'now':''}"><div class="face">${face}</div><span>${me?'나':esc(B.foes[w].name.replace(/^정예 /,'').replace(/ ([ABC])$/,'$1'))}</span></div>`;
  }).join('');
  const icons = meTurn ? B.icons.map(t=>`<i class="${t==='h'?'half':''}"></i>`).join('') + '<i class="used"></i>'.repeat(Math.max(0,2-B.icons.length)) : '<i class="used"></i><i class="used"></i>';
  const alive = B.foes.map((f,i)=>i).filter(i=>B.foes[i].hp>0);
  const tgt = B.target!=null && B.foes[B.target] && B.foes[B.target].hp>0 ? B.target : alive[0];
  const foes = B.foes.map((f,i)=>`<button class="foe ${f.hp<=0?'dead':''} ${meTurn&&i===tgt&&alive.length>1?'pick':''}" data-act="target" data-i="${i}" aria-label="${esc(f.name)} 노리기">
      ${popHTML(B.pops[i])}<img class="spr px" src="${f.spr}" alt=""><span class="nm">${esc(f.name)} · Lv.${f.m}</span>
      <span class="hpb"><i style="width:${f.hp/f.max*100}%"></i></span>${weakChips(f)}</button>`).join('');
  const meHit = typeof B.pops.me === 'number';
  let h = `<div class="turnbar"><div class="hd"><span>턴 순서 · <b>${B.round}라운드</b>${B.mode==='promo'?` · 승급 시험 ${B.stage}/3`:''}</span><span class="press" aria-label="남은 행동"><span style="margin-right:4px">내 행동</span>${icons}</span></div><div class="order">${order}</div></div>
  <div class="field2 g${B.g}">
    <div class="foes">${foes}</div>
    <div class="plat me"></div><div class="me-on ${meHit?'hit':''}">${dollHTML(lookBack())}${B.pops.me!=null?`<span class="pop" style="top:40px;left:60%">${B.pops.me}</span>`:''}</div>
    <canvas class="fxc" aria-hidden="true"></canvas>
    <div class="blog" role="status" aria-live="polite">${B.log || (meTurn ? '내 차례! 명령을 고르세요.' : '')}</div>
  </div>`;
  h += `<div class="bpanel"><div class="bstat"><div class="nm">${esc(S.name)}<small>${lvTag()}</small></div><div class="bars2">
    <div class="bl"><span>HP</span><span class="b"><i style="width:${S.hp/hpMax()*100}%;background:var(--hp)"></i></span><span>${fmt(S.hp)}/${fmt(hpMax())}</span></div>
    <div class="bl"><span>MP</span><span class="b"><i style="width:${S.mp/mpMax()*100}%;background:var(--mp)"></i></span><span>${fmt(S.mp)}/${fmt(mpMax())}</span></div></div></div>`;
  if (B.over){
    const O = B.over;
    if (O==='run') h += `<div class="result" style="margin-top:12px"><div class="big2" style="color:var(--sub)">도망쳤다</div></div><div class="btns"><button class="btn" data-act="leave">돌아가기</button><button class="btn pri" data-act="again">다시 사냥</button></div>`;
    else if (O.win) h += `<div class="result fade" style="margin-top:12px"><div class="big2">${O.promo ? '승급 시험 통과!' : '승리!'}</div>
      <div class="xs muted">${B.round}라운드 · 받은 피해 ${fmt(B.took)}</div>
      <div class="rewards"><span style="color:var(--gold)">EXP +${fmt(O.exp)}</span><span>골드 +${fmt(O.gold)}</span>${Object.entries(O.mats).map(([k,v])=>`<span>${esc(k)} ×${v}</span>`).join('')}</div>
      ${O.ups?`<div style="margin-top:6px;font-weight:700;color:var(--accent)">레벨 업! ${lvTag()} · 능력치 포인트 +${O.ups*2}</div>`:''}
      ${O.promo?`<div style="margin-top:6px;font-weight:700">소속: ${O.promo} · EXP·골드 +${Math.round(facBonus()*100)}%</div>`:''}
      ${O.loot?`<div class="small" style="margin-top:6px">${O.loot==='full'?'전리품이 있었지만 가방이 가득 찼다':`전리품 · <b>${itemLabel(O.loot)}</b>`}</div>`:''}</div>
      <div class="btns"><button class="btn" data-act="leave">돌아가기</button>${B.mode==='promo'?'':`<button class="btn pri" data-act="again" ${S.hp<=1?'disabled':''}>계속 사냥</button>`}</div>`;
    else h += `<div class="result fade" style="margin-top:12px"><div class="big2 lose">쓰러졌다…</div><div class="small muted">골드 ${fmt(O.lostGold)}, 경험치 ${fmt(O.lostExp)}를 잃고 마을로 실려 왔다. 치료를 받아 HP 절반으로 깨어났다.</div></div><div class="btns"><button class="btn pri" data-act="leave">마을로</button></div>`;
  } else if (meTurn){
    if (B.sub==='skill'){
      const tf = B.foes[tgt], weak = tf ? knownWeak(tf) : [];
      h += `<p class="hint">대상: ${tf?esc(tf.name):''}${weak.length?` · 약점 ${weak.join(', ')}`:''}</p>` + (learnedActive().length ? '' : '<p class="hint">배운 스킬이 없다. 캐릭터 → 스킬에서 배우자.</p>') + learnedActive().map(s=>{ const best = s.kind==='dmg' && s.attr && weak.includes(s.attr);
        return `<button class="skill ${best?'best':''}" data-act="useskill" data-id="${s.id}" ${S.mp<s.mp?'disabled':''}><span class="el">${ATTR_ICON[s.attr]||KIND_ICON[s.kind]}</span><span class="t">${s.n} <span class="xs muted">Lv.${s.lv}</span><small>${skDesc(SKILL[s.id], s.lv)}${best?' · 약점! 행동 +½':''}</small></span><span class="mpc">MP ${s.mp}</span></button>`; }).join('')
        + `<div class="btns"><button class="btn" data-act="sub" data-v="">뒤로</button></div>`;
    } else if (B.sub==='item'){
      h += `<div class="btns"><button class="btn" data-act="bitem" data-k="hp" ${S.inv.hp?'':'disabled'}>체력 물약 ${S.inv.hp}</button><button class="btn" data-act="bitem" data-k="mp" ${S.inv.mp?'':'disabled'}>마나 물약 ${S.inv.mp}</button></div><div class="btns"><button class="btn" data-act="sub" data-v="">뒤로</button></div>`;
    } else {
      h += `<div class="cmds">
        <button class="cmd on" data-act="attack">공격<small>${job().attr}</small></button>
        <button class="cmd" data-act="sub" data-v="skill">스킬<small>MP 사용</small></button>
        <button class="cmd" data-act="guard">방어<small>피해 절반</small></button>
        <button class="cmd" data-act="sub" data-v="item">아이템<small>물약 ${S.inv.hp+S.inv.mp}</small></button>
        <button class="cmd" data-act="sub" data-v="info">정보<small>적 능력치</small></button>
        <button class="cmd" data-act="run" ${B.mode==='promo'?'disabled':''}>도망<small>${B.mode==='promo'?'불가':'속도 비교'}</small></button></div>
        <p class="hint">${alive.length>1?'몬스터를 눌러 노릴 대상을 바꿀 수 있어요. ':''}약점을 찌르면 행동이 ½ 늘어나요.</p>`;
      if (B.sub==='info') h += alive.map(i=>{ const f = B.foes[i]; return `<p class="small" style="margin-top:6px"><b>${esc(f.name)}</b> · HP ${f.hp}/${f.max} · 공격 ${f.atk} · 방어 ${f.def} · ${esc(f.acts.join(', '))}</p>`; }).join('');
    }
  } else h += `<p class="hint">적의 차례…</p>`;
  return h + `</div>`;
}

/* ---------- character ---------- */
/* paper doll: slots placed on a faint body outline (viewer's left = the character's right hand) */
const PD_POS = {helm:[140,40], necklace:[68,66], earring:[212,66], cape:[218,140], sub:[226,222], top:[140,132], weapon:[40,196], bottom:[140,214], shoes:[140,312]};
const PD_BODY = `<svg class="body" viewBox="0 0 280 350" aria-hidden="true"><circle cx="140" cy="58" r="46"/><rect x="104" y="104" width="72" height="96" rx="22"/>
  <rect x="62" y="112" width="30" height="88" rx="15" transform="rotate(18 77 112)"/><rect x="188" y="112" width="30" height="88" rx="15" transform="rotate(-18 203 112)"/>
  <rect x="108" y="190" width="28" height="104" rx="14"/><rect x="144" y="190" width="28" height="104" rx="14"/><ellipse cx="118" cy="300" rx="20" ry="10"/><ellipse cx="162" cy="300" rx="20" ry="10"/></svg>`;
function slotFits(slot, it){
  if (!it) return false;
  if (it.slot==='ring') return slot.startsWith('ring');
  if (it.slot==='suit') return slot==='top' || slot==='bottom';
  if (it.slot==='sub') return slot==='sub' && subOk(it);
  return it.slot===slot;
}
function pdSlot(slot, label, style, fitItem){
  if (slot==='sub' && !subRule().kind && !S.equip.sub)  // two-handed or bare-handed jobs have no off-hand
    return `<button class="ps blocked" style="${style||''}" disabled aria-label="보조무기: ${subRule().why}"><span class="sq">✕</span><small>${subRule().why}</small></button>`;
  if (slot==='bottom' && S.equip.suit)  // a suit covers the legs: the bottom slot is blocked
    return `<button class="ps blocked ${slotFits(slot, fitItem)?'fit':''}" style="${style||''}" disabled aria-label="하의: 한벌옷을 입어 착용 불가"><span class="sq">✕</span><small>한벌옷 착용 중</small></button>`;
  let it = S.equip[slot], key = slot;
  if (!it && slot==='top' && S.equip.suit){ it = S.equip.suit; key = 'suit'; }
  const cls = [it?'':'empty', UI.slotSel===key?'on':'', slotFits(slot, fitItem)?'fit':''].join(' ');
  const act = it ? `data-act="slot" data-s="${key}"` : 'disabled';
  return `<button class="ps ${cls}" style="${style||''}" ${act} aria-label="${label}: ${it?esc(itemInfo(it).name):'비어 있음'}"><span class="sq ${it?'rb'+it.rar:''}">${it?itemIcon(it):''}</span><small>${key==='suit'?'한벌옷':label}</small></button>`;
}
function equipDoll(fitItem){
  const pos = Object.entries(PD_POS).map(([s,[x,y]])=>pdSlot(s, SLOTN[s], `left:${x}px;top:${y}px`, fitItem)).join('');
  return `<div class="pd">${PD_BODY}${pos}</div><div class="ringrow">${RING_SLOTS.map((s,i)=>pdSlot(s, `반지${i+1}`, '', fitItem)).join('')}</div>`;
}
function slotDetail(){
  const sel = UI.slotSel ? S.equip[UI.slotSel] : null; if (!sel) return '';
  const info = itemInfo(sel), p = [];
  if (info.atk) p.push(`공격력 <b>+${info.atk}</b>`); if (info.def) p.push(`방어력 <b>+${info.def}</b>`);
  for (const x in info.bon) p.push(`${SN[x]} <b>+${info.bon[x]}</b>`);
  return `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px"><b>${info.name}</b> <span class="xs muted">${SLOTN[sel.slot]} · <span class="rar${sel.rar}">${RARITY[sel.rar]}</span> · ${reqText(info)}${info.set!=null?` · ${SET_NAMES[info.set]} 세트`:''}</span>
    <p class="eff">${p.join(' · ')}</p><div class="btns"><button class="btn" data-act="unequip" data-s="${UI.slotSel}">벗기</button><button class="btn" data-act="slot" data-s="">닫기</button></div></div>`;
}
function slotCell(slotKey, it, label){
  if (!it) return `<div class="slot empty"><span class="sq"></span><span class="nm">${label}<small>비어 있음</small></span></div>`;
  const info = itemInfo(it);
  return `<button class="slot" data-act="slot" data-s="${slotKey}" aria-label="${info.name} 정보"><span class="sq rb${it.rar}">${itemIcon(it)}</span><span class="nm">${info.name}<small>${label} · <span class="rar${it.rar}">${RARITY[it.rar]}</span></small></span></button>`;
}
function setSummary(){
  const cnt = {};
  ARMOR_SET_SLOTS.forEach(s=>{ const it = S.equip[s]; if (it) cnt[it.band] = (cnt[it.band]||0) + (s==='suit'?2:1); });
  const rows = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([b,c])=>`<b>${SET_NAMES[b]} 세트</b> ${c}/5`);
  return rows.length ? rows.join(' · ') : '세트 장비를 입지 않았다';
}

      <button class="cta" style="margin-top:12px" data-act="jobchange" ${p?'':'disabled'}>${p?`${JOBS[p].name}(으)로 전직하기`:'직업을 골라 주세요'}</button></section>`;

      <button class="cta" style="margin-top:12px" data-act="route" ${p?'':'disabled'}>${p?`${ROUTE[p].name} 루트로`:'루트를 골라 주세요'}</button></section>`;

    <div class="statgrid">${STATS.map(([s,n])=>{ const b = bonus(s);
      return `<div class="st ${k.includes(s)?'key':''}"><span class="k">${n}</span><span class="row" style="gap:6px"><b class="num">${eff(s)}</b>${b?`<span class="b">+${b}</span>`:''}${S.points?`<button class="plus" data-act="point" data-s="${s}" aria-label="${n} 올리기">+</button>`:''}</span></div>`; }).join('')}</div>
    <div class="stats3"><div><div class="k">공격력</div><div class="v num">${atk()}</div></div><div><div class="k">방어력</div><div class="v num">${def()}</div></div><div><div class="k">속도</div><div class="v num">${spd()}</div></div></div>

  if (UI.bag==='mat'){
    const M = Object.entries(S.mats);
    return h + `<section class="card"><h2>재료</h2>${M.length ? `<div class="list">${M.map(([n,c])=>`<div class="item"><span class="grow"><span class="t">${esc(n)}</span><span class="d">몬스터 재료 · 제작은 다음 업데이트</span></span><b>${c}개</b></div>`).join('')}</div>
      <div class="btns"><button class="btn soft" data-act="sellmats">모두 팔기</button></div>` : '<p class="small muted">사냥을 하면 재료가 쌓인다.</p>'}</section>`;
  }
  const items = S.bag.slice().sort((a,b)=>(b.deep?1:0)-(a.deep?1:0) || b.rar-a.rar || b.band-a.band);
  const cells = items.map(it=>`<button class="cell rb${it.rar} ${UI.sel===it.id?'sel':''}" data-act="sel" data-id="${it.id}" aria-label="${RARITY[it.rar]} ${itemInfo(it).name}">${itemIcon(it)}${it.isNew?'<span class="new"></span>':''}</button>`);
  const blanks = Math.max(0, Math.ceil((items.length+1)/5)*5 - items.length);
  const selIt = S.bag.find(x=>x.id===UI.sel);
  h += `<section class="card"><h2 class="row">착용 중 <span class="aside">${selIt?'파란 칸에 장착돼요':'칸을 누르면 정보'}</span></h2>${equipDoll(selIt)}${slotDetail()}</section>`;
  h += `<section class="card">${items.length ? `<div class="inv">${cells.join('')}${'<span class="cell blank"></span>'.repeat(blanks)}</div>` : '<p class="small muted">사냥에서 전리품을 얻으면 여기에 쌓인다.</p>'}</section>`;
  const it = S.bag.find(x=>x.id===UI.sel);
  if (it){
    const info = itemInfo(it), slots = it.slot==='ring' ? RING_SLOTS : it.slot==='suit' ? ['suit','top','bottom'] : (it.slot==='top'||it.slot==='bottom') ? [it.slot,'suit'] : [it.slot];
    const cur = slots.map(s=>S.equip[s]).filter(Boolean), curInfo = it.slot==='ring' ? null : cur.map(itemInfo);
    const cmp = (k, v) => { if (!curInfo) return ''; const old = curInfo.reduce((s,c)=>s+(k==='atk'?c.atk:k==='def'?c.def:(c.bon[k]||0)),0), d = v - old; return d ? ` <span class="cmp ${d>0?'up':'down'}">${d>0?'▲'+d:'▼'+(-d)}</span>` : ''; };
    const parts = [];
    if (info.atk) parts.push(`공격력 <b>+${info.atk}</b>${cmp('atk',info.atk)}`);
    if (info.def) parts.push(`방어력 <b>+${info.def}</b>${cmp('def',info.def)}`);
    for (const x in info.bon) parts.push(`${SN[x]} <b>+${info.bon[x]}</b>${cmp(x,info.bon[x])}`);
    const ok = canWear(info, it);
    h += `<section class="card"><div class="row"><span class="sq rb${it.rar}" style="width:56px;height:56px">${itemIcon(it)}</span>
      <span class="grow"><span class="who" style="display:block">${info.kind||SLOTN[it.slot]} · <b class="rar${it.rar}">${RARITY[it.rar]}</b> · <span style="${ok?'':'color:var(--red)'}">${reqText(info)} 이상</span>${info.set!=null?` · ${SET_NAMES[info.set]} 세트`:''}</span>
      <b style="font-size:18px">${info.name}</b></span></div>
      <p class="eff" style="margin-top:10px">${parts.join(' · ')}</p>
      ${cur.length && it.slot!=='ring' ? `<p class="xs muted">지금 착용: ${cur.map(c=>itemInfo(c).name).join(', ')}${it.slot==='suit'?' (한벌옷을 입으면 상의·하의를 벗는다)':''}</p>` : ''}
      ${UI.ringPick && it.slot==='ring' ? `<p class="small" style="margin-top:8px">반지 칸이 가득 찼다. 바꿀 칸을 고른다.</p><div class="btns">${RING_SLOTS.map((s,i)=>`<button class="btn sm" data-act="equip" data-id="${it.id}" data-ring="${s}">${i+1}번</button>`).join('')}</div>` : ''}
      <div class="btns"><button class="btn soft" data-act="sell" data-id="${it.id}">팔기 · ${info.price}골드</button><button class="btn pri" data-act="equip" data-id="${it.id}" ${ok?'':'disabled'}>${ok?'장착하기':wearWhy(info, it)}</button></div></section>`;
  }
  return h;
}

/* ---------- records ---------- */
function achievements(){
  const T = S.tot, nlv = S.job==='novice' ? S.lv : NOVICE_MAX;
  return [
    ['노비스 Lv.10', nlv, 10, '새싹 모험가'], ['노비스 Lv.30', nlv, 30, '숲의 사냥꾼'], ['노비스 Lv.50 · 전직', nlv, 50, '전직자'],
    ['직업 Lv.30', isJob()?S.lv:0, 30, '숙련자'], ['직업 Lv.99', isJob()?S.lv:0, 99, '전설'],
    ['몬스터 100마리', T.kills, 100, '백인 사냥꾼'], ['몬스터 1,000마리', T.kills, 1000, '천인 사냥꾼'], ['약점 공격 300번', T.weak, 300, '급소 장인'],
    ['전설 장비 손에 넣기', T.legend, 1, '전설 수집가'], ['전설의 원정대 입단', S.fac, 6, '원정대원'],
  ];
}
function recView(){
  const A = achievements();
  let h = top('기록', `업적 ${A.filter(a=>a[1]>=a[2]).length} / ${A.length}`);
  h += seg('rec', [['daily','일일 미션'],['ach','업적·칭호'],['save','저장']]);
  if (UI.rec==='save') return h + saveCard();
  if (UI.rec==='daily'){
    return h + `<section class="card"><h2 class="row">오늘의 미션 <span class="aside">매일 새로 바뀌어요</span></h2><div class="list">${S.daily.list.map((m,i)=>`<div class="item"><span class="grow"><span class="t">${m.t}${m.claimed?' <span class="chip">완료</span>':''}</span>
      <span class="d">${m.p} / ${m.n} · 보상 ${rewText(m.rew)}</span><span class="bar thin" style="display:block"><i style="width:${m.p/m.n*100}%;background:var(--exp)"></i></span></span>
      ${!m.claimed&&m.p>=m.n?`<button class="btn sm pri" data-act="claim" data-i="${i}">받기</button>`:''}</div>`).join('')}</div></section>`;
  }
  const earned = A.filter(a=>a[1]>=a[2]).map(a=>a[3]);
  h += `<section class="card"><h2 class="row">칭호 <span class="aside">골라서 이름 옆에 달기</span></h2>${earned.length ? `<div class="choices">${earned.map(t=>`<button class="opt" style="text-align:center" data-act="title" data-t="${esc(t)}" aria-pressed="${S.title===t}"><b>${esc(t)}</b></button>`).join('')}</div>` : '<p class="small muted">업적을 달성하면 칭호를 얻는다.</p>'}</section>`;
  h += `<section class="card"><h2>업적</h2><div class="list">${A.map(([t,v,n,ti])=>`<div class="item"><span class="grow"><span class="t">${t}${v>=n?' <span class="chip blue">달성</span>':''}</span>
    <span class="d">${fmt(Math.min(v,n))} / ${fmt(n)} · 칭호 「${ti}」</span><span class="bar thin" style="display:block"><i style="width:${Math.min(100,v/n*100)}%;background:${v>=n?'var(--accent)':'var(--exp)'}"></i></span></span></div>`).join('')}</div></section>`;
  if (S.titles.length) h += `<section class="card"><h2>발자취</h2><p class="small">${S.titles.map(esc).join(' → ')}</p></section>`;
  return h;
}
function saveCard(){
  return `<section class="card"><h2>저장 파일 내보내기 · 가져오기</h2>
    <p class="small muted" style="margin-bottom:10px">진행은 이 브라우저에 자동 저장된다. 다른 기기로 옮기려면 아래 내용을 복사해 두었다가 붙여 넣는다.</p>
    <textarea id="savebox" rows="4" aria-label="저장 데이터">${S ? esc(JSON.stringify(S)) : ''}</textarea>
    <div class="btns"><button class="btn" data-act="copy">복사</button><button class="btn" data-act="import">붙여 넣은 내용 불러오기</button></div>
    ${S ? '<div style="margin-top:12px"><button class="btn link" data-act="abandon">이 캐릭터 지우고 새로 시작</button></div>' : ''}
    <p class="small muted" id="savemsg" role="status" style="margin-top:8px"></p></section>`;
}

/* ---------- create ---------- */
function createView(){
  const cands = candidates(), f = draft.gender==='f';
  const L = f ? {img:SPR.fnovice_front} : {skin:draft.skin, hair:draft.hair, weapon:0};
  return `<div class="top"><div><h1>새 모험가</h1><div class="s">노비스로 시작해 Lv.50에 전직해요</div></div></div>
  <section class="card"><div class="stage cstage">${dollHTML(L)}</div>
    <div class="opts"><button class="opt" style="text-align:center" data-act="gender" data-v="m" aria-pressed="${!f}"><b>남캐</b><small>모든 직업</small></button><button class="opt" style="text-align:center" data-act="gender" data-v="f" aria-pressed="${f}"><b>여캐</b><small>시프(댄서) 전용</small></button></div></section>
  <section class="card">
    <div class="label">머리 색${f?' · 여캐는 준비 중':''}</div>
    <div class="colors">${HAIRS.map(([c,n],i)=>`<button class="sw" style="background:${c}" data-act="hair" data-v="${i}" aria-pressed="${!f&&i===draft.hair}" aria-label="${n}" title="${n}" ${f?'disabled':''}></button>`).join('')}</div>
    <div class="label" style="margin-top:16px">피부 색${f?' · 여캐는 준비 중':''}</div>
    <div class="colors">${SKINS.map(([c,n],i)=>`<button class="sw" style="background:${c}" data-act="skin" data-v="${i}" aria-pressed="${!f&&i===draft.skin}" aria-label="${n}" title="${n}" ${f?'disabled':''}></button>`).join('')}</div>
  </section>
  <section class="card">
    <label class="field">이름 <input id="f-name" maxlength="12" value="${esc(draft.name)}"></label>
    <label class="field" style="margin:0">출신 <select id="f-origin">${ORIGINS.map(o=>`<option ${o===draft.origin?'selected':''}>${o}</option>`).join('')}</select></label>
  </section>
  <section class="card"><h2 class="row">성장 방향 <span class="aside">능력치 합 240</span></h2>
    <div class="choices">${cands.map((cd,i)=>`<button class="opt" data-act="cand" data-v="${i}" aria-pressed="${i===draft.cand}"><b>${cd.style}</b>
      <small>${STATS.map(([s,n])=>JOBS.novice.key.includes(s)?`<b style="color:var(--ink)">${n} ${cd.stats[s]}</b>`:`${n} ${cd.stats[s]}`).join(' · ')}</small></button>`).join('')}</div></section>
  <button class="cta" data-act="start">이 모습으로 시작하기</button>
  ${saveCard()}`;
}

/* ---------- render ---------- */
const TABS = [['home','홈'],['hunt','사냥'],['char','캐릭터'],['bag','가방'],['rec','기록']];
function render(){
  if (!S){ app.className = 'app notabs'; app.innerHTML = createView(); return; }
  ensureDaily();
  if (B){ app.className = 'app notabs'; app.innerHTML = battleView(); if (!fxRaf && B.foes.some(f=>f.stun)){ fxLast = performance.now(); fxRaf = requestAnimationFrame(fxTick); } return; }
  const V = {home:homeView, hunt:huntView, char:charView, bag:bagView, rec:recView}[UI.tab] || homeView;
  const dots = {home:false, hunt:false, char:!!S.points || !!S.sp || canJobChange() || canRoute() || promoReady(), bag:S.bag.some(x=>x.isNew), rec:dailyReady()>0};
  app.className = 'app';
  app.innerHTML = V() + `<nav class="tabs" aria-label="메뉴"><div class="in">${TABS.map(([k,n])=>`<button class="tab ${UI.tab===k?'on':''}" data-go="${k}" ${UI.tab===k?'aria-current="page"':''}>${svg(k,24)}${n}${dots[k]&&UI.tab!==k?'<span class="dot"></span>':''}</button>`).join('')}</div></nav>`;
}
function go(dest){
  const [tab, sub] = dest.split(':'); UI.tab = tab; UI.ringPick = false;
  if (sub){ if (tab==='bag') UI.bag = sub; if (tab==='rec') UI.rec = sub; }
  render(); window.scrollTo({top:0});
}

/* ---------- events ---------- */
app.addEventListener('input', e => { if (e.target.id==='f-name') draft.name = e.target.value; });
app.addEventListener('change', e => { if (e.target.id==='f-origin') draft.origin = e.target.value; });
app.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const sg = e.target.closest('[data-seg]'); if (sg){ const [k,v] = sg.dataset.seg.split(':'); UI[k] = v; UI.ringPick = false; render(); return; }
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='cand'){ draft.cand = +b.dataset.v; render(); return; }
  if (a==='hair'){ draft.hair = +b.dataset.v; render(); return; }
  if (a==='skin'){ draft.skin = +b.dataset.v; render(); return; }
  if (a==='gender'){ draft.gender = b.dataset.v; render(); return; }
  if (a==='start'){ newGame(); UI.tab = 'home'; render(); window.scrollTo({top:0}); return; }
  if (a==='hunt'){ startBattle(+b.dataset.g, b.dataset.deep==='1'); return; }
  if (a==='target'){ if (B && !B.over){ B.target = +b.dataset.i; render(); } return; }
  if (a==='attack'){ playerAction('attack'); return; }
  if (a==='guard'){ playerAction('guard'); return; }
  if (a==='run'){ playerAction('run'); return; }
  if (a==='sub'){ if (B){ B.sub = b.dataset.v || null; render(); } return; }
  if (a==='useskill'){ playerAction('skill', learnedActive().find(s=>s.id===b.dataset.id)); return; }
  if (a==='learn'){ learnSkill(b.dataset.id); return; }
  if (a==='bitem'){ playerAction('item', b.dataset.k); return; }
  if (a==='leave'){ endBattle(false); return; }
  if (a==='again'){ endBattle(true); return; }
  if (a==='rest'){ rest(); return; }
  if (a==='auto'){ autoHunt(+b.dataset.g, b.dataset.deep==='1'); return; }
  if (a==='autoclose'){ UI.auto = null; render(); return; }
  if (a==='talk'){ UI.homeLine = guideLine(); render(); return; }
  if (a==='promo'){ startPromo(); return; }
  if (a==='train'){ doTrain(b.dataset.s); return; }
  if (a==='point'){ spendPoint(b.dataset.s); return; }
  if (a==='jobpick'){ UI.jobPick = b.dataset.j; render(); return; }
  if (a==='jobchange'){ jobChange(UI.jobPick); return; }
  if (a==='routepick'){ UI.routePick = b.dataset.r; render(); return; }
  if (a==='route'){ chooseRoute(UI.routePick); return; }
  if (a==='claim'){ claimDaily(+b.dataset.i); return; }
  if (a==='title'){ S.title = S.title===b.dataset.t ? null : b.dataset.t; save(); render(); return; }
  if (a==='slot'){ UI.slotSel = b.dataset.s || null; render(); return; }
  if (a==='unequip'){ unequip(b.dataset.s); UI.slotSel = null; render(); return; }
  if (a==='sel'){ UI.sel = UI.sel===b.dataset.id ? null : b.dataset.id; UI.ringPick = false; const it = S.bag.find(x=>x.id===b.dataset.id); if (it && it.isNew){ it.isNew = false; save(); } render(); return; }
  if (a==='equip'){ equipItem(b.dataset.id, b.dataset.ring); return; }
  if (a==='sell'){ if (b.dataset.confirm){ sellItem(b.dataset.id); return; } b.dataset.confirm = '1'; b.textContent = '정말 판다'; return; }
  if (a==='buy'){ buyPotion(b.dataset.k); return; }
  if (a==='potion'){ usePotion(b.dataset.k); return; }
  if (a==='sellmats'){ sellMats(); return; }
  if (a==='abandon'){
    if (b.dataset.confirm){ S = null; B = null; store.del(SAVE_KEY); draft = newDraft(); render(); return; }
    b.dataset.confirm = '1'; b.textContent = '정말 지운다 (되돌릴 수 없음)'; return;
  }
  const msg = document.getElementById('savemsg'), box = document.getElementById('savebox');
  if (a==='copy'){
    try { await navigator.clipboard.writeText(box.value); msg.textContent = '복사했다.'; }
    catch(err){ box.select(); msg.textContent = '자동 복사가 막혀 있다. 선택된 내용을 직접 복사한다.'; }
    return;
  }
  if (a==='import'){
    try { const d = JSON.parse(box.value); if (!d || !d.stats) throw new Error(); B = null; S = migrate(d); save(); UI.tab = 'home'; render(); window.scrollTo({top:0}); }
    catch(err){ msg.textContent = '불러오지 못했다. 저장 내용 전체를 그대로 붙여 넣었는지 확인한다.'; }
  }
});

/* ---------- save migration ---------- */
function migrate(d){
  if (!d) return d;
  if (!d.ver || d.ver < 3){
    // v2: 직업 4개 · 4칸 장비(tier) → v3 모양으로 먼저 옮긴다 (방패는 버린다)
    const conv = old => old && old.slot!=='shield' && old.slot!=='cape' ? {id:old.id||uid(), slot:{armor:'top'}[old.slot]||old.slot, band:0, rar:clamp(old.tier||0,0,4)} : null;
    const oe = d.equip || {};
    d.equip = {weapon:conv(oe.weapon && {...oe.weapon, slot:'weapon'}), helm:conv(oe.helm && {...oe.helm, slot:'helm'}), top:conv(oe.armor && {...oe.armor, slot:'armor'})};
    d.bag = (d.bag||[]).map(conv).filter(Boolean);
    d.lv = clamp(1 + Math.round((d.hist||[]).length*1.6), 1, 30); d.hair = [1,0,2,3,4][d.hair ?? 1] ?? 0; d.skin = clamp(d.skin ?? 0, 0, 3);
    d.ver = 3;
  }
  if (d.ver < 4){
    // v3: 나이·한 해 흐름·잠재력 → 나이 없는 레벨 성장. 옛 직업(전사·궁수·마법사·성직자)은 전직한 상태로 Lv.1부터.
    const legacy = {warrior:'warrior', archer:'archer', mage:'mage', cleric:'healer'}[d.cls];
    const T = d.tot || {};
    d = {ver:VER, name:d.name||'모험가', origin:d.origin||ORIGINS[4], gender:'m', hair:d.hair||0, skin:d.skin||0, style:d.style||'균형형',
      stats:d.stats, job:legacy||'novice', route:null, lv:legacy ? 1 : clamp(d.lv||1, 1, NOVICE_MAX), exp:0, points:d.points||0,
      hp:null, mp:null, gold:d.gold||0, inv:d.inv||{hp:2,mp:1}, mats:d.mats||{}, fac:clamp(d.fac||0,0,6), train:0,
      equip:d.equip||{}, bag:d.bag||[], tot:{kills:T.kills||0, wins:0, battles:0, weak:0, items:T.items||0, legend:T.legend||0, losses:0},
      titles:(d.awards||[]).slice(-5), title:null, seen:{}, daily:null};
  }
  for (const s of [...SLOT_ORDER, ...RING_SLOTS]) if (!(s in d.equip)) d.equip[s] = null;
  for (const k of ['inv','mats','seen']) if (!d[k]) d[k] = k==='inv' ? {hp:0,mp:0} : {};
  if (!d.titles) d.titles = [];
  [...d.bag, ...Object.values(d.equip)].forEach(it=>{ if (it) it.band = clamp(it.band||0, 0, 9); });
  S = d; if (!S.sk){ S.sk = {}; S.sp = skillPointsEarned(); }
  clampVitals(); ensureDaily();
  return S;
}
function boot(data){
  S = migrate((data && data.S) || store.get(SAVE_KEY) || null);
  if (data && data.draft) draft = {...newDraft(), ...data.draft};
  if (data && data.UI) Object.assign(UI, data.UI);
  render();
}
window.claude?.hot?.snapshot?.(() => ({S, draft, UI}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
