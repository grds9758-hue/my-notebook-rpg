<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 공책 그정도 아님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column of white cards on grey, with a fixed bottom tab bar (홈 · 모험 · 캐릭터 · 가방 · 기록) */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f4f5f7; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --line:#e5e8eb;
  --accent:#3182f6; --accent-soft:#e8f3ff; --accent-ink:#ffffff; --red:#f04452; --good:#20a464; --gold:#e5a50a;
  --hp:#f04452; --mp:#3182f6; --exp:#ffb400; --tabicon:#b0b8c1;
  --r0:#8b95a1; --r1:#20a464; --r2:#3182f6; --r3:#8b5cf6; --r4:#e5a50a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#1b1f26; --surface-2:#242a33; --ink:#eef1f4; --sub:#b0b8c1; --muted:#7d8692; --line:#2c333d;
  --accent:#4d94ff; --accent-soft:#1d2a3d; --accent-ink:#ffffff; --tabicon:#5d6672; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#1b1f26; --surface-2:#242a33; --ink:#eef1f4; --sub:#b0b8c1; --muted:#7d8692; --line:#2c333d;
  --accent:#4d94ff; --accent-soft:#1d2a3d; --accent-ink:#ffffff; --tabicon:#5d6672; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 104px}
.app.notabs{padding-bottom:32px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .sub{color:var(--sub)} .small{font-size:13px} .xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 2px 12px}
.top h1{font-size:20px}
.top .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .right{display:flex;gap:6px;align-items:center;flex:none}
.gold{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;background:var(--surface);padding:6px 11px;border-radius:999px}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe28a,#e5a50a);box-shadow:inset 0 0 0 1.5px #c58a00;flex:none}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;color:var(--sub);background:none;border:0;border-radius:10px}
.card{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:12px;min-width:0}
.card h2{font-size:17px;margin:0 0 12px}
.card h2.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .aside{font-size:13px;font-weight:500;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* pixel doll: layered 64x64 sprites */
.doll{position:relative;width:64px;height:64px;flex:none}
.doll img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.avatar{width:76px;height:76px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.who{font-size:13px;color:var(--sub)}
.big{font-size:21px;font-weight:700;margin:2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lv{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px}
.delta{font-size:12.5px;font-weight:500}
.up{color:var(--red)} .down{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar.thin{height:5px;margin-top:6px}
.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
.barlabel b{color:var(--ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.stats3 .k{font-size:12px;color:var(--muted)} .stats3 .v{font-size:17px;font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:11px 0;width:100%;background:none;border:0;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.ic{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--sub);font-size:18px}
.ic.blue{background:var(--accent-soft);color:var(--accent)}
.item .t{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .d{font-size:13px;color:var(--muted)}
.chev{color:var(--tabicon);font-size:18px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:500;font-size:14px;padding:10px 14px;line-height:1.3}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.soft{background:var(--accent-soft);color:var(--accent);font-weight:700}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.btn.link{background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:12.5px}
.cta{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:16px;margin:4px 0 12px}
.cta.soft{background:var(--accent-soft);color:var(--accent)}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;width:100%;max-width:480px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--tabicon);background:none;border:0;padding:2px 0;position:relative}
.tab.on{color:var(--ink);font-weight:700}
.tab .dot{position:absolute;top:2px;left:calc(50% + 10px)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;font-size:13.5px;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--sub)}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.red{color:var(--red)}
.chip.gold{color:var(--gold)}
.rar0{color:var(--r0)} .rar1{color:var(--r1)} .rar2{color:var(--r2)} .rar3{color:var(--r3)} .rar4{color:var(--r4)}
.rb0{border-color:var(--r0)!important} .rb1{border-color:var(--r1)!important} .rb2{border-color:var(--r2)!important} .rb3{border-color:var(--r3)!important} .rb4{border-color:var(--r4)!important}
.label{font-size:13px;color:var(--sub);font-weight:500;margin:4px 0 8px}
/* season flow */
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 9px;border-radius:99px;color:var(--muted);background:var(--surface-2)}
.steps span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.steps span.done{color:var(--ink)}
.block{display:grid;gap:8px;padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
.block h3{font-size:16px}
.die{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);font-weight:700;font-size:12px;margin-right:3px;vertical-align:-4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{display:grid;gap:2px;text-align:left;padding:11px 12px;background:var(--surface-2);border:2px solid transparent;border-radius:12px}
.opt b{font-size:14.5px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.trainbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trainbtns button{display:grid;justify-items:center;gap:0;padding:9px 4px;background:var(--surface-2);border:2px solid transparent;border-radius:12px}
.trainbtns button.key{border-color:var(--accent-soft)}
.trainbtns small{font-size:11.5px;color:var(--muted)}
.logline{font-size:13.5px}
.battle{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.battle:last-child{border-bottom:0}
.battle .m{font-size:12px;color:var(--muted)}
.battle .q{font-weight:500;min-width:0;font-size:14px}
.battle .s2{grid-column:2/4;font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.badge.g1{color:var(--good)} .badge.g2{color:var(--accent)} .badge.g3{color:var(--gold)} .badge.bad{color:var(--red)}
.res{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;font-size:13.5px;padding:3px 0}
.res .k{color:var(--muted);font-size:12.5px}
.stamp{display:inline-block;color:var(--gold);font-weight:700;border:2px solid var(--gold);border-radius:8px;padding:0 8px}
.fade{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar>i{transition:none}}
/* character */
.stage{background:linear-gradient(180deg,var(--accent-soft),var(--surface-2));border-radius:18px;height:200px;display:grid;place-items:center;margin-bottom:12px}
.stage .doll{width:160px;height:160px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:var(--surface-2);border:0;border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.sq{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;border:2px solid transparent;overflow:hidden;flex:none}
.sq img{width:34px;height:34px;image-rendering:pixelated;image-rendering:crisp-edges}
.sq svg{width:24px;height:24px}
.slot .nm{font-size:12px;font-weight:500;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.slot .nm small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.slot.empty .sq{border:1.5px dashed var(--line);background:transparent}
.slot.empty .nm{color:var(--muted)}
.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rings .slot{padding:8px 2px 6px}
.rings .sq{width:36px;height:36px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.st{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
.st .k{color:var(--sub)} .st.key .k{color:var(--ink);font-weight:700}
.st b{font-weight:700}
.st .b{font-size:11.5px;color:var(--good);font-weight:500}
.plus{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;border:0;padding:0}
.setbox{border:1.5px dashed var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--sub)}
/* bag */
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--surface-2);position:relative;display:grid;place-items:center;border:2px solid transparent;padding:0}
.cell img{width:34px;height:34px;image-rendering:pixelated;image-rendering:crisp-edges}
.cell svg{width:26px;height:26px}
.cell .n{position:absolute;right:5px;bottom:2px;font-size:11px;font-weight:700;color:var(--sub)}
.cell .new{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cell.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cell.blank{background:transparent;border:1.5px dashed var(--line)}
.eff{font-size:13px;color:var(--sub);line-height:1.6}
.eff b{color:var(--ink)}
.cmp.up{color:var(--good)} .cmp.down{color:var(--red)}
/* create */
.cstage{height:220px}
.cstage .doll{width:160px;height:160px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:10px}
.field input,.field select{font:inherit;color:var(--ink);background:none;border:0;text-align:right;padding:7px 8px;min-width:0;flex:1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px;color:var(--ink);background:var(--surface-2);border:0;border-radius:12px;padding:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
.rank{font-weight:700;width:22px;text-align:center;color:var(--muted);flex:none}
.rank.g{color:var(--gold)}
.badge2{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:9;max-width:calc(100% - 32px);text-align:center;animation:fade .25s ease-out both}
</style>
</head>
<body>
<main class="app" id="app"></main>

<script>
(() => {
const SAVE_KEY = 'hero-notebook-save-v2', HALL_KEY = 'hero-notebook-hall-v1', VER = 3;
const STATS = [['str','힘'],['agi','민첩'],['int','지능'],['vit','체력'],['spi','정신'],['luk','행운']];
const SN = Object.fromEntries(STATS);
/* 노전직 견습생. 옛 저장의 직업은 핵심 능력·칭호를 그대로 쓰도록 남겨 둔다. */
const NOVICE = {name:'노비스',key:['str','vit','agi'],styles:['균형형','강타형','철벽형'],titles:['들판의 몽둥이','불굴의 견습생','떠오르는 별']};
const LEGACY = {
  warrior:{name:'전사',key:['str','vit','agi'],titles:['불굴의 방패','붉은 도끼','전장의 사자']},
  archer:{name:'궁수',key:['agi','luk','str'],titles:['매의 눈','바람 사수','백발백중']},
  mage:{name:'마법사',key:['int','spi','luk'],titles:['폭풍의 현자','별을 읽는 자','화염 군주']},
  cleric:{name:'성직자',key:['spi','vit','int'],titles:['새벽의 손','정화의 등불','은빛 기도']},
};
const clsOf = c => LEGACY[c] || NOVICE;
const ORIGINS = ['북부 설원','동부 항구','남부 사막','서부 숲','중앙 왕도'];
const FACTIONS = [
  {name:'마을 자경단',lv:50,bonus:0},{name:'왕립 수련원',lv:52,bonus:0},{name:'변방 용병단',lv:58,bonus:0},
  {name:'모험가 길드',lv:65,bonus:-2},{name:'왕국 기사단',lv:72,bonus:0},{name:'왕실 근위대',lv:80,bonus:1},{name:'전설의 원정대',lv:87,bonus:2},
];
const QUESTS = [
  ['마을 외곽 늑대 퇴치','곡물창고 쥐떼 소탕','실종된 양 찾기','산적 정찰','폐가 유령 소동'],
  ['교관과의 대련','폐광 탐사 실습','약초 채집 호위','야간 경계 훈련'],
  ['상단 호위','고블린 소굴 토벌','국경 초소 방어','오크 약탈대 격퇴','다리 통행세 산적 소탕'],
  ['던전 3층 공략','트롤 현상금 사냥','유적 조사 호위','늪지 히드라 토벌','거미 여왕 둥지 소각'],
  ['국경 요새 탈환','흑기사단 격파','와이번 둥지 토벌','반란군 진압','망령 군단 저지'],
  ['왕도 공성 방어','암살 길드 소탕','왕녀 호위 원정','거인족 회담 호위','마수의 숲 개척'],
  ['고룡 레드혼 토벌','마왕군 전위 격파','심연의 문 봉인','리치 왕 토벌','하늘섬 탈환전'],
];
const MONTHS = ['2월','3월','5월','6월','8월','9월','11월'];
const ROLES = ['예비대','분대원','선봉'];
const POT = {2:65,3:68,4:70,5:73,6:76,7:79,8:82,9:85,10:88,11:91,12:95};
const TRAITS = {
  early:{name:'조숙형',desc:'21세까지 훈련 +1, 노쇠가 1년 빨리 시작'},
  late:{name:'대기만성',desc:'21세까지 훈련 −1, 24~29세 훈련 +1'},
  iron:{name:'강철몸',desc:'해마다 부상 1회를 털고 일어난다'},
  glass:{name:'유리몸',desc:'훈련과 원정에서 더 쉽게 다친다'},
  bold:{name:'대담함',desc:'대업·대륙 대전·영웅의 별 판정 +1'},
  genius:{name:'천재',desc:'잠재력 +5'},
};
const TRAIT_KEYS = ['early','late','iron','glass','bold','genius'];
const NAMES = ['아린','도윤','세라','카일','하람','리오','유나','테오'];
const HAIRS = [['#5a302a','갈색'],['#3a3646','흑발'],['#deb460','금발'],['#be4634','적발'],['#c6c8d8','은발'],['#4c6ebe','청발'],['#dc7ca4','분홍']];
const SKINS = [['#f6c39f','밝은 피부'],['#e7a77f','살구빛'],['#be7e58','구릿빛'],['#805238','어두운 피부']];
const HAIR_STYLES = ['기본 머리'];

/* ---------- level ---------- */
const MAX_LV = 30;
const growth = lv => 30 * Math.pow(12, (Math.min(lv, MAX_LV) - 1) / 29);
const needExp = lv => Math.round(70 + 3.5 * growth(lv));

/* ---------- equipment ---------- */

const bandFor = lv => clamp(Math.floor(lv/5), 0, 6);
function makeItem(slot, band, rar){
  const it = {id:uid(), slot, band:clamp(band,0,6), rar:clamp(rar,0,4), isNew:true};
  if (slot==='ring') it.st = pick(STATS)[0];
  return it;
}
const randomSlot = () => pick(LOOT_SLOTS);
function itemInfo(it){
  const b = it.band, r = it.rar, sp = SLOT_SPEC[it.slot], mult = 1 + .15*r;
  const v = w => Math.max(1, Math.round((b+1)*w + r*.6));
  const bon = {};
  if (it.slot==='ring') bon[it.st] = v(.5);
  else sp.bon.forEach(([k,w]) => bon[k] = v(w));
  return {
    name: it.slot==='ring' ? `${ITEM_NAMES.ring[b]} ${SN[it.st]}의 반지` : ITEM_NAMES[it.slot][b],
    reqLv: BANDS[b], atk: it.slot==='weapon' ? Math.round(ATK[b]*mult) : 0,
    def: sp.def ? Math.round(DEF[b]*sp.def*mult) : 0, bon,
    set: ARMOR_SET_SLOTS.includes(it.slot) ? b : null,
    price: (b+1)*(r+1)*15,
  };
}
function effText(info){
  const p = [];
  if (info.atk) p.push(`공격력 <b>+${info.atk}</b>`);
  if (info.def) p.push(`방어력 <b>+${info.def}</b>`);
  for (const k in info.bon) p.push(`${SN[k]} <b>+${info.bon[k]}</b>`);
  return p.join(' · ');
}
const equipped = () => [...SLOT_ORDER, ...RING_SLOTS].map(s=>S.equip[s]).filter(Boolean);

/* ---------- core ---------- */
const cls = () => clsOf(S.cls);
function bonus(stat){ let b = 0; for (const it of equipped()) b += itemInfo(it).bon[stat] || 0; return b; }
const eff = k => S.stats[k] + bonus(k);
const cp = () => Math.round(cls().key.reduce((s,k)=>s+eff(k),0)/3);
const baseCP = () => Math.round(cls().key.reduce((s,k)=>s+S.stats[k],0)/3);
const gearAtk = () => equipped().reduce((s,it)=>s+itemInfo(it).atk,0);
const gearDef = () => equipped().reduce((s,it)=>s+itemInfo(it).def,0);
const atk = () => 5 + eff('str') + gearAtk() + S.lv*2;
const def = () => Math.round(eff('vit')/2) + gearDef() + S.lv;
const crit = () => 3 + Math.floor(eff('luk')/6);
const hpMax = () => 80 + S.lv*12 + eff('vit')*2;
const mpMax = () => 30 + S.lv*4 + eff('int') + eff('spi');
const roleFor = () => { const lv = FACTIONS[S.fac].lv, c = cp(); return c>=lv ? 2 : c>=lv-4 ? 1 : 0; };
function candidates(){
  const C = NOVICE, others = STATS.map(s=>s[0]).filter(k=>!C.key.includes(k));
  const keyVals = [[45,45,45],[52,45,38],[38,45,52]], otherVals = [[40,35,30],[35,40,30],[30,40,35]];
  return keyVals.map((kv,i) => { const st = {}; C.key.forEach((k,j)=>st[k]=kv[j]); others.forEach((k,j)=>st[k]=otherVals[i][j]); return {style:C.styles[i], stats:st}; });
}
function addStat(k, amt){
  const isKey = cls().key.includes(k); let g = 0;
  for (let i=0;i<amt;i++){
    if (S.stats[k] >= 99) break;
    S.stats[k]++;
    if (isKey && baseCP() > S.pot){ S.stats[k]--; break; }
    g++;
  }
  S.peak = Math.max(S.peak, cp());
  return g;
}
const decStat = (k,amt) => { S.stats[k] = Math.max(1, S.stats[k]-amt); };
const lowestKey = () => cls().key.slice().sort((a,b)=>S.stats[a]-S.stats[b])[0];
function clampVitals(){ S.hp = clamp(S.hp ?? hpMax(), 0, hpMax()); S.mp = clamp(S.mp ?? mpMax(), 0, mpMax()); }
function gainExp(n){
  n = Math.max(0, Math.round(n));
  if (S.lv >= MAX_LV){ S.exp = 0; return 0; }
  S.exp += n; let ups = 0;
  while (S.lv < MAX_LV && S.exp >= needExp(S.lv)){ S.exp -= needExp(S.lv); S.lv++; S.points++; ups++; }
  if (S.lv >= MAX_LV) S.exp = 0;
  if (ups){ S.hp = hpMax(); S.mp = mpMax(); if (S.y) S.y.lvUps = (S.y.lvUps||0) + ups; }
  return ups;
}
const expTag = (n, ups) => ` · <b style="color:var(--gold)">EXP +${n}</b>${ups?` · <b style="color:var(--accent)">레벨 업! Lv.${S.lv}</b>`:''}`;
function trainGain(d){
  const a = S.age; let g = a<=21 ? d : a<=27 ? Math.ceil(d/2) : a<=30 ? (d>=4?1:0) : 0;
  if (a<=30){
    if (S.trait==='early' && a<=21) g+=1;
    if (S.trait==='late' && a<=21) g=Math.max(0,g-1);
    if (S.trait==='late' && a>=24 && a<=29) g+=1;
    if (S.y.rivalA) g+=1;
  }
  return g;
}
function injure(sev){
  const y = S.y;
  if (S.trait==='iron' && !y.ironUsed){ y.ironUsed = true; return '쓰러졌지만 곧장 털고 일어났다.'; }
  if (y.immune){ y.immune = false; return '푹 쉬어 둔 덕에 큰일은 피했다.'; }
  const r = sev || d6();
  if (r<=3){ y.missed += 1; return '<b style="color:var(--red)">가벼운 부상</b> · 원정 1회 결장'; }
  if (r<=5){ y.missed += 2; decStat('agi',1); return '<b style="color:var(--red)">중상</b> · 원정 2회 결장, 민첩 −1'; }
  y.missed = 99; y.seasonOut = true; decStat('vit',2);
  return '<b style="color:var(--red)">시즌 아웃</b> · 남은 원정 전부 결장, 체력 −2';
}
function revealTrait(){ if (!S.traitShown){ S.traitShown = true; return true; } return false; }
function lootTier(boost){
  const base = [0,0,0,1,2,2,3][S.fac];
  const r = d6(); let t = base + (r===6?1:0) - (r===1?1:0) + (boost||0);
  const cap = (boost && S.fac>=5) ? 4 : 3;
  return clamp(t, 0, cap);
}
function gainItem(it){
  if (S.bag.length >= BAG_MAX) return false;
  S.bag.push(it); S.tot.items = (S.tot.items||0) + 1;
  if (it.rar===4) S.tot.legend = (S.tot.legend||0) + 1;
  return true;
}
const itemLabel = it => `<span class="rar${it.rar}">${RARITY[it.rar]} ${itemInfo(it).name}</span>`;

/* ---------- quests ---------- */
function genQuests(){
  const gi = bestGround(), G = GROUNDS[gi], rew = () => ({exp:Math.round(needExp(S.lv)*.25), gold:20+S.lv*5});
  const third = S.y.role>=1 ? {type:'battle',n:1,t:'원정에서 「활약」 이상 1회'} : {type:'great',n:1,t:'사냥에서 「대성공」 이상 1회'};
  return [
    {type:'kill',g:gi,n:10+gi*2,t:`${G.name}에서 몬스터 처치`,p:0,...rew()},
    {type:'train',n:3,t:'수련 3회 마치기',p:0,...rew()},
    {...third,p:0,...rew()},
  ];
}
function questProgress(type, amount, g){
  if (!S.y || !S.y.quests) return;
  for (const q of S.y.quests) if (!q.done && q.type===type && (q.g==null || q.g===g)){ q.p = Math.min(q.n, q.p + amount); }
}
const questReady = q => !q.claimed && q.p >= q.n;
function claimQuest(i){
  const q = S.y.quests[i]; if (!q || !questReady(q)) return;
  q.claimed = true; S.gold += q.gold; const ups = gainExp(q.exp); S.tot.quests = (S.tot.quests||0)+1;
  toast(`의뢰 완료 · EXP +${q.exp}, 골드 +${q.gold}${ups?` · Lv.${S.lv}!`:''}`); save(); render();
}
const mainReady = () => S.mainDone < MAIN_QUESTS.length && S.lv >= MAIN_QUESTS[S.mainDone].lv;
function claimMain(){
  if (!mainReady()) return;
  const M = MAIN_QUESTS[S.mainDone], it = makeItem(randomSlot(), bandFor(M.lv), M.rar);
  const ok = gainItem(it); S.gold += 50*M.lv; S.mainDone++; S.tot.quests = (S.tot.quests||0)+1;
  toast(`메인 퀘스트 완료 · 골드 +${50*M.lv}${ok?` · ${RARITY[it.rar]} ${itemInfo(it).name}`:' · 가방이 가득 차 장비를 놓쳤다'}`); save(); render();
}

function newGame(){
  const c = candidates()[draft.cand];
  const p = roll2(), t = d6(), trait = TRAIT_KEYS[t-1];
  S = {
    ver:VER, name: draft.name.trim() || '이름 없는 견습생', origin: draft.origin, cls:'novice', style: c.style,
    hair: draft.hair, hairStyle: draft.hairStyle||0, skin: draft.skin||0,
    stats: {...c.stats}, pot: Math.min(99, POT[p.t] + (trait==='genius'?5:0)), trait, traitShown:false,
    age:15, fac:0, peak:45, benchStreak:0, nextTrain:0,
    lv:1, exp:0, points:0, hp:null, mp:null, gold:50, inv:{hp:2, mp:1}, mats:{}, mainDone:0,
    equip:{weapon:makeItem('weapon',0,0), top:makeItem('top',0,0), bottom:makeItem('bottom',0,0)}, bag:[],
    tot:{stars:0,titles:0,merit:0,wins:0,caps:0,missions:0,tourWins:0,kills:0,quests:0,items:0,legend:0}, hist:[], awards:[], retired:false,
  };
  Object.values(S.equip).forEach(it=>it.isNew=false);
  S.peak = cp();
  startYear(true);
}
function startYear(first){
  const notes = [];
  if (!first){
    S.age++;
    const left = (S.y && S.y.quests || []).filter(questReady);
    left.forEach(q => { q.claimed = true; S.gold += q.gold; gainExp(q.exp); });
    if (left.length) notes.push(`지난해 끝낸 의뢰 ${left.length}개의 보상을 받았다.`);
  }
  const ageStart = S.trait==='early' ? 29 : 30;
  if (S.age >= ageStart){
    const k = cls().key, rel = S.age - (ageStart - 30);
    if (rel<=32){ decStat('agi',2); decStat('vit',1); notes.push('세월이 몸에 닿는다. 민첩 −2, 체력 −1.'); }
    else if (rel<=35){ decStat('agi',3); decStat('vit',2); k.filter(x=>x!=='agi'&&x!=='vit').forEach(x=>decStat(x,1)); notes.push('몸이 예전 같지 않다. 민첩 −3, 체력 −2, 다른 핵심 능력 −1.'); }
    else { decStat('agi',3); decStat('vit',2); STATS.forEach(([x])=>decStat(x,2)); notes.push('노장의 해. 모든 능력이 깎여 나간다.'); }
  }
  if (S.age >= 21 && revealTrait()) notes.push(`스물한 살, 자신의 기질을 깨달았다: <b>${TRAITS[S.trait].name}</b>.`);
  S.y = { age:S.age, fac:S.fac, role:roleFor(), cpStart:cp(), lvStart:S.lv, notes, mod:0, firstBonus:0, missed:0,
    trainLeft:3 + Math.min(1,S.nextTrain), train:[], ones:0, huntLeft:3, hunts:[], event:roll2(), eventDone:null, battles:null, review:null, offerDecided:false };
  S.y.quests = genQuests();
  S.hp = hpMax(); S.mp = mpMax();
  S.nextTrain = 0;
  S.phase = 'event';
  save();
}
function eventFor(t){
  const k = cls().key;
  const E = {
    2:{t:'큰 부상',x:'훈련장에서 말이 날뛰었다. 떨어지는 순간 다리에서 소리가 났다.',c:[{l:'이를 악문다',f:()=>injure(6)}]},
    3:{t:'단장 교체',x:'새 단장이 부임해 명단을 다시 짠다.',c:[{l:'명단을 확인한다',f:()=>{
        const r=d6(), y=S.y;
        if (r<=3){ y.role=Math.max(0,y.role-1); return `${die(r)} 새 단장은 너를 눈여겨보지 않는다. 올해는 <b>${ROLES[y.role]}</b>.`; }
        y.role=Math.min(2,y.role+1); return `${die(r)} 새 단장이 너를 콕 집었다. 올해는 <b>${ROLES[y.role]}</b>.`; }}]},
    4:{t:'슬럼프',x:'몽둥이가 무겁고 발이 꼬인다. 이유 없이 손이 떨린다.',c:[
        {l:'그냥 버틴다',d:'올해 원정 판정 −1',f:()=>{S.y.mod-=1;return '버티기로 했다. 원정 판정 −1.';}},

function doTrain(stat){
  const y = S.y; if (S.phase!=='train' || y.trainLeft<=0) return;
  const d = d6(), g0 = trainGain(d), g = addStat(stat, g0);
  y.trainLeft--;
  let note = '';
  if (g0>0 && g<g0) note = cls().key.includes(stat) ? ' · 잠재력의 벽' : ' · 한계치';
  if (S.age>30) note = ' · 나이 탓에 유지만 된다';
  if (d===1){
    y.ones++;
    const hit = (S.trait==='glass' || y.risky) ? true : y.ones>=2;
    if (hit && !y.trainHurt){ y.trainHurt = true; note += ' · ' + injure(); }
  }
  const ups = gainExp(15);
  y.train.push({stat, d, g, note, exp:15, ups});
  questProgress('train', 1);
  save(); render();
}
const groundOpen = gi => S.lv >= GROUNDS[gi].min;
function bestGround(){ let b = 0; GROUNDS.forEach((g,i)=>{ if (groundOpen(i)) b = i; }); return b; }
function doHunt(gi, burst){
  const y = S.y, G = GROUNDS[gi];
  if (S.phase!=='train' || y.huntLeft<=0 || !groundOpen(gi)) return;
  if (burst && S.mp < 15) return;
  if (burst) S.mp -= 15;
  const r = roll2(), power = atk() + def();
  const mod = clamp(Math.round((power - G.pow)/12), -4, 4) + (burst?2:0);
  const tot = r.t + mod;
  const R = tot<=4 ? ['고전','bad',.5,.38,[1,2],0] : tot<=7 ? ['성공','',1,.22,[3,5],.25] : tot<=10 ? ['대성공','g2',1.3,.12,[5,8],.45] : ['완벽','g3',1.6,.06,[8,12],1];
  const over = S.lv > G.max + 2;
  let exp = G.exp * R[2] * (over ? .5 : 1);
  const kills = rnd(...R[4]);
  let dmg = Math.round(hpMax() * R[3] * (1 + Math.max(0, G.pow - power)/150));
  const h = {g:gi, a:r.a, b:r.b, mod, tot, label:R[0], cls:R[1], kills, burst};
  if (S.hp - dmg <= 0){
    S.hp = 1; exp *= .5; h.faint = true; h.injury = injure();
  } else S.hp -= dmg;
  h.dmg = dmg;
  h.gold = rnd(...G.gold) * (R[0]==='고전'?0:1) + (R[0]==='완벽'?G.gold[1]:0);
  S.gold += h.gold;
  const m = R[0]==='고전' ? 0 : rnd(1,3); if (m){ S.mats[G.mat] = (S.mats[G.mat]||0) + m; h.mat = m; }
  if (Math.random() < R[5]){ const it = makeItem(randomSlot(), gi, lootTier(R[0]==='완벽'?1:0)); h.loot = gainItem(it) ? it : 'full'; }
  h.exp = Math.round(exp); h.ups = gainExp(h.exp);
  S.tot.kills = (S.tot.kills||0) + kills;
  questProgress('kill', kills, gi);
  if (R[0]==='대성공' || R[0]==='완벽') questProgress('great', 1);
  y.huntLeft--; y.hunts.push(h);
  save(); render();
}
function doBattles(){
  const y = S.y, lv = FACTIONS[S.fac].lv, qs = QUESTS[S.fac];
  let n = y.role===2 ? 5 : y.role===1 ? 3 : 0, benchRoll = null;
  if (y.role===0){ benchRoll = d6(); n = benchRoll>=4 ? 1 : 0; }
  const months = MONTHS.slice().sort(()=>Math.random()-.5).slice(0,n).sort((a,b)=>MONTHS.indexOf(a)-MONTHS.indexOf(b));
  const list = [];
  for (let i=0;i<n;i++){
    const q = pick(qs), m = months[i];
    if (y.missed>0){ y.missed--; list.push({m,q,skip:true}); continue; }
    const r = roll2();
    const base = clamp(Math.trunc((cp()-lv)/3), -3, 3);
    const mod = base + y.mod + (list.filter(b=>!b.skip).length===0 ? y.firstBonus : 0);
    const tot = r.t + mod;
    const R = tot<=4 ? ['부진',5.5,0,'발이 묶였다','bad'] : tot<=7 ? ['무난',6.5,0,'제 몫은 했다',''] : tot<=9 ? ['활약',7.5,1,'결정적인 한 수를 보탰다','g1'] : tot<=11 ? ['맹활약',8.5,2,'적의 우두머리를 쓰러뜨렸다','g2'] : ['전설적',9.5,3,'음유시인들이 노래로 만들었다','g3'];
    const b = {m,q,a:r.a,bb:r.b,mod,tot,label:R[0],rating:R[1],merit:R[2],flavor:R[3],cls:R[4]};
    if (R[0]==='전설적') S.nextTrain = 1;
    const chance = [0,.3,.5,1][R[2]];
    if (R[2]>0 && Math.random() < chance){
      const it = makeItem(randomSlot(), bandFor(S.lv), lootTier(R[2]===3 ? 1 : 0));
      b.loot = gainItem(it) ? it : 'full';
    }
    if (r.t===2 || (S.trait==='glass' && r.t===3)) b.injury = injure();
    b.exp = Math.round((20 + S.fac*12) * R[1] / 6.5); b.ups = gainExp(b.exp);
    b.gold = 10 + S.fac*8; S.gold += b.gold;
    if (R[2]>=1) questProgress('battle', 1);
    list.push(b);
  }
  const played = list.filter(b=>!b.skip);
  y.battles = {list, benchRoll, played:played.length,
    avg: played.length ? played.reduce((s,b)=>s+b.rating,0)/played.length : null,
    merit: played.reduce((s,b)=>s+b.merit,0)*3,
    missions: played.length ? (y.role===2 ? 30+d6() : y.role===1 ? 15+d6() : d6()) : 0};
  S.phase = 'battle'; save(); render();
}
const pathFromCP = c => c>=60 ? 4 : c>=55 ? 3 : c>=48 ? 2 : null;
function doReview(){
  const y = S.y, B = y.battles, R = {lines:[]};
  const effRole = y.seasonOut ? 0 : y.role;
  const avg = B.avg ?? 0, bold = S.trait==='bold' ? 1 : 0;
  if (effRole===2){ const got=[]; for(let i=0;i<3;i++){ const k=lowestKey(); if(addStat(k,1)) got.push(SN[k]); } R.lines.push(['출전 성장', got.length ? `선봉 경험 · ${got.join(', ')} +1` : '잠재력의 벽에 막혔다']); }
  else if (effRole===1){ const k=lowestKey(); const g=addStat(k,1); R.lines.push(['출전 성장', g ? `${SN[k]} +1` : '잠재력의 벽']); }
  else if (S.age>=21){ S.pot=Math.max(40,S.pot-3); R.lines.push(['출전 성장', '<b style="color:var(--red)">예비대로 한 해를 보냈다. 잠재력 −3</b>']); }
  else R.lines.push(['출전 성장', '예비대라 실전 경험이 없었다']);
  S.benchStreak = effRole===0 ? S.benchStreak+1 : 0;
  const fr = roll2(), fmod = FACTIONS[S.fac].bonus + (effRole===2 && avg>=8 ? 1 : 0) + bold, ft = fr.t + fmod;
  const res = ft>=11 ? '대업 달성' : ft>=8 ? '상위권' : ft>=5 ? '중위권' : '부진';
  R.win = res==='대업 달성';
  let winLoot = '';
  if (R.win){ const it = makeItem(randomSlot(), bandFor(S.lv), Math.min(3, lootTier()+1)); winLoot = gainItem(it) ? ` · 보상 ${itemLabel(it)}` : ' · 가방이 가득 차 보상을 놓쳤다'; }
  R.lines.push([`소속 성적`, `${die(fr.a,fr.b)} ${sgn(fmod)} → <b>${res}</b>${winLoot}`]);
  if (effRole===2 && avg>=8){
    const tr = roll2();
    if (tr.t>=9){ R.title = pick(cls().titles); R.lines.push(['개인 칭호', `${die(tr.a,tr.b)} 올해의 <b>「${R.title}」</b>`]); }
    else R.lines.push(['개인 칭호', `${die(tr.a,tr.b)} 후보에 올랐지만 놓쳤다`]);
  }
  if (S.age<=18 && cp()>=55 && y.role>=1) R.lines.push(['왕국', '견습 기사단에 소집됐다']);
  if (cp()>=70 && effRole===2){
    R.cap = true;
    const kr = roll2(), km = Math.trunc((cp()-75)/5) + bold;
    R.tour = kr.t + km >= 11;
    R.lines.push(['왕국 수호단', `소집 · 대륙 대전 ${die(kr.a,kr.b)} ${sgn(km)} → ${R.tour ? '<b>우승</b>' : '탈락'}`]);
  }
  if (cp()>=85 && effRole===2 && avg>=8){
    const sr = roll2(), sm = (R.win?2:0)+(R.title?1:0)+(R.tour?1:0)+(avg>=9?1:0)+(S.fac===6?1:0)+bold;
    R.star = sr.t + sm >= 11;
    let starLoot = '';
    if (R.star){ const it = makeItem(randomSlot(), bandFor(S.lv), 4); starLoot = gainItem(it) ? `<br>부상으로 ${itemLabel(it)}` : ''; }
    R.lines.push(['영웅의 별', `${die(sr.a,sr.b)} ${sgn(sm)} → ${R.star ? '<span class="stamp">수상</span>' : '아쉽게 놓쳤다'}${starLoot}`]);
  } else if (cp()>=80) R.lines.push(['영웅의 별', '후보 조건 미달 (전투력 85 · 선봉 · 평점 8.0)']);
  const T = S.tot;
  T.merit += B.merit; T.missions += B.missions;
  if (R.win) T.wins++; if (R.title) T.titles++; if (R.cap) T.caps++; if (R.tour) T.tourWins++; if (R.star) T.stars++;
  if (R.title) S.awards.push(`${S.age}세 「${R.title}」`);
  if (R.star) S.awards.push(`${S.age}세 영웅의 별`);
  if (R.tour) S.awards.push(`${S.age}세 대륙 대전 우승`);
  S.peak = Math.max(S.peak, cp());
  if (S.age===17 || (S.fac===1 && S.age>=18)){
    let to = pathFromCP(cp()), how = '';
    if (to===null){ const tr = roll2(); if (tr.t>=8){ to = 2; how = `${die(tr.a,tr.b)} 입단 시험 통과`; } else { to = 1; how = `${die(tr.a,tr.b)} 입단 시험 탈락, 1년 더 수련`; } }
    R.lines.push(['진로', `${how ? how+' · ' : ''}전투력 ${cp()} → <b>${FACTIONS[to].name}</b>`]);
    S.fac = to;
  } else if (S.age>=18){
    if (B.avg!==null && avg>=7){
      const orr = roll2(), om = Math.trunc((avg-7)*2) + (y.rivalB?2:0), ot = orr.t + om;
      const up = ot>=12 ? 2 : ot>=10 ? 1 : 0;
      const to = Math.min(6, S.fac + up);
      if (up>0 && to>S.fac){ R.offer = {to, kind:'영입'}; R.lines.push(['영입 제안', `${die(orr.a,orr.b)} ${sgn(om)} → <b>${FACTIONS[to].name}</b>에서 손을 내밀었다`]); }
      else R.lines.push(['영입 제안', `${die(orr.a,orr.b)} ${sgn(om)} → 관심만 보이고 끝났다`]);
    }
    if (!R.offer && S.benchStreak>=2 && S.fac>2){ R.offer = {to:S.fac-1, kind:'파견'}; R.lines.push(['파견 제안', `두 해째 예비대. ${FACTIONS[S.fac-1].name}로 내려가 뛰어 볼 수 있다`]); }
  }
  if (S.age>=33){
    const rr = roll2();
    R.retire = rr.t <= S.age-30;
    R.lines.push(['은퇴 판정', `${die(rr.a,rr.b)} (${S.age-30} 이하면 은퇴) → ${R.retire ? '<b style="color:var(--red)">무기를 내려놓을 때가 왔다</b>' : '한 해 더 싸운다'}`]);
  }
  S.hist.push({age:S.age, fac:y.fac, role:effRole, cpS:y.cpStart, cpE:cp(), lvS:y.lvStart, lvE:S.lv, avg:B.avg, merit:B.merit, res,
    award:[R.star?'영웅의 별':'', R.title?`「${R.title}」`:'', R.tour?'대전 우승':''].filter(Boolean).join(' · ')});
  y.review = R; y.offerDecided = !R.offer;

}
function decideOffer(accept){
  const R = S.y.review;

  else R.offerResult = '제안을 거절하고 남았다.';

}
function retire(){
  S.retired = true; S.phase = 'retired';

  const h = hall();
  h.push({name:S.name, cls:S.cls, stars:T.stars, peak:S.peak, titles:T.titles, merit:T.merit, age:S.age, grade:S.grade, lv:S.lv, look:look()});
  h.sort((a,b)=>b.stars-a.stars || b.peak-a.peak || b.titles-a.titles || b.merit-a.merit);

/* ---------- gear actions ---------- */
function equipItem(id, ringSlot){
  const i = S.bag.findIndex(x=>x.id===id); if (i<0) return;
  const it = S.bag[i], info = itemInfo(it);
  if (S.lv < info.reqLv){ toast(`Lv.${info.reqLv}부터 장착할 수 있다.`); return; }
  let target = it.slot;
  if (it.slot==='ring'){
    target = ringSlot || RING_SLOTS.find(s=>!S.equip[s]);
    if (!target){ UI.ringPick = true; render(); return; }
  }
  const off = [S.equip[target]];
  if (it.slot==='suit') off.push(S.equip.top, S.equip.bottom);
  if (it.slot==='top' || it.slot==='bottom') off.push(S.equip.suit);
  const back = off.filter(Boolean);
  if (S.bag.length - 1 + back.length > BAG_MAX){ toast('가방이 가득 찼다.'); return; }
  S.bag.splice(i,1); it.isNew = false;
  if (it.slot==='suit'){ S.equip.top = null; S.equip.bottom = null; }
  if (it.slot==='top' || it.slot==='bottom') S.equip.suit = null;
  S.equip[target] = it;
  back.forEach(x=>S.bag.push(x));
  UI.sel = null; UI.ringPick = false;
  S.peak = Math.max(S.peak, cp()); clampVitals();
  toast(`${info.name} 장착`); save(); render();
}
function unequip(slot){
  const it = S.equip[slot]; if (!it) return;
  if (S.bag.length >= BAG_MAX){ toast('가방이 가득 찼다.'); return; }
  S.equip[slot] = null; S.bag.push(it); clampVitals(); save(); render();
}
function sellItem(id){
  const i = S.bag.findIndex(x=>x.id===id); if (i<0) return;
  const p = itemInfo(S.bag[i]).price; S.gold += p; S.bag.splice(i,1); UI.sel = null;
  toast(`골드 +${p}`); save(); render();
}
function buyPotion(k){ const P = POTIONS[k]; if (S.gold < P.price){ toast('골드가 모자라다.'); return; } S.gold -= P.price; S.inv[k]++; save(); render(); }
function usePotion(k){
  if (!S.inv[k]) return;
  if (k==='hp'){ if (S.hp>=hpMax()){ toast('HP가 이미 가득하다.'); return; } S.hp = Math.min(hpMax(), S.hp + Math.round(hpMax()*.6)); }
  else { if (S.mp>=mpMax()){ toast('MP가 이미 가득하다.'); return; } S.mp = Math.min(mpMax(), S.mp + Math.round(mpMax()*.6)); }
  S.inv[k]--; save(); render();
}
function sellMats(){
  let g = 0;
  for (const [n,c] of Object.entries(S.mats)){ const gi = GROUNDS.findIndex(x=>x.mat===n); g += c * 5 * (Math.max(0,gi)+1); }
  if (!g) return; S.mats = {}; S.gold += g; toast(`골드 +${g}`); save(); render();
}
function spendPoint(k){
  if (!S.points) return;
  if (addStat(k,1)){ S.points--; clampVitals(); save(); render(); }
  else toast(S.stats[k]>=99 ? '이미 최대치다.' : '잠재력의 벽에 막혔다. 다른 능력에 써 보자.');

const gold = () => `<div class="gold"><span class="coin"></span><span class="num">${fmt(S.gold)}</span></div>`;
function top(title, sub, extra){
  return `<div class="top"><div class="grow"><h1>${title}</h1>${sub?`<div class="s">${sub}</div>`:''}</div><div class="right">${extra||''}${gold()}</div></div>`;
}
function bars(){
  const pct = S.lv>=MAX_LV ? 100 : S.exp/needExp(S.lv)*100;
  return `<div class="barlabel"><span>경험치</span><span>${S.lv>=MAX_LV ? '<b>최고 레벨</b>' : `<b>${pct.toFixed(1)}%</b> · 다음 레벨까지 ${fmt(needExp(S.lv)-S.exp)}`}</span></div>
    <div class="bar" role="progressbar" aria-label="경험치" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;background:var(--exp)"></i></div>
    <div class="barlabel"><span>HP</span><span><b class="num">${S.hp}</b> / ${hpMax()}</span></div>
    <div class="bar"><i style="width:${S.hp/hpMax()*100}%;background:var(--hp)"></i></div>
    <div class="barlabel"><span>MP</span><span><b class="num">${S.mp}</b> / ${mpMax()}</span></div>
    <div class="bar"><i style="width:${S.mp/mpMax()*100}%;background:var(--mp)"></i></div>`;
}
function todos(){
  const T = [];
  if (S.retired) return T;
  const y = S.y;
  const ph = {event:['올해의 사건이 기다려요','사건 확인하기'], train:[`수련 ${y.trainLeft}회 · 사냥 ${y.huntLeft}회 남았어요`,'수련하고 사냥한 뒤 원정을 떠나요'], battle:['원정이 끝났어요','한 해 결산하기'], review:[y.offerDecided?'한 해가 끝났어요':'제안이 도착했어요', y.offerDecided?`${S.age+1}세로 넘어가기`:'제안에 답하기']}[S.phase];
  if (ph) T.push({ic:'flag', blue:true, t:ph[0], d:ph[1], go:'adv:year', dot:true});
  if (S.points) T.push({ic:'star', blue:true, t:'능력치 포인트가 남았어요', d:`${S.points}포인트 · 캐릭터에서 분배`, go:'char', dot:true});
  if (mainReady()) T.push({ic:'flag', t:`메인 퀘스트 · ${MAIN_QUESTS[S.mainDone].t}`, d:'보상을 받을 수 있어요', go:'adv:quest', dot:true});
  const rq = y.quests.filter(questReady).length, lq = y.quests.filter(q=>!q.claimed && !questReady(q)).length;
  if (rq) T.push({ic:'trend', blue:true, t:`완료한 의뢰 ${rq}개`, d:'보상 받기', go:'adv:quest', dot:true});
  else if (lq) T.push({ic:'trend', t:`올해 의뢰 ${lq}개 진행 중`, d:y.quests.filter(q=>!q.claimed).map(q=>`${q.t} ${q.p}/${q.n}`).join(' · '), go:'adv:quest'});
  const nw = S.bag.filter(x=>x.isNew);
  if (nw.length) T.push({ic:'box', t:'새 장비를 얻었어요', d:nw.slice(0,2).map(x=>`${RARITY[x.rar]} · ${itemInfo(x).name}`).join(', ')+(nw.length>2?` 외 ${nw.length-2}개`:''), go:'bag', dot:true});
  if (S.hp < hpMax()*.4 && S.inv.hp) T.push({ic:'box', t:'HP가 낮아요', d:`체력 물약 ${S.inv.hp}개 보유`, go:'bag:use'});
  return T;
}
const todoDot = () => todos().some(t=>t.dot);
function todoList(T){
  return `<div class="list">${T.map(t=>`<button class="item" data-go="${t.go}"><span class="ic ${t.blue?'blue':''}">${svg(t.ic)}</span>
    <span class="grow"><span class="t">${t.t}${t.dot?' <span class="dot"></span>':''}</span><span class="d" style="display:block">${t.d}</span></span><span class="chev">›</span></button>`).join('')}</div>`;
}

/* ---------- home ---------- */
function homeView(){
  const F = FACTIONS[S.fac], last = S.hist[S.hist.length-1], dc = S.y && !S.retired ? cp() - S.y.cpStart : last ? last.cpE - last.cpS : 0;
  const T = todos();
  let h = top('내 공책 그정도 아님', `${esc(S.name)}의 ${S.hist.length + (S.retired?0:1)}년째`, `<button class="iconbtn" data-go="rec:save" aria-label="저장 설정">${svg('gear',22)}</button>`);
  h += `<section class="card">
    <div class="row"><span class="avatar">${dollHTML(look())}</span>
      <div class="grow"><div class="who">${esc(S.name)} · ${F.name} · ${S.age}세</div>
        <div class="big"><span class="lv">Lv.${S.lv}</span>전투력 ${cp()}</div>
        <div class="delta ${S.retired?'muted':dc>0?'up':dc<0?'down':'muted'}">${S.retired?`은퇴 · ${S.grade}`:`올해 ${dc>0?`+${dc}`:dc<0?dc:'변동 없음'}`}</div></div></div>
    ${bars()}
    <div class="stats3"><div><div class="k">처치한 몬스터</div><div class="v num">${fmt(S.tot.kills||0)}</div></div>
      <div><div class="k">완료 퀘스트</div><div class="v num">${S.tot.quests||0}</div></div>
      <div><div class="k">공적</div><div class="v num">${S.tot.merit}</div></div></div>
  </section>`;
  if (S.retired) h += retiredCard();
  if (T.length) h += `<section class="card"><h2>확인할 일</h2>${todoList(T)}</section>`;
  if (!S.retired) h += `<button class="cta" data-go="adv:year">${S.phase==='train' ? '모험 떠나기' : '올해 이어가기'}</button>`;
  return h;
}
function retiredCard(){
  const T = S.tot;
  return `<section class="card"><h2 class="row">은퇴식 · ${S.age}세 <span class="stamp">${S.grade}</span></h2>
    <p>${esc(S.name)}은(는) ${S.hist.length}년의 모험을 마치고 무기를 내려놓았다. 최고 전투력 <b>${S.peak}</b>, 잠재력은 <b>${S.pot}</b>였다.</p>
    <p class="small muted" style="margin-top:6px">Lv.${S.lv} · 대륙 대전 우승 ${T.tourWins}회 · 임무 ${T.missions}회</p>
    ${S.awards.length ? `<p class="small" style="margin-top:6px">${S.awards.join(' · ')}</p>` : ''}
    <div class="btns"><button class="btn pri" data-act="new">새 견습생 받기</button></div></section>`;
}

/* ---------- adventure ---------- */
function seg(key, opts){
  return `<div class="seg" role="tablist">${opts.map(([v,n])=>`<button role="tab" aria-selected="${UI[key]===v}" class="${UI[key]===v?'on':''}" data-seg="${key}:${v}">${n}</button>`).join('')}</div>`;
}
function advView(){
  const y = S.y;
  let h = top('모험', S.retired ? '은퇴한 모험가' : `${S.age}세 · ${FACTIONS[S.fac].name} · ${ROLES[y.role]}`);
  if (S.retired){ return h + `<section class="card"><p class="muted">은퇴한 모험가는 더 이상 모험을 떠나지 않는다. 홈에서 새 견습생을 받을 수 있다.</p></section>`; }
  h += seg('adv', [['year','올해'],['hunt','사냥터'],['quest','퀘스트']]);
  if (UI.adv==='hunt') h += huntView();
  else if (UI.adv==='quest') h += questView();
  else h += seasonCard();
  return h;
}
function steps(){
  const st = [['event','사건'],['train','수련·사냥'],['battle','원정'],['review','결산']];
  const idx = st.findIndex(s=>s[0]===S.phase);
  return `<div class="steps">${st.map((s,i)=>`<span class="${i===idx?'on':i<idx?'done':''}">${s[1]}</span>`).join('')}</div>`;
}
function eventBlock(){
  const y = S.y, E = eventFor(y.event.t);
  if (y.eventDone) return `<div class="block"><h3>${E.t}</h3><p class="muted small">${E.x}</p><p class="logline fade">${y.eventDone}</p></div>`;
  return `<div class="block"><div class="row"><h3>${E.t}</h3><span>${die(y.event.a,y.event.b)}</span></div><p>${E.x}</p>
    <div class="choices">${E.c.map((c,i)=>`<button class="opt" data-act="event" data-i="${i}"><b>${c.l}</b>${c.d?`<small>${c.d}</small>`:''}</button>`).join('')}</div></div>`;
}
function trainBlock(){
  const y = S.y, k = cls().key;
  if (S.phase==='event') return '';
  const done = y.train.map((t,i)=>`<p class="logline fade">수련 ${i+1} · ${SN[t.stat]} ${die(t.d)} → <b>+${t.g}</b>${t.note}${t.exp?expTag(t.exp,t.ups):''}</p>`).join('');
  if (S.phase!=='train') return y.train.length ? `<div class="block"><h3>수련</h3>${done}</div>` : '';
  const hint = S.age<=21 ? '주사위 눈만큼' : S.age<=27 ? '주사위 눈의 절반(올림)만큼' : S.age<=30 ? '4 이상이면 1' : '더 이상';
  return `<div class="block"><div class="row" style="justify-content:space-between"><h3>수련</h3><span class="small muted">남은 횟수 <b>${y.trainLeft}</b></span></div>
    <p class="small muted">${S.age}세는 ${hint} 오른다. 수련마다 EXP +15. 테두리가 있는 칸이 핵심 능력이다.</p>
    ${done}
    ${y.trainLeft>0 ? `<div class="trainbtns">${STATS.map(([s,n])=>`<button class="${k.includes(s)?'key':''}" data-act="train" data-s="${s}">${n}<small>${S.stats[s]}</small></button>`).join('')}</div>` : ''}</div>`;
}
function huntLog(){
  const y = S.y; if (!y.hunts.length) return '';
  return y.hunts.map(hh=>{ const G = GROUNDS[hh.g];
    return `<div class="battle fade"><span class="m">${G.ico}</span><span class="q">${G.name}${hh.burst?' · 전력':''}</span><span class="badge ${hh.cls}">${hh.label}</span>
      <span class="s2">${die(hh.a,hh.b)} ${sgn(hh.mod)} = ${hh.tot} · ${pick(G.mons)} 등 ${hh.kills}마리 · HP −${hh.dmg}${hh.faint?' · <b style="color:var(--red)">기절</b> '+hh.injury:''}${expTag(hh.exp,hh.ups)}${hh.gold?` · 골드 +${hh.gold}`:''}${hh.mat?` · ${G.mat} ${hh.mat}`:''}
      ${hh.loot ? `<br><b>${hh.loot==='full' ? '전리품이 있었지만 가방이 가득 찼다' : `전리품 · ${itemLabel(hh.loot)}`}</b>` : ''}</span></div>`; }).join('');
}
function huntBlock(){
  const y = S.y; if (S.phase==='event') return '';
  if (S.phase!=='train') return y.hunts.length ? `<div class="block"><h3>사냥</h3>${huntLog()}</div>` : '';
  const gi = bestGround(), G = GROUNDS[gi];
  return `<div class="block"><div class="row" style="justify-content:space-between"><h3>사냥</h3><span class="small muted">남은 횟수 <b>${y.huntLeft}</b></span></div>
    ${huntLog()}
    ${y.huntLeft>0 ? `<p class="small muted">추천 사냥터 <b style="color:var(--ink)">${G.name}</b> · 다른 곳은 사냥터 탭에서 고른다.</p>
      <div class="btns" style="margin-top:0"><button class="btn soft" data-act="hunt" data-g="${gi}">${G.ico} ${G.name}</button><button class="btn" data-act="hunt" data-g="${gi}" data-burst="1" ${S.mp<15?'disabled':''}>전력 사냥 · MP 15</button></div>` : ''}
    </div>`;
}
function battleBlock(){
  const B = S.y.battles; if (!B) return '';
  let h = `<div class="block"><h3>원정</h3>`;
  if (B.benchRoll!==null) h += `<p class="logline">예비대 출전 기회 ${die(B.benchRoll)} ${B.benchRoll>=4 ? '→ 부름을 받았다' : '→ 올해는 부름이 없었다'}</p>`;
  h += `<div>${B.list.map((b,i)=> b.skip
    ? `<div class="battle fade" style="animation-delay:${i*.1}s"><span class="m">${b.m}</span><span class="q">${b.q}</span><span class="badge bad">결장</span></div>`
    : `<div class="battle fade" style="animation-delay:${i*.1}s"><span class="m">${b.m}</span><span class="q">${b.q}</span><span class="badge ${b.cls}">${b.label} ${b.rating.toFixed(1)}</span>
        <span class="s2">${die(b.a,b.bb)} ${sgn(b.mod)} = ${b.tot} · ${b.flavor}${b.merit?` · 공적 ${b.merit}`:''}${b.injury?` · ${b.injury}`:''}${b.exp!=null?expTag(b.exp,b.ups):''}
        ${b.loot ? `<br><b>${b.loot==='full' ? '전리품이 있었지만 가방이 가득 찼다' : `전리품 · ${itemLabel(b.loot)}`}</b>` : ''}</span></div>`).join('')}</div>`;
  if (B.played) h += `<p class="logline">평균 평점 <b>${B.avg.toFixed(2)}</b> · 공적 <b>${B.merit}</b> · 임무 <b>${B.missions}</b>회</p>`;
  h += `</div>`;
  if (S.phase==='battle') h += `<button class="cta" style="margin-top:14px" data-act="review">한 해 결산</button>`;
  return h;
}
function reviewBlock(){
  const R = S.y.review; if (!R) return '';
  let h = `<div class="block"><h3>결산</h3><div>${R.lines.map(([a,b])=>`<div class="res fade"><span class="k">${a}</span><span>${b}</span></div>`).join('')}</div>`;
  if (R.offer && !S.y.offerDecided){
    h += `<p><b>${FACTIONS[R.offer.to].name}</b>(선봉 기준 ${FACTIONS[R.offer.to].lv})로 ${R.offer.kind==='파견'?'파견 갈까?':'옮길까?'} 지금 전투력 ${cp()}.</p>
      <div class="btns"><button class="btn pri" data-act="offer" data-v="1">${R.offer.kind==='파견'?'파견 간다':'옮긴다'}</button><button class="btn" data-act="offer" data-v="0">남는다</button></div>`;
  } else if (R.offerResult) h += `<p class="logline">→ ${R.offerResult}</p>`;
  h += `</div>`;
  if (S.y.offerDecided){
    h += R.retire ? `<button class="cta" style="margin-top:14px" data-act="retire">은퇴식 열기</button>`
      : `<button class="cta" style="margin-top:14px" data-act="next">${S.age+1}세로 넘어가기</button>${S.age>=30?'<button class="cta soft" data-act="retire">스스로 은퇴한다</button>':''}`;
  }
  return h;
}
function seasonCard(){
  const y = S.y;
  const left = S.phase==='train' && y.trainLeft===0 && y.huntLeft===0;
  return `<section class="card">
    <h2 class="row">${S.age}세 시즌 ${steps()}</h2>
    <p class="small muted">${FACTIONS[S.fac].name} · 올해 <b style="color:var(--ink)">${ROLES[y.role]}</b>${y.role===2?' · 원정 5회':y.role===1?' · 원정 3회':' · 기회가 오면 원정 1회'}</p>
    ${y.notes.map(n=>`<p class="logline" style="margin-top:6px">${n}</p>`).join('')}
    ${eventBlock()}${trainBlock()}${huntBlock()}
    ${S.phase==='train' ? `<button class="cta ${left?'':'soft'}" style="margin-top:14px" data-act="battle">원정 떠나기${left?'':` · 남은 수련 ${y.trainLeft} · 사냥 ${y.huntLeft}은 사라짐`}</button>` : ''}
    ${battleBlock()}${reviewBlock()}
  </section>`;
}
function huntView(){
  const y = S.y, can = S.phase==='train' && y.huntLeft>0, best = bestGround();
  let h = `<section class="card"><h2 class="row">사냥터 <span class="aside">${can ? `올해 남은 사냥 ${y.huntLeft}회` : S.phase==='event' ? '사건을 먼저 확인해요' : '올해 사냥 시기가 지났어요'}</span></h2>
    <p class="small muted" style="margin-bottom:6px">공격력 ${atk()} + 방어력 ${def()} = 사냥 힘 <b style="color:var(--ink)">${atk()+def()}</b> · HP ${S.hp}/${hpMax()}</p><div class="list">`;
  GROUNDS.forEach((G,i)=>{
    const open = groundOpen(i), over = S.lv > G.max + 2;
    h += `<div class="item" style="${open?'':'opacity:.5'}"><span class="ic ${i===best?'blue':''}">${G.ico}</span>
      <span class="grow"><span class="t">${G.name} <span class="chip ${i===best?'blue':''}">${open ? (i===best?'추천 ':'') : '잠김 · '}Lv.${G.min}${G.max>G.min?`–${G.max}`:''}</span></span>
      <span class="d" style="display:block">${G.mons.join(', ')} · 힘 ${G.pow} · EXP ${G.exp}${over?' (레벨이 높아 절반)':''} · ${G.mat}</span></span>
      ${open && can ? `<button class="btn sm soft" data-act="hunt" data-g="${i}">사냥</button>` : ''}</div>`;
  });
  h += `</div></section>`;
  if (can) h += `<section class="card"><h2>물약</h2><div class="btns" style="margin-top:0">
    <button class="btn" data-act="potion" data-k="hp" ${S.inv.hp?'':'disabled'}>체력 물약 ${S.inv.hp}개 사용</button>
    <button class="btn" data-act="potion" data-k="mp" ${S.inv.mp?'':'disabled'}>마나 물약 ${S.inv.mp}개 사용</button></div></section>`;
  if (y.hunts.length) h += `<section class="card"><h2>올해 사냥 기록</h2>${huntLog()}</section>`;
  return h;
}
function questView(){
  const y = S.y;
  let h = `<section class="card"><h2>메인 퀘스트</h2><div class="list">`;
  MAIN_QUESTS.forEach((M,i)=>{
    const done = i < S.mainDone, ready = i===S.mainDone && S.lv>=M.lv, cur = i===S.mainDone;
    if (!done && !cur) return;
    h += `<div class="item"><span class="grow"><span class="t"><span class="chip blue">메인</span> ${M.t}${done?' <span class="chip">완료</span>':''}</span>
      <span class="d" style="display:block">${M.d} · 보상 골드 ${50*M.lv}, ${RARITY[M.rar]} 장비</span>
      ${cur?`<span class="bar thin" style="display:block"><i style="width:${Math.min(100,S.lv/M.lv*100)}%;background:var(--accent)"></i></span>`:''}</span>
      ${ready?'<button class="btn sm pri" data-act="claimmain">받기</button>':''}</div>`;
  });
  if (S.mainDone>=MAIN_QUESTS.length) h += `<p class="small muted">모든 메인 퀘스트를 마쳤다.</p>`;
  h += `</div></section><section class="card"><h2 class="row">올해 의뢰 <span class="aside">해가 바뀌면 새로 받아요</span></h2><div class="list">`;
  y.quests.forEach((q,i)=>{
    const tag = {kill:'사냥',train:'수련',battle:'원정',great:'사냥'}[q.type];
    h += `<div class="item"><span class="grow"><span class="t"><span class="chip">${tag}</span> ${q.t}${q.claimed?' <span class="chip">완료</span>':''}</span>
      <span class="d" style="display:block">${q.p} / ${q.n} · 보상 EXP ${q.exp}, 골드 ${q.gold}</span>
      <span class="bar thin" style="display:block"><i style="width:${q.p/q.n*100}%;background:var(--exp)"></i></span></span>
      ${questReady(q)?`<button class="btn sm pri" data-act="claim" data-i="${i}">받기</button>`:''}</div>`;
  });
  return h + `</div></section>`;
}

/* ---------- character ---------- */
function slotCell(slotKey, it, label){
  if (!it) return `<div class="slot empty"><span class="sq"></span><span class="nm">${label}<small>비어 있음</small></span></div>`;
  const info = itemInfo(it);
  return `<button class="slot" data-act="slot" data-s="${slotKey}" aria-label="${info.name} 정보"><span class="sq rb${it.rar}">${itemIcon(it)}</span><span class="nm">${info.name}<small>${label} · <span class="rar${it.rar}">${RARITY[it.rar]}</span></small></span></button>`;
}
function setSummary(){
  const cnt = {};
  ARMOR_SET_SLOTS.forEach(s=>{ const it = S.equip[s]; if (it) cnt[it.band] = (cnt[it.band]||0) + (s==='suit'?2:1); });
  const rows = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([b,c])=>`<b style="color:var(--ink)">${SET_NAMES[b]} 세트</b> ${c}/5`);
  return rows.length ? rows.join(' · ') : '세트 장비를 입지 않았다';
}
function charView(){
  const k = cls().key, sel = UI.slotSel ? S.equip[UI.slotSel] : null;
  let h = top('캐릭터', `${cls().name} · Lv.${S.lv} · ${esc(S.style)}`);
  h += `<section class="card"><div class="stage">${dollHTML(look())}</div>
    <div class="slots">${SLOT_ORDER.map(s=>slotCell(s, S.equip[s], SLOTN[s])).join('')}</div>
    <div class="label" style="margin-top:14px">반지 · 5칸</div>

  }
  const items = S.bag.slice().sort((a,b)=>b.rar-a.rar || b.band-a.band);
  const cells = items.map(it=>`<button class="cell rb${it.rar} ${UI.sel===it.id?'sel':''}" data-act="sel" data-id="${it.id}" aria-label="${RARITY[it.rar]} ${itemInfo(it).name}">${itemIcon(it)}${it.isNew?'<span class="new"></span>':''}</button>`);
  const blanks = Math.max(0, Math.ceil((items.length+1)/5)*5 - items.length);
  h += `<section class="card">${items.length ? `<div class="inv">${cells.join('')}${'<span class="cell blank"></span>'.repeat(blanks)}</div>` : '<p class="small muted">사냥과 원정에서 전리품을 얻으면 여기에 쌓인다.</p>'}</section>`;
  const it = S.bag.find(x=>x.id===UI.sel);
  if (it){
    const info = itemInfo(it), slots = it.slot==='ring' ? RING_SLOTS : it.slot==='suit' ? ['suit','top','bottom'] : (it.slot==='top'||it.slot==='bottom') ? [it.slot,'suit'] : [it.slot];
    const cur = slots.map(s=>S.equip[s]).filter(Boolean);
    const curInfo = it.slot==='ring' ? null : cur.map(itemInfo);
    const cmp = (k, v) => { if (!curInfo) return ''; const old = curInfo.reduce((s,c)=>s+(k==='atk'?c.atk:k==='def'?c.def:(c.bon[k]||0)),0), d = v - old; return d ? ` <span class="cmp ${d>0?'up':'down'}">${d>0?'▲'+d:'▼'+(-d)}</span>` : ''; };
    const parts = [];
    if (info.atk) parts.push(`공격력 <b>+${info.atk}</b>${cmp('atk',info.atk)}`);
    if (info.def) parts.push(`방어력 <b>+${info.def}</b>${cmp('def',info.def)}`);
    for (const k in info.bon) parts.push(`${SN[k]} <b>+${info.bon[k]}</b>${cmp(k,info.bon[k])}`);
    const low = S.lv < info.reqLv;
    h += `<section class="card"><div class="row"><span class="sq rb${it.rar}" style="width:56px;height:56px">${itemIcon(it)}</span>
      <span class="grow"><span class="who" style="display:block">${SLOTN[it.slot]} · <b class="rar${it.rar}">${RARITY[it.rar]}</b> · <span style="${low?'color:var(--red)':''}">Lv.${info.reqLv} 이상</span>${info.set!=null?` · ${SET_NAMES[info.set]} 세트`:''}</span>
      <b style="font-size:18px">${info.name}</b></span></div>
      <p class="eff" style="margin-top:10px">${parts.join(' · ')}</p>
      ${cur.length && it.slot!=='ring' ? `<p class="xs muted">지금 착용: ${cur.map(c=>itemInfo(c).name).join(', ')}${it.slot==='suit'?' (한벌옷을 입으면 상의·하의를 벗는다)':''}</p>` : ''}
      ${UI.ringPick && it.slot==='ring' ? `<p class="small" style="margin-top:8px">반지 칸이 가득 찼다. 바꿀 칸을 고른다.</p><div class="btns">${RING_SLOTS.map((s,i)=>`<button class="btn sm" data-act="equip" data-id="${it.id}" data-ring="${s}">${i+1}번<br><span class="xs muted">${itemInfo(S.equip[s]).name.replace(' 반지','')}</span></button>`).join('')}</div>` : ''}
      ${S.retired ? '' : `<div class="btns"><button class="btn soft" data-act="sell" data-id="${it.id}">팔기 · ${info.price}골드</button><button class="btn pri" data-act="equip" data-id="${it.id}" ${low?'disabled':''}>${low?`Lv.${info.reqLv} 필요`:'장착하기'}</button></div>`}
    </section>`;
  }
  return h;
}

/* ---------- render ---------- */
const TABS = [['home','홈'],['adv','모험'],['char','캐릭터'],['bag','가방'],['rec','기록']];
function render(){
  if (!S){ app.className = 'app notabs'; app.innerHTML = createView(); return; }
  const V = {home:homeView, adv:advView, char:charView, bag:bagView, rec:recView}[UI.tab] || homeView;
  const dots = {home:false, adv:!S.retired && ['event','battle','review'].includes(S.phase), char:!!S.points && !S.retired, bag:S.bag.some(x=>x.isNew), rec:false};
  app.className = 'app';
  app.innerHTML = V() + `<nav class="tabs" aria-label="메뉴"><div class="in">${TABS.map(([k,n])=>`<button class="tab ${UI.tab===k?'on':''}" data-go="${k}" ${UI.tab===k?'aria-current="page"':''}>${svg(k,24)}${n}${dots[k]&&UI.tab!==k?'<span class="dot"></span>':''}</button>`).join('')}</div></nav>`;
}
function go(dest){
  const [tab, sub] = dest.split(':');
  UI.tab = tab; UI.ringPick = false;
  if (sub){ if (tab==='adv') UI.adv = sub; if (tab==='bag') UI.bag = sub; if (tab==='rec') UI.rec = sub; }
  render(); window.scrollTo({top:0});
}

/* ---------- events ---------- */
app.addEventListener('input', e => { if (e.target.id==='f-name') draft.name = e.target.value; });
app.addEventListener('change', e => { if (e.target.id==='f-origin') draft.origin = e.target.value; });
app.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const sg = e.target.closest('[data-seg]'); if (sg){ const [k,v] = sg.dataset.seg.split(':'); UI[k] = v; UI.ringPick = false; render(); return; }
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='cand'){ draft.cand = +b.dataset.v; render(); return; }
  if (a==='hair'){ draft.hair = +b.dataset.v; render(); return; }
  if (a==='skin'){ draft.skin = +b.dataset.v; render(); return; }
  if (a==='start'){ newGame(); UI.tab = 'home'; render(); window.scrollTo({top:0}); return; }
  if (a==='event'){ const E = eventFor(S.y.event.t); S.y.eventDone = E.c[+b.dataset.i].f(); S.phase = 'train'; save(); render(); return; }
  if (a==='train'){ doTrain(b.dataset.s); return; }
  if (a==='hunt'){ doHunt(+b.dataset.g, !!b.dataset.burst); return; }
  if (a==='battle'){ doBattles(); return; }
  if (a==='review'){ doReview(); return; }
  if (a==='offer'){ decideOffer(b.dataset.v==='1'); return; }
  if (a==='next'){ S.bag.forEach(x=>x.isNew=false); startYear(false); render(); window.scrollTo({top:0}); return; }
  if (a==='retire'){ retire(); UI.tab = 'home'; render(); window.scrollTo({top:0}); return; }
  if (a==='claim'){ claimQuest(+b.dataset.i); return; }
  if (a==='claimmain'){ claimMain(); return; }
  if (a==='point'){ spendPoint(b.dataset.s); return; }
  if (a==='slot'){ UI.slotSel = b.dataset.s || null; render(); return; }
  if (a==='unequip'){ unequip(b.dataset.s); UI.slotSel = null; render(); return; }
  if (a==='sel'){ UI.sel = UI.sel===b.dataset.id ? null : b.dataset.id; UI.ringPick = false; const it = S.bag.find(x=>x.id===b.dataset.id); if (it && it.isNew){ it.isNew = false; save(); } render(); return; }
  if (a==='equip'){ equipItem(b.dataset.id, b.dataset.ring); return; }
  if (a==='sell'){
    if (b.dataset.confirm){ sellItem(b.dataset.id); return; }
    b.dataset.confirm = '1'; b.textContent = '정말 판다'; return;
  }
  if (a==='buy'){ buyPotion(b.dataset.k); return; }
  if (a==='potion'){ usePotion(b.dataset.k); return; }
  if (a==='sellmats'){ sellMats(); return; }
  if (a==='new'){ S = null; store.del(SAVE_KEY); draft = newDraft(); UI.tab = 'home'; render(); window.scrollTo({top:0}); return; }
  if (a==='abandon'){
    if (b.dataset.confirm){ S = null; store.del(SAVE_KEY); draft = newDraft(); render(); return; }
    b.dataset.confirm = '1'; b.textContent = '정말 버린다 (되돌릴 수 없음)'; return;
  }
  const msg = document.getElementById('savemsg'), box = document.getElementById('savebox');
  if (a==='copy'){
    try { await navigator.clipboard.writeText(box.value); msg.textContent = '복사했다.'; }
    catch(err){ box.select(); msg.textContent = '자동 복사가 막혀 있다. 선택된 내용을 직접 복사한다.'; }
    return;
  }
  if (a==='import'){
    try {
      const d = JSON.parse(box.value);
      if (!d || !d.stats || !d.cls) throw new Error();
      S = migrate(d); save(); UI.tab = 'home'; render(); window.scrollTo({top:0});
    } catch(err){ msg.textContent = '불러오지 못했다. 저장 내용 전체를 그대로 붙여 넣었는지 확인한다.'; }
  }
});

/* ---------- save migration ---------- */
function migrate(d){
  if (!d) return d;
  if (!d.ver || d.ver < 3){
    // v2: 직업 4개 · 장비 4칸(무기·머리·갑옷·방패, tier 0~4) · 레벨 없음
    const years = (d.hist||[]).length;
    d.lv = clamp(1 + Math.round(years*1.6), 1, MAX_LV); d.exp = 0; d.points = 0;
    d.gold = d.gold || 0; d.inv = d.inv || {hp:2, mp:1}; d.mats = d.mats || {};
    d.mainDone = MAIN_QUESTS.filter(m=>m.lv < d.lv).length;
    const band = bandFor(d.lv), conv = old => {
      if (!old) return null;
      const slot = {weapon:'weapon', helm:'helm', armor:'top', cape:'shield'}[old.slot] || old.slot;
      if (slot==='shield'){ d.gold += (band+1)*((old.tier||0)+1)*15; return null; }
      return {id:old.id||uid(), slot, band, rar:clamp(old.tier||0,0,4), isNew:!!old.isNew};
    };
    const oe = d.equip || {};
    d.equip = {weapon:conv(oe.weapon && {...oe.weapon, slot:'weapon'}), helm:conv(oe.helm && {...oe.helm, slot:'helm'}), top:conv(oe.armor && {...oe.armor, slot:'armor'})};
    if (oe.shield) conv({...oe.shield, slot:'shield'});
    if (oe.cape) conv({...oe.cape, slot:'shield'});
    d.bag = (d.bag||[]).map(conv).filter(Boolean);
    d.hair = [1,0,2,3,4][d.hair ?? 1] ?? 0; d.hairStyle = 0; d.skin = clamp(d.skin ?? 0, 0, 3);
    d.tot = {kills:0, quests:0, items:0, legend:0, ...(d.tot||{})};
    d.hp = null; d.mp = null;
    if (d.y){
      d.y.huntLeft = d.phase==='event' || d.phase==='train' ? 3 : 0; d.y.hunts = []; d.y.lvStart = d.lv;
      d.y.quests = []; d.y.train = (d.y.train||[]);
    }
    d.ver = 3;
  }
  for (const s of [...SLOT_ORDER, ...RING_SLOTS]) if (!(s in d.equip)) d.equip[s] = null;
  if (!d.inv) d.inv = {hp:0, mp:0};
  if (!d.mats) d.mats = {};
  S = d;
  if (S.y && (!S.y.quests || !S.y.quests.length) && !S.retired) S.y.quests = genQuests();
  clampVitals();
  return S;
}
function boot(data){
  S = migrate((data && data.S) || store.get(SAVE_KEY) || null);
  if (data && data.draft) draft = {...newDraft(), ...data.draft};
  if (data && data.UI) Object.assign(UI, data.UI);
  render();
}
window.claude?.hot?.snapshot?.(() => ({S, draft, UI}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
