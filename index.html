<title>내 공책 그정도 아님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one game column — hero panel with the pixel character and gear on top, this year's season card, then bag, career log, hall of fame */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#17202c; --muted:#677284; --line:#dce2ea;
  --accent:#2c66d8; --accent-ink:#ffffff; --gold:#c4860f; --red:#cf4545; --good:#22915a;

  --display:'Do Hyeon','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --pixel:'Silkscreen',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --surface-2:#1d2632; --ink:#e6ecf3; --muted:#8e9aab; --line:#283444;
  --accent:#6d9bff; --accent-ink:#0e131a; --gold:#f0bd48; --red:#f07575; --good:#5fd394;
  --r0:#9aa4b3; --r1:#5fd394; --r2:#6d9bff; --r3:#b98cff; --r4:#f0bd48; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --surface-2:#1d2632; --ink:#e6ecf3; --muted:#8e9aab; --line:#283444;
  --accent:#6d9bff; --accent-ink:#0e131a; --gold:#f0bd48; --red:#f07575; --good:#5fd394;
  --r0:#9aa4b3; --r1:#5fd394; --r2:#6d9bff; --r3:#b98cff; --r4:#f0bd48; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.px{font-family:var(--pixel);font-variant-numeric:tabular-nums;letter-spacing:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.label{font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
button{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;line-height:1.3}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

button.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
button.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:12.5px}
input,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}

.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.tally{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:12px}

.tally .px{font-size:18px}

.secret{font-family:var(--pixel);color:var(--muted)}

.steps span.on{background:var(--accent);color:var(--accent-ink)}
.steps span.done{color:var(--ink)}
.block{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.die{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--pixel);font-size:12px;margin-right:3px;vertical-align:-4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt{display:grid;gap:2px;text-align:left;padding:10px 12px}
.opt b{font-size:14.5px}
.opt small{color:var(--muted);font-size:12px}

.trainbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.trainbtns button.key{border-color:var(--accent)}
.trainbtns small{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.logline{font-size:13.5px}
.battle{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.battle:last-child{border-bottom:0}
.battle .m{font-size:12px;color:var(--muted)}
.battle .q{font-weight:500;min-width:0}

.badge.g1{color:var(--good)} .badge.g2{color:var(--accent)} .badge.g3{color:var(--gold)} .badge.bad{color:var(--red)}
.loot{font-size:12.5px;font-weight:700}
.reslist{display:grid;gap:6px}
.res{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13.5px}
.res .k{color:var(--muted);font-size:12.5px}
.fade{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.stampwin{display:inline-block;color:var(--gold);font-family:var(--display);font-size:20px;border:2px solid var(--gold);border-radius:8px;padding:0 10px}
/* bag */
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.item .body{display:grid;gap:4px;min-width:0}
.item .nm{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.item .new{font-family:var(--pixel);font-size:10px;color:var(--red);margin-left:4px}
.diff.up{color:var(--good)} .diff.down{color:var(--red)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:8px;padding:0;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;gap:12px}
  .slots{grid-template-columns:1fr 1fr}
  .slot{grid-template-columns:40px minmax(0,1fr);gap:8px;padding:6px}
  .slot .ico{width:40px;height:40px}
  .slot .ico canvas{max-width:34px;max-height:34px}
  .who .name{font-size:24px}
  .cpbox .num{font-size:32px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tally .px{font-size:16px}
  .grid2{grid-template-columns:1fr}
}
</style>

<main class="wrap" id="app"></main>

<script>
(() => {
const SAVE_KEY = 'hero-notebook-save-v2', HALL_KEY = 'hero-notebook-hall-v1';
const STATS = [['str','힘'],['agi','민첩'],['int','지능'],['vit','체력'],['spi','정신'],['luk','행운']];
const SN = Object.fromEntries(STATS);
const CLASSES = {
  warrior:{name:'전사',key:['str','vit','agi'],desc:'맨 앞에서 버티고 베어낸다',styles:['균형형','강타형','철벽형'],titles:['불굴의 방패','붉은 도끼','전장의 사자']},
  archer:{name:'궁수',key:['agi','luk','str'],desc:'멀리서 급소를 꿰뚫는다',styles:['균형형','속사형','저격형'],titles:['매의 눈','바람 사수','백발백중']},
  mage:{name:'마법사',key:['int','spi','luk'],desc:'주문 하나로 판을 뒤집는다',styles:['균형형','파괴형','현자형'],titles:['폭풍의 현자','별을 읽는 자','화염 군주']},
  cleric:{name:'성직자',key:['spi','vit','int'],desc:'동료를 살리고 어둠을 정화한다',styles:['균형형','신성형','수호형'],titles:['새벽의 손','정화의 등불','은빛 기도']},

const ORIGINS = ['북부 설원','동부 항구','남부 사막','서부 숲','중앙 왕도'];
const FACTIONS = [
  {name:'마을 자경단',lv:50,bonus:0},{name:'왕립 수련원',lv:52,bonus:0},{name:'변방 용병단',lv:58,bonus:0},
  {name:'모험가 길드',lv:65,bonus:-2},{name:'왕국 기사단',lv:72,bonus:0},{name:'왕실 근위대',lv:80,bonus:1},{name:'전설의 원정대',lv:87,bonus:2},
];

  ['마을 외곽 늑대 퇴치','곡물창고 쥐떼 소탕','실종된 양 찾기','산적 정찰','폐가 유령 소동'],
  ['교관과의 대련','폐광 탐사 실습','약초 채집 호위','야간 경계 훈련'],
  ['상단 호위','고블린 소굴 토벌','국경 초소 방어','오크 약탈대 격퇴','다리 통행세 산적 소탕'],
  ['던전 3층 공략','트롤 현상금 사냥','유적 조사 호위','늪지 히드라 토벌','거미 여왕 둥지 소각'],
  ['국경 요새 탈환','흑기사단 격파','와이번 둥지 토벌','반란군 진압','망령 군단 저지'],
  ['왕도 공성 방어','암살 길드 소탕','왕녀 호위 원정','거인족 회담 호위','마수의 숲 개척'],
  ['고룡 레드혼 토벌','마왕군 전위 격파','심연의 문 봉인','리치 왕 토벌','하늘섬 탈환전'],
];
const MONTHS = ['2월','3월','5월','6월','8월','9월','11월'];
const ROLES = ['예비대','분대원','선봉'];
const POT = {2:65,3:68,4:70,5:73,6:76,7:79,8:82,9:85,10:88,11:91,12:95};
const TRAITS = {
  early:{name:'조숙형',desc:'21세까지 훈련 +1, 노쇠가 1년 빨리 시작'},
  late:{name:'대기만성',desc:'21세까지 훈련 −1, 24~29세 훈련 +1'},
  iron:{name:'강철몸',desc:'해마다 부상 1회를 털고 일어난다'},
  glass:{name:'유리몸',desc:'훈련과 원정에서 더 쉽게 다친다'},
  bold:{name:'대담함',desc:'대업·대륙 대전·영웅의 별 판정 +1'},
  genius:{name:'천재',desc:'잠재력 +5'},
};
const TRAIT_KEYS = ['early','late','iron','glass','bold','genius'];
const NAMES = ['아린','도윤','세라','카일','하람','리오','유나','테오'];
const HAIRS = [['#2b2420','흑발'],['#7a4a24','갈색'],['#e0b95a','금발'],['#c94a3a','적발'],['#e6e6ee','은발']];

/* ---------- equipment ---------- */
const SLOTS = [['weapon','무기'],['helm','머리'],['armor','갑옷'],['shield','방패']];
const SLOTN = Object.fromEntries(SLOTS);
const RARITY = ['일반','고급','희귀','영웅','전설'];
const SLOT_KEY = {weapon:0, armor:1, helm:2, shield:2};
const SLOT_VAL = {weapon:[2,4,7,10,14], armor:[2,4,7,10,14], helm:[1,3,5,7,10], shield:[1,2,3,5,7]};
const ITEM_NAMES = {
  weapon:{warrior:['나무 검','청동 검','철검','미스릴 검','황금 성검'],archer:['나무 활','철궁','흑철 장궁','미스릴 활','황금 활'],
          mage:['나무 지팡이','비틀린 지팡이','장식 지팡이','은 지팡이','별빛 지팡이'],cleric:['나무 곤봉','철 메이스','강철 모닝스타','미스릴 메이스','황금 메이스']},
  armor:{warrior:['천 옷','가죽 갑옷','강철 테 갑옷','은빛 판금','황금 판금'],archer:['숲빛 옷','가죽 띠 조끼','사냥꾼 가죽 갑옷','숲빛 경갑','황금 경갑'],
         mage:['수수한 로브','보랏빛 로브','허리띠 로브','청록 로브','마력 갑주'],cleric:['수련복','흰 조끼','은빛 사슬옷','은빛 판금','황금 판금']},
  helm:{warrior:['머리띠','천 모자','깃털 철투구','청록 깃 투구','황금 뿔투구'],archer:['머리띠','숲빛 모자','숲빛 두건','은빛 두건','황금 깃 투구'],
        mage:['머리띠','풀빛 고깔모자','주황 고깔모자','청록 고깔모자','대마법사 모자'],cleric:['머리띠','순례자 모자','깃털 철투구','보랏빛 깃 투구','황금 투구']},
  shield:{warrior:['나무 버클러','나무 방패','철 방패','미스릴 방패','황금 방패'],archer:['나무 버클러','나무 방패','철 방패','미스릴 방패','황금 방패'],
          mage:['나무 버클러','나무 방패','철 방패','미스릴 방패','황금 방패'],cleric:['나무 버클러','나무 방패','철 방패','미스릴 방패','황금 방패']},
};

const d6 = () => 1 + Math.floor(Math.random()*6);
const roll2 = () => { const a=d6(), b=d6(); return {a,b,t:a+b}; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const die = (...xs) => xs.map(x => `<span class="die">${x}</span>`).join('');
const sgn = n => n>0 ? `+${n}` : n<0 ? `−${-n}` : '±0';
const uid = () => Math.random().toString(36).slice(2,9);

let S = null;
let draft = {name:pick(NAMES), origin:ORIGINS[4], cls:'warrior', cand:0, hair:1, hairStyle:0, skin:0};
const app = document.getElementById('app');

const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const save = () => { if (S) store.set(SAVE_KEY, S); };
const hall = () => store.get(HALL_KEY) || [];

/* ---------- core ---------- */
const cls = () => CLASSES[S.cls];

function doTrain(stat){
  const y = S.y; if (y.trainLeft<=0) return;
  const d = d6(), g0 = trainGain(d), g = addStat(stat, g0);
  y.trainLeft--;
  let note = '';
  if (g0>0 && g<g0) note = cls().key.includes(stat) ? ' · 잠재력의 벽' : ' · 한계치';
  if (S.age>30) note = ' · 나이 탓에 유지만 된다';
  if (d===1){
    y.ones++;
    const hit = (S.trait==='glass' || y.risky) ? true : y.ones>=2;
    if (hit && !y.trainHurt){ y.trainHurt = true; note += ' · ' + injure(); }
  }
  y.train.push({stat, d, g, note});
  save(); render();
}
function doBattles(){
  const y = S.y, lv = FACTIONS[S.fac].lv, qs = QUESTS[S.fac];
  let n = y.role===2 ? 5 : y.role===1 ? 3 : 0, benchRoll = null;
  if (y.role===0){ benchRoll = d6(); n = benchRoll>=4 ? 1 : 0; }
  const months = MONTHS.slice().sort(()=>Math.random()-.5).slice(0,n).sort((a,b)=>MONTHS.indexOf(a)-MONTHS.indexOf(b));
  const list = [];
  for (let i=0;i<n;i++){
    const q = pick(qs), m = months[i];
    if (y.missed>0){ y.missed--; list.push({m,q,skip:true}); continue; }
    const r = roll2();
    const base = clamp(Math.trunc((cp()-lv)/3), -3, 3);
    const mod = base + y.mod + (list.filter(b=>!b.skip).length===0 ? y.firstBonus : 0);
    const tot = r.t + mod;
    const R = tot<=4 ? ['부진',5.5,0,'발이 묶였다','bad'] : tot<=7 ? ['무난',6.5,0,'제 몫은 했다',''] : tot<=9 ? ['활약',7.5,1,'결정적인 한 수를 보탰다','g1'] : tot<=11 ? ['맹활약',8.5,2,'적의 우두머리를 쓰러뜨렸다','g2'] : ['전설적',9.5,3,'음유시인들이 노래로 만들었다','g3'];
    const b = {m,q,a:r.a,bb:r.b,mod,tot,label:R[0],rating:R[1],merit:R[2],flavor:R[3],cls:R[4]};
    if (R[0]==='전설적') S.nextTrain = 1;
    const chance = [0,.3,.5,1][R[2]];
    if (R[2]>0 && Math.random() < chance){
      const it = makeItem(pick(SLOTS)[0], lootTier(R[2]===3 ? 1 : 0));
      b.loot = gainItem(it) ? it : 'full';
    }
    if (r.t===2 || (S.trait==='glass' && r.t===3)) b.injury = injure();
    list.push(b);
  }
  const played = list.filter(b=>!b.skip);
  y.battles = {list, benchRoll, played:played.length,
    avg: played.length ? played.reduce((s,b)=>s+b.rating,0)/played.length : null,
    merit: played.reduce((s,b)=>s+b.merit,0)*3,
    missions: played.length ? (y.role===2 ? 30+d6() : y.role===1 ? 15+d6() : d6()) : 0};
  S.phase = 'battle'; save(); render();
}

  S.hist.push({age:S.age, fac:y.fac, role:effRole, cpS:y.cpStart, cpE:cp(), avg:B.avg, merit:B.merit, res,
    award:[R.star?'영웅의 별':'', R.title?`「${R.title}」`:'', R.tour?'대전 우승':''].filter(Boolean).join(' · ')});
  y.review = R; y.offerDecided = !R.offer;
  S.phase = 'review'; save(); render();
}
function decideOffer(accept){
  const R = S.y.review;
  if (accept){ S.fac = R.offer.to; R.offerResult = `${FACTIONS[S.fac].name}로 옮겼다.`; S.benchStreak = 0; }
  else R.offerResult = '제안을 거절하고 남았다.';
  S.y.offerDecided = true; save(); render();
}
function retire(){
  S.retired = true; S.phase = 'retired';
  const T = S.tot;
  S.grade = T.stars>=3 ? '전설' : T.stars>=1 ? '영웅의 별' : S.peak>=85 ? '대륙급 영웅' : T.caps>0 ? '왕국 수호자' : S.hist.some(h=>h.role===2 && h.fac>=3) ? '정예 모험가' : '떠돌이 용병';
  const h = hall();
  h.push({name:S.name, cls:S.cls, stars:T.stars, peak:S.peak, titles:T.titles, merit:T.merit, age:S.age, grade:S.grade});
  h.sort((a,b)=>b.stars-a.stars || b.peak-a.peak || b.titles-a.titles || b.merit-a.merit);
  store.set(HALL_KEY, h.slice(0,30));
  save(); render();
}
function equipItem(id){
  const i = S.bag.findIndex(x=>x.id===id); if (i<0) return;
  const it = S.bag[i], old = S.equip[it.slot];
  it.isNew = false;
  S.equip[it.slot] = it; S.bag.splice(i,1);
  if (old) S.bag.push(old);
  S.peak = Math.max(S.peak, cp());
  save(); render();
}
function unequip(slot){
  const it = S.equip[slot]; if (!it || S.bag.length>=16) return;
  S.equip[slot] = null; S.bag.push(it); save(); render();
}
function dropItem(id){ S.bag = S.bag.filter(x=>x.id!==id); save(); render(); }

const LEGS_T = [[1,3],[1,3],[0,3],[2,3],[3,3]];
const SKINS = [['#e5c49d','밝은 피부',[0,0]],['#c8a480','구릿빛',[1,0]],['#9f7c4d','어두운 피부',[2,0]],['#409c62','초록 피부',[3,0]]];
const HAIR_BLOCK = [[4,23],[0,19],[4,19],[0,23],[8,19]];
const HAIR_STYLES = [['짧은 머리',[0,0]],['땋은 머리',[1,3]],['묶은 머리',[2,1]],['수염',[0,3]]];

function dollLayers(look){
  const eq = look.equip || {}, c = look.cls, L = [];
  L.push(SKINS[look.skin||0][2]);
  L.push(LEGS_T[eq.armor ? eq.armor.tier : 0]);
  if (eq.armor) L.push(KT.armor[c][eq.armor.tier]);
  const hb = HAIR_BLOCK[look.hair||0], hs = HAIR_STYLES[look.hairStyle||0][1];
  L.push([hb[0]+hs[0], hb[1]+hs[1]]);
  if (eq.helm) L.push(KT.helm[c][eq.helm.tier]);
  if (eq.shield) L.push(KT.shield[c][eq.shield.tier]);
  if (eq.weapon) L.push(KT.weapon[c][eq.weapon.tier]);
  return L;
}
const dollCache = new Map(), iconCache = new Map();
function dollCanvas(look){
  const L = dollLayers(look), k = L.map(t=>t.join(',')).join('|');
  let cv = dollCache.get(k);
  if (cv) return cv;
  cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
  const ctx = cv.getContext('2d');
  for (const [r,c] of L) ctx.drawImage(sheet, c*17, r*17, 16, 16, 0, 0, 16, 16);
  dollCache.set(k, cv); return cv;
}
function tileIcon(r, c){
  const k = r+','+c; let v = iconCache.get(k);
  if (v) return v;
  const t = document.createElement('canvas'); t.width = 16; t.height = 16;
  const tc = t.getContext('2d'); tc.drawImage(sheet, c*17, r*17, 16, 16, 0, 0, 16, 16);
  const d = tc.getImageData(0,0,16,16).data;
  let x0=16,y0=16,x1=-1,y1=-1;
  for (let y=0;y<16;y++) for (let x=0;x<16;x++) if (d[(y*16+x)*4+3]){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; }
  if (x1<0){ x0=0; y0=0; x1=15; y1=15; }
  v = document.createElement('canvas'); v.width = x1-x0+1; v.height = y1-y0+1;
  v.getContext('2d').drawImage(t, x0, y0, v.width, v.height, 0, 0, v.width, v.height);
  iconCache.set(k, v); return v;
}

/* ---------- scenes (40x28, same pixel density as the doll) ---------- */
const SW = 40, SH = 28, GROUND = 24;
function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)]; }
function sceneData(fac, f){
  const d = new Uint8ClampedArray(SW*SH*4);
  const set = (x,y,c) => { x|=0; y|=0; if (x<0||y<0||x>=SW||y>=SH) return; const [r,g,b] = hex(c), i = (y*SW+x)*4; d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255; };
  const rect = (x0,y0,x1,y1,c) => { for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) set(x,y,c); };
  const disc = (cx,cy,rad,c) => { for (let y=cy-rad;y<=cy+rad;y++) for (let x=cx-rad;x<=cx+rad;x++) if ((x-cx)**2+(y-cy)**2 <= rad*rad+rad*0.6) set(x,y,c); };
  const tri = (x0,x1,apx,apy,base,c) => { for (let y=apy;y<=base;y++){ const t=(y-apy)/Math.max(1,base-apy), l=Math.round(apx-(apx-x0)*t), r=Math.round(apx+(x1-apx)*t); rect(l,y,r,y,c); } };
  const cloud = (x,y) => { rect(x,y,x+6,y+1,'#ffffff'); rect(x+1,y-1,x+3,y-1,'#ffffff'); rect(x,y+1,x+6,y+1,'#dff1fd'); };
  const twinkle = (pts) => pts.forEach(([x,y],i) => set(x,y, ((i+f)%3===0) ? '#ffffff' : '#9d93cf'));
  const shadow = (c) => rect(15,GROUND,24,GROUND,c);
  const flame = (x,y) => { set(x,y,(f&1)?'#ffe08a':'#ffb347'); set(x,y-1,(f&1)?'#ff7a3a':'#ffe08a'); if (f&1) set(x+1,y-1,'#ff7a3a'); else set(x-1,y-1,'#ff7a3a'); };
  if (fac===0){
    rect(0,0,SW-1,15,'#8ed1fb'); rect(0,16,SW-1,GROUND-1,'#b4e2fc');
    cloud((3+Math.floor(f/2))%46-6,4); cloud((26+Math.floor(f/3))%46-6,8);
    for (let x=0;x<SW;x++){ const h = 19 + Math.round(Math.sin(x/4)*1.2); rect(x,h,x,GROUND-1,'#8ad277'); }
    rect(2,18,8,23,'#efdcb6'); rect(8,18,8,23,'#d4be95'); tri(1,9,5,14,17,'#d0574e'); rect(5,21,5,23,'#7a4b2a'); set(3,19,'#ffe39a');
    rect(34,20,34,23,'#7a4b2a'); rect(32,15,36,19,'#4f9f3e'); rect(33,14,35,14,'#4f9f3e'); set(33,16,'#6bbd55'); set(34,15,'#6bbd55');
    rect(0,GROUND,SW-1,SH-1,'#5fae4b'); rect(0,GROUND,SW-1,GROUND,'#77c35c');
    rect(13,GROUND+1,26,SH-1,'#c9a46a'); rect(14,GROUND,25,GROUND,'#d6b37a'); shadow('#b18c56');
    [3,9,30,37].forEach(x=>set(x,GROUND+2,'#4d9a3c'));
  } else if (fac===1){
    rect(0,0,SW-1,13,'#b4b3ea'); rect(0,14,SW-1,GROUND-1,'#d4d3f5');
    for (let i=0;i<5;i++) set(4+i*8,2+(i*3)%7,'#ffffff');
    rect(0,17,SW-1,GROUND-1,'#a3a6be'); for (let x=0;x<SW;x+=3) set(x,16,'#a3a6be');
    for (let y=19;y<GROUND;y+=2) for (let x=(y&2)?0:2;x<SW;x+=4) set(x,y,'#9195ae');
    rect(30,6,36,GROUND-1,'#8f93ad'); rect(36,6,36,GROUND-1,'#7a7e98'); tri(29,37,33,2,5,'#4f5aa0'); rect(33,10,33,12,'#ffd27a'); rect(33,16,33,18,'#ffd27a');
    rect(0,GROUND,SW-1,SH-1,'#8a8ea6'); rect(0,GROUND,SW-1,GROUND,'#a2a6bd'); for (let x=0;x<SW;x+=5) rect(x,GROUND+1,x,SH-1,'#7a7e96'); shadow('#74788f');
  } else if (fac===2){
    rect(0,0,SW-1,8,'#e9875f'); rect(0,9,SW-1,15,'#f2a970'); rect(0,16,SW-1,GROUND-1,'#f7cf94');
    disc(31,17,3,'#fff0c0');
    for (let x=0;x<SW;x++){ const h = 20 + Math.round(Math.sin(x/3+1)); rect(x,h,x,GROUND-1,'#8f5f48'); }
    tri(1,11,6,13,GROUND-1,'#8a5a3a'); tri(6,11,6,13,GROUND-1,'#6b4329'); rect(5,20,7,GROUND-1,'#3a2418');
    tri(28,38,33,14,GROUND-1,'#8a5a3a'); tri(33,38,33,14,GROUND-1,'#6b4329'); rect(32,20,34,GROUND-1,'#3a2418');
    rect(0,GROUND,SW-1,SH-1,'#a5845a'); rect(0,GROUND,SW-1,GROUND,'#bb9a6a'); shadow('#8c6d47');
    rect(26,GROUND-1,28,GROUND-1,'#5a3a22'); flame(27,GROUND-2);
  } else if (fac===3){
    rect(0,0,SW-1,GROUND-1,'#2e3242');
    for (let y=0;y<GROUND;y+=4){ rect(0,y,SW-1,y,'#252836'); for (let x=(y/4)%2?3:0;x<SW;x+=6) rect(x,y,x,y+3,'#252836'); }
    rect(14,9,25,GROUND-1,'#1a1d27'); rect(15,8,24,8,'#1a1d27');
    rect(4,13,4,15,'#5a3a22'); flame(4,12); rect(35,13,35,15,'#5a3a22'); flame(35,12);
    rect(0,GROUND,SW-1,SH-1,'#4a4f63'); rect(0,GROUND,SW-1,GROUND,'#5f6580'); for (let x=2;x<SW;x+=6) rect(x,GROUND+1,x,SH-1,'#3d4154'); shadow('#3a3e50');
  } else if (fac===4){
    rect(0,0,SW-1,9,'#7fbef0'); rect(0,10,SW-1,GROUND-1,'#a9d4f6');
    cloud((30+Math.floor(f/2))%46-6,4);
    rect(0,13,SW-1,GROUND-1,'#a8aebb'); for (let x=0;x<SW;x+=4) rect(x,11,x+1,12,'#a8aebb');
    for (let y=15;y<GROUND;y+=3) for (let x=(y%2)?0:2;x<SW;x+=5) set(x,y,'#959ba9');
    rect(15,15,24,GROUND-1,'#3a3f4c'); rect(16,14,23,14,'#3a3f4c');
    rect(5,14,8,19,'#c13b3d'); rect(5,20,5,20,'#c13b3d'); rect(8,20,8,20,'#c13b3d'); set(6,16,'#e8bd4a'); set(7,16,'#e8bd4a');
    rect(31,14,34,19,'#c13b3d'); rect(31,20,31,20,'#c13b3d'); rect(34,20,34,20,'#c13b3d'); set(32,16,'#e8bd4a'); set(33,16,'#e8bd4a');
    rect(0,GROUND,SW-1,SH-1,'#5f9e52'); rect(0,GROUND,SW-1,GROUND,'#79b968'); rect(14,GROUND,25,SH-1,'#b7ae9c'); shadow('#968d7c');
  } else if (fac===5){
    rect(0,0,SW-1,GROUND-1,'#2f3566');
    rect(8,4,11,14,'#a9bcf5'); rect(9,3,10,3,'#a9bcf5'); rect(9,4,9,14,'#8aa0e6'); rect(28,4,31,14,'#a9bcf5'); rect(29,3,30,3,'#a9bcf5'); rect(29,4,29,14,'#8aa0e6');
    rect(1,2,4,GROUND-1,'#e2deef'); rect(4,2,4,GROUND-1,'#b6b0cc'); rect(0,2,5,2,'#f2f0f8'); rect(35,2,38,GROUND-1,'#e2deef'); rect(38,2,38,GROUND-1,'#b6b0cc'); rect(34,2,39,2,'#f2f0f8');
    rect(0,0,SW-1,1,'#9b2c3e'); for (let x=0;x<SW;x+=4) set(x,2,'#9b2c3e');
    rect(0,GROUND,SW-1,SH-1,'#4e4462'); for (let y=GROUND;y<SH;y+=2) for (let x=(y%4)?0:2;x<SW;x+=4) rect(x,y,x+1,y,'#5c5172');
    rect(13,GROUND,26,SH-1,'#b03447'); rect(13,GROUND,13,SH-1,'#e8bd4a'); rect(26,GROUND,26,SH-1,'#e8bd4a'); shadow('#8a2737');
  } else {
    rect(0,0,SW-1,11,'#130e2a'); rect(0,12,SW-1,19,'#1f1640'); rect(0,20,SW-1,GROUND-1,'#2c1e4e');
    twinkle([[3,3],[9,7],[15,2],[22,5],[26,10],[37,13],[5,12],[18,9]]);
    disc(32,6,3,'#f5ecd0'); set(31,5,'#e2d6b2'); set(33,8,'#e2d6b2');
    for (let x=0;x<SW;x++){ const h = 17 + Math.round(Math.sin(x/5)*2 + Math.sin(x/2)); rect(x,h,x,GROUND-1,'#211838'); }
    rect(2,15,4,GROUND-1,'#3a2f5e'); rect(2,14,2,14,'#3a2f5e'); rect(35,13,37,GROUND-1,'#3a2f5e'); rect(37,12,37,12,'#3a2f5e');
    rect(0,GROUND,SW-1,SH-1,'#33284a'); rect(0,GROUND,SW-1,GROUND,'#4a3c66'); shadow('#241c36');
    set(8+(f%3), 20-(f%4), '#ff9a4a'); set(30-(f%3), 18-(f%4), '#ff9a4a');
  }
  return new ImageData(d, SW, SH);
}

/* ---------- stage painting ---------- */
let frame = 0;
const off = document.createElement('canvas'); off.width = SW; off.height = SH;
const octx = off.getContext('2d');
function paintStage(cv, look, fac){
  octx.putImageData(sceneData(fac, frame), 0, 0);
  if (sheetReady) octx.drawImage(dollCanvas(look), 12, 8);
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 320, s = Math.max(1, Math.round(w*dpr/SW));
  if (cv.width !== SW*s){ cv.width = SW*s; cv.height = SH*s; }
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, SW*s, SH*s);
}
function draftLook(){ return {cls:draft.cls, hair:draft.hair, hairStyle:draft.hairStyle, skin:draft.skin, equip:{weapon:{tier:0}, armor:{tier:0}}}; }
function myLook(){ return {cls:S.cls, hair:S.hair, hairStyle:S.hairStyle, skin:S.skin, equip:S.equip}; }
function paintStages(){
  document.querySelectorAll('canvas[data-hero]').forEach(cv => {
    if (cv.dataset.hero==='draft') paintStage(cv, draftLook(), 0);
    else if (S) paintStage(cv, myLook(), S.fac);
  });
}
function paintIcons(){
  if (!sheetReady) return;
  const dpr = window.devicePixelRatio || 1;
  document.querySelectorAll('.ico[data-icon]').forEach(el => {
    const [slot, tier] = el.dataset.icon.split(':');
    const cl = S ? S.cls : draft.cls;
    const [r,c] = KT[slot][cl][+tier];
    const src = tileIcon(r, c), cv = el.querySelector('canvas'); if (!cv) return;
    const box = el.clientWidth ? el.clientWidth - 8 : 40;
    const k = Math.max(1, Math.floor(box*dpr / Math.max(src.width, src.height)));
    cv.width = src.width*k; cv.height = src.height*k;
    const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, cv.width, cv.height);
  });
}
function paintAll(){ paintStages(); paintIcons(); }
sheet.onload = () => { sheetReady = true; dollCache.clear(); iconCache.clear(); paintAll(); };
sheet.src = SHEET_SRC;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduceMotion) setInterval(() => { frame++; paintStages(); }, 600);
window.addEventListener('resize', () => paintAll());
const ico = (slot, tier) => `<span class="ico rb${tier}" data-icon="${slot}:${tier}"><canvas></canvas></span>`;

/* ---------- render ---------- */

      return `<div class="stat ${k.includes(s)?'key':''}"><span class="k">${n}</span><span class="v">${eff(s)}</span>${b?`<span class="b">+${b}</span>`:''}</div>`; }).join('')}</div>

      <div><span class="px">${T.wins}</span><span class="label">대업</span></div>
      <div><span class="px">${T.caps}</span><span class="label">수호단</span></div>
    </div>
  </section>`;
}
function steps(){
  const st = [['event','사건'],['train','수련'],['battle','원정'],['review','결산']];
  const idx = st.findIndex(s=>s[0]===S.phase);
  return `<div class="steps">${st.map((s,i)=>`<span class="${i===idx?'on':i<idx?'done':''}">${s[1]}</span>`).join('')}</div>`;
}
function eventBlock(){
  const y = S.y, E = eventFor(y.event.t);
  if (y.eventDone) return `<div class="block"><div class="row"><h3>${E.t}</h3></div><p class="muted small">${E.x}</p><p class="logline fade">${y.eventDone}</p></div>`;
  return `<div class="block"><div class="row"><h3>${E.t}</h3><span>${die(y.event.a,y.event.b)}</span></div><p>${E.x}</p>
    <div class="choices">${E.c.map((c,i)=>`<button class="opt" data-act="event" data-i="${i}"><b>${c.l}</b>${c.d?`<small>${c.d}</small>`:''}</button>`).join('')}</div></div>`;
}
function trainBlock(){
  const y = S.y, k = cls().key;
  if (S.phase==='event') return '';
  const done = y.train.map((t,i)=>`<p class="logline fade">수련 ${i+1} · ${SN[t.stat]} ${die(t.d)} → <b>+${t.g}</b>${t.note}</p>`).join('');
  if (S.phase!=='train') return y.train.length ? `<div class="block"><h3>수련</h3>${done}</div>` : '';
  const hint = S.age<=21 ? '주사위 눈만큼' : S.age<=27 ? '주사위 눈의 절반(올림)만큼' : S.age<=30 ? '4 이상이면 1' : '더 이상';
  return `<div class="block"><div class="row between"><h3>수련</h3><span class="small muted">남은 횟수 <b class="px">${y.trainLeft}</b></span></div>
    <p class="small muted">${S.age}세는 ${hint} 오른다. 파란 테두리가 ${cls().name}의 핵심 능력이다.</p>
    ${done}
    ${y.trainLeft>0 ? `<div class="trainbtns">${STATS.map(([s,n])=>`<button class="${k.includes(s)?'key':''}" data-act="train" data-s="${s}">${n}<small>${S.stats[s]}</small></button>`).join('')}</div>`
      : `<div class="row"><button class="primary" data-act="battle">원정 떠나기</button></div>`}</div>`;
}
function battleBlock(){
  const B = S.y.battles; if (!B) return '';
  let h = `<div class="block"><h3>원정</h3>`;
  if (B.benchRoll!==null) h += `<p class="logline">예비대 출전 기회 ${die(B.benchRoll)} ${B.benchRoll>=4 ? '→ 부름을 받았다' : '→ 올해는 부름이 없었다'}</p>`;
  h += `<div>${B.list.map((b,i)=> b.skip
    ? `<div class="battle fade" style="animation-delay:${i*.1}s"><span class="m">${b.m}</span><span class="q">${b.q}</span><span class="badge bad">결장</span></div>`
    : `<div class="battle fade" style="animation-delay:${i*.1}s"><span class="m">${b.m}</span><span class="q">${b.q}</span><span class="badge ${b.cls}">${b.label} <span class="px">${b.rating.toFixed(1)}</span></span>
        <span class="sub">${die(b.a,b.bb)} ${sgn(b.mod)} = ${b.tot} · ${b.flavor}${b.merit?` · 공적 ${b.merit}`:''}${b.injury?` · ${b.injury}`:''}
        ${b.loot ? `<br><span class="loot">${b.loot==='full' ? '전리품이 있었지만 가방이 가득 찼다' : `전리품 · ${itemLabel(b.loot)}`}</span>` : ''}</span></div>`).join('')}</div>`;
  if (B.played) h += `<p class="logline">평균 평점 <b class="px">${B.avg.toFixed(2)}</b> · 공적 <b class="px">${B.merit}</b> · 임무 <b class="px">${B.missions}</b>회</p>`;
  h += `</div>`;
  if (S.phase==='battle') h += `<div class="row"><button class="primary" data-act="review">한 해 결산</button></div>`;
  return h;
}
function reviewBlock(){
  const R = S.y.review; if (!R) return '';
  let h = `<div class="block"><h3>결산</h3><div class="reslist">${R.lines.map(([a,b])=>`<div class="res fade"><span class="k">${a}</span><span>${b}</span></div>`).join('')}</div>`;
  if (R.offer && !S.y.offerDecided){
    h += `<p><b>${FACTIONS[R.offer.to].name}</b>(선봉 기준 ${FACTIONS[R.offer.to].lv})로 ${R.offer.kind==='파견'?'파견 갈까?':'옮길까?'} 지금 전투력 ${cp()}.</p>
      <div class="row"><button class="primary" data-act="offer" data-v="1">${R.offer.kind==='파견'?'파견 간다':'옮긴다'}</button><button data-act="offer" data-v="0">남는다</button></div>`;
  } else if (R.offerResult) h += `<p class="logline">→ ${R.offerResult}</p>`;
  h += `</div>`;
  if (S.y.offerDecided){
    h += R.retire ? `<div class="row"><button class="primary" data-act="retire">은퇴식 열기</button></div>`
      : `<div class="row"><button class="primary" data-act="next">${S.age+1}세로 넘어가기</button>${S.age>=30?'<button data-act="retire">스스로 은퇴한다</button>':''}</div>`;
  }
  return h;
}
function seasonCard(){
  const y = S.y, F = FACTIONS[S.fac];
  return `<section class="card stack">
    <div class="row between"><h2>${S.age}세 시즌</h2>${steps()}</div>
    <p class="small muted">${F.name} · 올해 <b style="color:var(--ink)">${ROLES[y.role]}</b>${y.role===2?' · 원정 5회':y.role===1?' · 원정 3회':' · 기회가 오면 원정 1회'}</p>
    ${y.notes.map(n=>`<p class="logline">${n}</p>`).join('')}
    ${eventBlock()}${trainBlock()}${battleBlock()}${reviewBlock()}
  </section>`;
}
function bagCard(){
  const items = S.bag.slice().sort((a,b)=>b.tier-a.tier);
  const body = items.length ? `<div class="bag">${items.map(it=>{
      const cur = S.equip[it.slot], d = itemVal(it) - (cur ? (itemStat(cur,S.cls)===itemStat(it,S.cls) ? itemVal(cur) : 0) : 0);
      return `<div class="item">${ico(it.slot,it.tier)}<div class="body"><div class="label">${SLOTN[it.slot]} · ${RARITY[it.tier]}${it.isNew?'<span class="new">NEW</span>':''}</div>
        <div class="nm rar${it.tier}">${itemName(it,S.cls)}</div>
        <div class="small">${SN[itemStat(it,S.cls)]} +${itemVal(it)} <span class="diff ${d>0?'up':d<0?'down':''}">(${d>0?'▲'+d:d<0?'▼'+(-d):'같음'})</span></div>
        <div class="row"><button class="sm primary" data-act="equip" data-id="${it.id}">장착</button><button class="sm" data-act="drop" data-id="${it.id}">버리기</button></div></div></div>`; }).join('')}</div>`
    : `<p class="small muted">원정에서 활약하면 전리품이 떨어진다. 장착한 장비는 캐릭터 모습과 능력치에 바로 반영된다.</p>`;
  const eqd = SLOTS.filter(([s])=>S.equip[s]).map(([s,n])=>`<button class="sm" data-act="unequip" data-s="${s}">${n} 벗기</button>`).join('');
  return `<section class="card stack"><div class="row between"><h2>가방</h2><span class="small muted"><span class="px">${S.bag.length}</span>/16</span></div>${body}
    ${!S.retired && eqd ? `<div class="row">${eqd}</div>` : ''}</section>`;
}
function historyCard(){
  if (!S.hist.length) return '';
  const rows = S.hist.slice().reverse().map(h=>`<tr><td>${h.age}</td><td>${FACTIONS[h.fac].name}</td><td>${ROLES[h.role]}</td><td>${h.cpS}→${h.cpE}</td><td>${h.avg==null?'—':h.avg.toFixed(2)}</td><td>${h.merit}</td><td>${h.res}</td><td>${h.award||''}</td></tr>`).join('');
  return `<section class="card stack"><h2>커리어 기록</h2><div class="tablewrap"><table><thead><tr><th>나이</th><th>소속</th><th>역할</th><th>전투력</th><th>평점</th><th>공적</th><th>소속 성적</th><th>수상</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function hallCard(){
  const h = hall();
  const body = h.length
    ? `<div class="tablewrap"><table><thead><tr><th>#</th><th>이름</th><th>직업</th><th>영웅의 별</th><th>최고 전투력</th><th>칭호</th><th>공적</th><th>등급</th></tr></thead><tbody>
      ${h.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${CLASSES[x.cls].name}</td><td>${x.stars}</td><td>${x.peak}</td><td>${x.titles}</td><td>${x.merit}</td><td>${x.grade}</td></tr>`).join('')}</tbody></table></div>`
    : `<p class="small muted">아직 은퇴한 모험가가 없다. 커리어를 끝까지 마치면 여기에 이름이 남는다. 순위는 영웅의 별 → 최고 전투력 → 칭호 → 공적 순.</p>`;
  return `<section class="card stack"><h2>명예의 전당</h2>${body}</section>`;
}
function saveCard(){
  return `<section class="card"><details><summary>저장 파일 내보내기 · 가져오기</summary>
    <div class="stack" style="margin-top:10px">
      <p class="small muted">진행은 이 브라우저에 자동 저장된다. 다른 기기로 옮기려면 아래 내용을 복사해 두었다가 붙여 넣는다.</p>
      <textarea id="savebox" rows="4" aria-label="저장 데이터">${S ? esc(JSON.stringify(S)) : ''}</textarea>
      <div class="row"><button class="sm" data-act="copy">복사</button><button class="sm" data-act="import">붙여 넣은 내용 불러오기</button>
      ${S && !S.retired ? '<button class="link" data-act="abandon">이 커리어 버리기</button>' : ''}</div>
      <p class="small muted" id="savemsg" role="status"></p>
    </div></details></section>`;
}
function createCard(){
  const cands = candidates(draft.cls), C = CLASSES[draft.cls];
  return `<section class="card stack">
    <div class="hero">
      <div class="stage"><canvas class="scene" width="40" height="28" data-hero="draft" role="img" aria-label="견습생 미리보기"></canvas></div>
      <div class="who"><span class="label">마을 자경단 · 견습생 등록</span><span class="name">새 견습생</span>
        <p class="small muted">열다섯 살 예비대에서 시작해 영웅의 별까지. 해마다 수련하고, 원정을 떠나고, 전리품으로 몸을 꾸민다.</p></div>
    </div>
    <div class="grid2">
      <label class="stack" style="gap:4px"><span class="label">이름</span><input id="f-name" maxlength="12" value="${esc(draft.name)}"></label>
      <label class="stack" style="gap:4px"><span class="label">출신</span><select id="f-origin">${ORIGINS.map(o=>`<option ${o===draft.origin?'selected':''}>${o}</option>`).join('')}</select></label>
    </div>
    <div class="grid2">
      <div class="stack" style="gap:6px"><span class="label">피부</span>
        <div class="swatches">${SKINS.map(([c,n],i)=>`<button class="sw" style="background:${c}" data-act="skin" data-v="${i}" aria-pressed="${i===draft.skin}" aria-label="${n}" title="${n}"></button>`).join('')}</div></div>
      <div class="stack" style="gap:6px"><span class="label">머리색</span>
        <div class="swatches">${HAIRS.map(([c,n],i)=>`<button class="sw" style="background:${c}" data-act="hair" data-v="${i}" aria-pressed="${i===draft.hair}" aria-label="${n}" title="${n}"></button>`).join('')}</div></div>
    </div>
    <div class="stack" style="gap:6px"><span class="label">머리 모양</span>
      <div class="row">${HAIR_STYLES.map(([n],i)=>`<button class="opt" style="padding:6px 12px" data-act="hstyle" data-v="${i}" aria-pressed="${i===draft.hairStyle}">${n}</button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><span class="label">직업</span>
      <div class="choices">${Object.entries(CLASSES).map(([id,c])=>`<button class="opt" data-act="cls" data-v="${id}" aria-pressed="${id===draft.cls}"><b>${c.name}</b><small>${c.desc}</small><small>핵심 ${c.key.map(x=>SN[x]).join(' · ')}</small></button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><span class="label">후보 · 셋 다 전투력 45, 능력치 합 240</span>
      <div class="choices">${cands.map((cd,i)=>`<button class="opt" data-act="cand" data-v="${i}" aria-pressed="${i===draft.cand}"><b>${cd.style}</b>
        <small>${STATS.map(([s,n])=>C.key.includes(s)?`<b style="color:var(--ink)">${n} ${cd.stats[s]}</b>`:`${n} ${cd.stats[s]}`).join(' · ')}</small></button>`).join('')}</div></div>
    <p class="small muted">잠재력과 기질은 비밀이다. 기질은 스물한 살에, 잠재력은 은퇴할 때 드러난다.</p>
    <div class="row"><button class="primary" data-act="start">견습생으로 등록</button></div>
  </section>`;
}
function retiredCard(){
  const T = S.tot;
  return `<section class="card stack">
    <div class="row between"><h2>은퇴식 · ${S.age}세</h2><span class="stampwin">${S.grade}</span></div>
    <p>${esc(S.name)}은(는) ${S.hist.length}년의 모험을 마치고 무기를 내려놓았다. 최고 전투력 <b class="px">${S.peak}</b>, 잠재력은 <b class="px">${S.pot}</b>였다.</p>
    <p class="small muted">대륙 대전 우승 ${T.tourWins}회 · 임무 ${T.missions}회</p>
    ${S.awards.length ? `<p class="small">${S.awards.join(' · ')}</p>` : ''}
    <div class="row"><button class="primary" data-act="new">새 견습생 받기</button></div>
  </section>`;
}
function render(){
  let h = `<div class="topbar"><span class="brand">내 공책 그정도 아님</span>${S && !S.retired ? `<span class="small muted">${S.hist.length+1}년차</span>` : ''}</div>`;
  if (!S) h += createCard();
  else if (S.phase==='retired') h += heroPanel() + retiredCard() + bagCard() + historyCard();
  else h += heroPanel() + seasonCard() + bagCard() + historyCard();
  h += hallCard() + saveCard();
  app.innerHTML = h;
  paintAll();
}

/* ---------- events ---------- */
app.addEventListener('input', e => { if (e.target.id==='f-name') draft.name = e.target.value; });
app.addEventListener('change', e => { if (e.target.id==='f-origin') draft.origin = e.target.value; });
app.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a==='cls'){ draft.cls = b.dataset.v; draft.cand = 0; render(); return; }
  if (a==='cand'){ draft.cand = +b.dataset.v; render(); return; }
  if (a==='hair'){ draft.hair = +b.dataset.v; render(); return; }
  if (a==='skin'){ draft.skin = +b.dataset.v; render(); return; }
  if (a==='hstyle'){ draft.hairStyle = +b.dataset.v; render(); return; }
  if (a==='start'){ newGame(); render(); window.scrollTo({top:0}); return; }
  if (a==='event'){ const E = eventFor(S.y.event.t); S.y.eventDone = E.c[+b.dataset.i].f(); S.phase = 'train'; save(); render(); return; }
  if (a==='train'){ doTrain(b.dataset.s); return; }
  if (a==='battle'){ doBattles(); return; }
  if (a==='review'){ doReview(); return; }
  if (a==='offer'){ decideOffer(b.dataset.v==='1'); return; }
  if (a==='next'){ S.bag.forEach(x=>x.isNew=false); startYear(false); render(); window.scrollTo({top:0}); return; }
  if (a==='retire'){ retire(); window.scrollTo({top:0}); return; }
  if (a==='equip'){ equipItem(b.dataset.id); return; }
  if (a==='unequip'){ unequip(b.dataset.s); return; }
  if (a==='drop'){
    if (b.dataset.confirm){ dropItem(b.dataset.id); return; }
    b.dataset.confirm = '1'; b.textContent = '정말 버린다'; return;
  }
  if (a==='new'){ S = null; store.del(SAVE_KEY); draft = {name:pick(NAMES), origin:ORIGINS[4], cls:'warrior', cand:0, hair:1, hairStyle:0, skin:0}; render(); window.scrollTo({top:0}); return; }
  if (a==='abandon'){
    if (b.dataset.confirm){ S = null; store.del(SAVE_KEY); render(); return; }
    b.dataset.confirm = '1'; b.textContent = '정말 버린다 (되돌릴 수 없음)'; return;
  }
  const msg = document.getElementById('savemsg'), box = document.getElementById('savebox');
  if (a==='copy'){
    try { await navigator.clipboard.writeText(box.value); msg.textContent = '복사했다.'; }
    catch(err){ box.select(); msg.textContent = '자동 복사가 막혀 있다. 선택된 내용을 직접 복사한다.'; }
    return;
  }
  if (a==='import'){
    try {
      const d = JSON.parse(box.value);
      if (!d || !d.stats || !d.cls || !CLASSES[d.cls]) throw new Error();
      S = migrate(d); save(); render(); window.scrollTo({top:0});
    } catch(err){ msg.textContent = '불러오지 못했다. 저장 내용 전체를 그대로 붙여 넣었는지 확인한다.'; }
  }
});
function migrate(d){
  if (!d) return d;
  if (!d.equip) d.equip = {weapon:{id:uid(),slot:'weapon',tier:0}, helm:null, armor:{id:uid(),slot:'armor',tier:0}, shield:null};
  if ('cape' in d.equip){ d.equip.shield = d.equip.cape ? {...d.equip.cape, slot:'shield'} : null; delete d.equip.cape; }
  if (!d.bag) d.bag = [];
  d.bag.forEach(it => { if (it.slot==='cape') it.slot = 'shield'; });
  if (d.hair==null) d.hair = 1;
  if (d.hairStyle==null) d.hairStyle = 0;
  if (d.skin==null) d.skin = 0;
  return d;
}
function boot(data){
  S = migrate((data && data.S) || store.get(SAVE_KEY) || null);
  if (data && data.draft) draft = {hairStyle:0, skin:0, ...data.draft};
  render();
}
window.claude?.hot?.snapshot?.(() => ({S, draft}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
